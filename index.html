    function loadSavedPinsWithMigration() {
      try {
        const masterData = localStorage.getItem(STORAGE_KEY_PINS);

            return parsedV6.pins;

          "travel_planner_pins_v11",

          "travel_planner_pins_v6",
          "travel_planner_pins_v5",
          "travel_planner_pins_v4",
          "travel_planner_pins"

          const raw = localStorage.getItem(key);

            const arr = JSON.parse(raw);

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function formatMinutesToKorean(mins) {
      const m = Math.round(Number(mins) || 0);
      if (m <= 0) return "1분";
      const hours = Math.floor(m / 60);
      const remMins = m % 60;
      if (hours > 0 && remMins > 0) return `${hours}시간 ${remMins}분`;
      if (hours > 0) return `${hours}시간`;
      return `${remMins}분`;
    }

    function estimateTransitInfo(pinA, pinB) {
      if (!pinA || !pinB) return null;
      const straightKm = getDistanceKm(pinA.lat, pinA.lng, pinB.lat, pinB.lng);

      const walkRoadKm = straightKm * 1.28;
      const walkMinutes = Math.max(2, Math.round((walkRoadKm / 4.5) * 60));
      const walkFormatted = formatMinutesToKorean(walkMinutes);

      let transitMinutes = 0;
      let transitMode = "";

      if (pinB.customTransitMinutes && Number(pinB.customTransitMinutes) > 0) {
        transitMinutes = Number(pinB.customTransitMinutes);
        transitMode = "🚇 대중교통(직접지정)";
      } else if (straightKm < 0.55) {
        transitMinutes = walkMinutes;
        transitMode = "🚶 도보권";
      } else if (straightKm < 15) {
        transitMinutes = Math.round(((straightKm * 1.25) / 24) * 60 + 7);
        transitMode = "🚇 지하철·시내버스";
      } else if (straightKm < 65) {
        transitMinutes = Math.round(((straightKm * 1.2) / 45) * 60 + 12);
        transitMode = "🚆 급행전철·공항특급";
      } else {
        transitMinutes = Math.round((straightKm / 120) * 60 + 22);
        transitMode = "🚄 신칸센·특급열차";
      }

      const transitFormatted = formatMinutesToKorean(transitMinutes);

      return {
        distanceKm: straightKm.toFixed(1),
        walkMinutes,
        walkFormatted,
        transitMinutes,
        transitFormatted,
        totalMinutes: transitMinutes,
        formatted: transitFormatted,
        mode: transitMode
      };
    }

    function optimizePinsShortestRoute(pinList) {
      if (!pinList || pinList.length <= 2) return pinList;

      const startPin = pinList[0];
      const remaining = pinList.slice(1);
      const ordered = [startPin];

      while (remaining.length > 0) {
        const current = ordered[ordered.length - 1];
        let nearestIdx = 0;
        let minDist = Infinity;

        for (let i = 0; i < remaining.length; i++) {
          const d = getDistanceKm(current.lat, current.lng, remaining[i].lat, remaining[i].lng);
          if (d < minDist) {
            minDist = d;
            nearestIdx = i;
          }
        }
        ordered.push(remaining.splice(nearestIdx, 1)[0]);
      }

      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 1; i < ordered.length - 2; i++) {
          for (let j = i + 1; j < ordered.length - 1; j++) {
            const d1 =
              getDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[i].lat, ordered[i].lng) +
              getDistanceKm(ordered[j].lat, ordered[j].lng, ordered[j + 1].lat, ordered[j + 1].lng);
            const d2 =
              getDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[j].lat, ordered[j].lng) +
              getDistanceKm(ordered[i].lat, ordered[i].lng, ordered[j + 1].lat, ordered[j + 1].lng);

            if (d2 + 0.01 < d1) {
              const reversedSub = ordered.slice(i, j + 1).reverse();
              ordered.splice(i, j - i + 1, ...reversedSub);
              improved = true;
            }
          }
        }
      }

      return ordered;
    }

    function getTotalRouteKm(pinList) {
      let sum = 0;
      for (let i = 0; i < pinList.length - 1; i++) {
        sum += getDistanceKm(pinList[i].lat, pinList[i].lng, pinList[i + 1].lat, pinList[i + 1].lng);
      }
      return sum;
    }

    function formatKRW(num) {
      return Math.round(Number(num || 0)).toLocaleString("ko-KR") + "원";
    }
    function formatJPY(num) {
      return "¥" + Math.round(Number(num || 0)).toLocaleString("ja-JP");
    }

    function extractUrlAndHintFromInput(rawInput) {
      if (!rawInput || typeof rawInput !== "string") {
        return { cleanUrl: null, textHint: "" };
      }
      const trimmed = rawInput.trim();
      const urlMatch = trimmed.match(/(https?:\/\/[^\s"'<>]+)/i);
      if (!urlMatch) {
        return { cleanUrl: null, textHint: trimmed };
      }
      const cleanUrl = urlMatch[1].replace(/[).,;]+$/, "");
      const textHint = trimmed
        .replace(urlMatch[0], " ")
        .replace(/Google\s*지도에서\s*보기/gi, "")
        .replace(/Shared\s*via\s*Google\s*Maps/gi, "")
        .replace(/\s+/g, " ")
        .trim();
      return { cleanUrl, textHint };
    }

    function parseGoogleMapsUrlClient(rawInput) {
      try {
        const { cleanUrl, textHint } = extractUrlAndHintFromInput(rawInput);
        const target = cleanUrl || rawInput;
        if (!target) return null;

        // 모바일 구글맵 단축 링크(maps.app.goo.gl / goo.gl)는 서버 리다이렉트 추적(/api/resolve)을 거치도록 null 반환
        if (target.includes("maps.app.goo.gl") || target.includes("goo.gl/maps") || target.includes("goo.gl/")) {
          const hasInlineCoords = /(!3d-?\d+\.\d+!4d-?\d+\.\d+|@-?\d+\.\d+,-?\d+\.\d+)/.test(target);
          if (!hasInlineCoords) return null;
        }

        const decoded = (() => {
          try {
            return decodeURIComponent(target);
          } catch (e) {
            return target;
          }
        })();

        let name = textHint || "구글 지도 공유 장소";
        const placeMatch = decoded.match(/\/maps\/(?:place|search)\/([^/@?&]+)/);
        if (placeMatch && placeMatch[1]) {
          const candidate = placeMatch[1].replace(/\+/g, " ").trim();
          if (candidate && !/^(-?\d+\.\d+),(-?\d+\.\d+)$/.test(candidate)) {
            name = candidate;
          }
        } else {
          const qMatch = decoded.match(/[?&](?:q|query)=([^&]+)/);
          if (qMatch && qMatch[1]) {
            const candidate = qMatch[1].replace(/\+/g, " ").trim();
            if (candidate && !/^(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)$/.test(candidate)) {
              name = candidate;
            }
          }
        }

        let lat = null;
        let lng = null;
        const exactMatches = [...decoded.matchAll(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g)];
        if (exactMatches.length > 0) {
          const last = exactMatches[exactMatches.length - 1];
          lat = parseFloat(last[1]);
          lng = parseFloat(last[2]);
        } else {
          const atMatch =
            decoded.match(/center=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i) ||
            decoded.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            decoded.match(/[?&](?:q|query|ll|sll|daddr)=(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/);
          if (atMatch) {
            lat = parseFloat(atMatch[1]);
            lng = parseFloat(atMatch[2]);
          }
        }

        if (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng)) {
          return {
            name,
            address: textHint || `구글 지도 링크 정확한 좌표 (${lat.toFixed(5)}, ${lng.toFixed(5)})`,
            lat,
            lng,
            spendInfo: estimateGoogleAvgSpend(name, "")
          };
        }
      } catch (e) {}
      return null;
    }

      // =========================================================================
      // ☁️ couple-calendar-new 의 Supabase 실시간 동기화 엔진 (WebSocket + REST)
      // =========================================================================
      const hasLocalMeaningfulData = (stateObj) => {
        if (!stateObj) return false;
        if (Array.isArray(stateObj.pins) && stateObj.pins.length > 0) return true;
        if (
          Array.isArray(stateObj.notes) &&
          stateObj.notes.some((n) => n && n.content && n.content.trim().length > 0)
        ) {
          return true;
        }
        return false;
      };

      const applyRemotePayload = (remote, isManual = false) => {
        if (!remote || typeof remote !== "object") return false;

        const remoteUpdatedAt = Number(remote.updatedAt || 0);
        if (
          !isManual &&
          remoteUpdatedAt > 0 &&
          lastUpdatedAtRef.current > 0 &&
          remoteUpdatedAt <= lastUpdatedAtRef.current
        ) {
          setSyncStatus("synced");
          return false;
        }

        const currentLocal = latestStateRef.current;
        const remotePins = Array.isArray(remote.pins) ? remote.pins : [];

        // 핵심 보호 로직: 만약 클라우드 데이터가 비어 있는데 내 기기(예: 맥북)에 기존 핀이나 메모가 있다면,
        // 빈 데이터로 덮어쓰지 않고 내 기기의 데이터를 즉시 클라우드로 업로드하여 모든 폰에 전파!
        if (
          remotePins.length === 0 &&
          !remote.explicitlyCleared &&
          hasLocalMeaningfulData(currentLocal)
        ) {
          isInitialCloudLoadedRef.current = true;
          pushCloudData(
            {
              ...currentLocal,
              forceOverwrite: true
            },
            true
          );
          return true;
        }

        isApplyingRemoteRef.current = true;
        lastUpdatedAtRef.current = remoteUpdatedAt || Date.now();

        if (Array.isArray(remote.pins)) {
          setPins(remote.pins);
          if (remote.pins.length > 0) {
            setSelectedPinId((prevId) =>
              remote.pins.some((p) => p.id === prevId) ? prevId : remote.pins[0].id
            );
          }
        }
        if (remote.tripTitle) setTripTitle(remote.tripTitle);
        if (remote.exchangeRate) setExchangeRate(Number(remote.exchangeRate));
        if (remote.peopleCount) setPeopleCount(Number(remote.peopleCount));
        if (Array.isArray(remote.notes) && remote.notes.length > 0) setNotes(remote.notes);
        if (Array.isArray(remote.checklist) && remote.checklist.length > 0) {
          setChecklist(remote.checklist);
        }

        setLastSyncedTime(
          new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
        );
        setSyncStatus("synced");

        setTimeout(() => {
          isApplyingRemoteRef.current = false;
          isInitialCloudLoadedRef.current = true;
        }, 350);

        if (isManual) {
          showToast("☁️ 클라우드에서 최신 여행 일정과 메모를 동기화했습니다!");
        }
        return true;
      };

      const fetchCloudData = async (isManual = false) => {
        try {
          if (isManual) setSyncStatus("connecting");
          let remote = null;

          // 1순위: couple-calendar-new 와 동일한 Supabase 직접 조회
          if (supabaseClient) {
            const { data: row, error } = await supabaseClient
              .from("couple_calendar")
              .select("*")
              .eq("date", SUPABASE_SYNC_KEY)
              .maybeSingle();

            if (!error && row) {
              if (row.hae_shift && typeof row.hae_shift === "object") {
                remote = row.hae_shift;
              } else if (row.hae_memo && typeof row.hae_memo === "string") {
                try {
                  remote = JSON.parse(row.hae_memo);
                } catch (e) {}
              }
            }
          }

          // 2순위: /api/sync 서버리스 엔드포인트 조회
          if (!remote) {
            const res = await fetch(`/api/sync?t=${Date.now()}`, { cache: "no-store" });
            if (res.ok) {
              const json = await res.json();
              const candidate = json && json.data ? json.data : json;
              if (candidate && !candidate.empty) {
                remote = candidate;
              }
            }
          }

          if (remote && !remote.empty) {
            applyRemotePayload(remote, isManual);
            isInitialCloudLoadedRef.current = true;
          } else {
            // 클라우드에 아직 데이터가 없는 경우: 내 기기(맥북 등)에 데이터가 있을 때만 첫 기준점으로 업로드!
            // (빈 핸드폰이 먼저 접속했을 때 빈 배열을 업로드하지 않도록 방지)
            isInitialCloudLoadedRef.current = true;
            const currentLocal = latestStateRef.current;
            if (hasLocalMeaningfulData(currentLocal)) {
              await pushCloudData({ ...currentLocal, forceOverwrite: true }, true);
              showToast("☁️ 기기에 저장되어 있던 일정을 클라우드에 자동 업로드했습니다!");
            } else {
              setSyncStatus("synced");
            }
          }
        } catch (e) {
          setSyncStatus("offline");
          isInitialCloudLoadedRef.current = true;
        }
      };

      // ☁️ 2. 변경 사항을 Supabase (couple_calendar) 및 /api/sync 에 즉시 저장
      const pushCloudData = async (customPayload, isForce = false) => {
        try {
          const base = customPayload || latestStateRef.current;
          const pinsList = Array.isArray(base.pins) ? base.pins : [];

          // 빈 기기가 실수로 클라우드를 덮어쓰지 않도록 보호
          if (
            pinsList.length === 0 &&
            !explicitlyClearedRef.current &&
            !isForce &&
            !base.forceOverwrite &&
            !hasLocalMeaningfulData(base)
          ) {
            setSyncStatus("synced");
            return;
          }

          setSyncStatus("saving");
          const nowTs = Date.now();
          lastUpdatedAtRef.current = nowTs;

          const payload = {
            pins: pinsList,
            tripTitle: base.tripTitle || "우리의 일본 여행 ✈️",
            exchangeRate: Number(base.exchangeRate) || 9.05,
            peopleCount: Number(base.peopleCount) || 2,
            notes: Array.isArray(base.notes) ? base.notes : DEFAULT_NOTE_PAD,
            checklist: Array.isArray(base.checklist) ? base.checklist : [],
            explicitlyCleared: Boolean(explicitlyClearedRef.current || base.explicitlyCleared),
            forceOverwrite: Boolean(isForce || base.forceOverwrite),
            updatedAt: nowTs,
            clientId: CLIENT_ID
          };

          let savedOk = false;

          // 1순위: couple-calendar-new 와 동일한 Supabase 직접 Upsert (실시간 WebSocket 트리거)
          if (supabaseClient) {
            const { error } = await supabaseClient.from("couple_calendar").upsert(
              {
                date: SUPABASE_SYNC_KEY,
                memo: "",
                hae_shift: payload,
                hae_memo: JSON.stringify(payload)
              },
              { onConflict: "date" }
            );
            if (!error) savedOk = true;
          }

          // 2순위: /api/sync 백업 저장
          try {
            const res = await fetch("/api/sync", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (res.ok) savedOk = true;
          } catch (apiErr) {}

          if (savedOk) {
            setLastSyncedTime(
              new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
            );
            setSyncStatus("synced");
            if (isForce) {
              showToast("☁️ 현재 기기의 일정을 클라우드에 강제 동기화했습니다!");
            }
          } else {
            setSyncStatus("offline");
          }
        } catch (e) {
          setSyncStatus("offline");
        }
      };

      // 첫 실행 시 불러오기 + Supabase 실시간 WebSocket 구독 (couple-calendar-new 방식) + 포커스/백그라운드 동기화
      useEffect(() => {
        fetchCloudData(false);

        let channel = null;
        if (supabaseClient) {
          channel = supabaseClient
            .channel("public:couple_calendar:japan_travel_635")
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "couple_calendar" },
              (payload) => {
                if (payload.new && payload.new.date === SUPABASE_SYNC_KEY) {
                  let remote = payload.new.hae_shift;
                  if (!remote && payload.new.hae_memo) {
                    try {
                      remote = JSON.parse(payload.new.hae_memo);
                    } catch (e) {}
                  }
                  if (remote && remote.clientId !== CLIENT_ID) {
                    applyRemotePayload(remote, false);
                  }
                }
              }
            )
            .subscribe();
        }

        const timer = setInterval(() => {
          if (!isApplyingRemoteRef.current) {
            fetchCloudData(false);
          }
        }, 4000);

        const handleFocusOrVisible = () => {
          if (document.visibilityState === "visible" && !isApplyingRemoteRef.current) {
            fetchCloudData(false);
          }
        };
        window.addEventListener("focus", handleFocusOrVisible);
        document.addEventListener("visibilitychange", handleFocusOrVisible);

        return () => {
          clearInterval(timer);
          window.removeEventListener("focus", handleFocusOrVisible);
          document.removeEventListener("visibilitychange", handleFocusOrVisible);
          if (channel && supabaseClient) {
            supabaseClient.removeChannel(channel);
          }
        };
      }, []);

      // 내 기기에서 핀/제목/환율/메모장/체크리스트 수정 시 0.4초 뒤 클라우드 실시간 저장
      useEffect(() => {
        if (!isInitialCloudLoadedRef.current || isApplyingRemoteRef.current) return;
        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);

        saveTimeoutRef.current = setTimeout(() => {
          pushCloudData({
            pins,
            tripTitle,
            exchangeRate,
            peopleCount,
            notes,
            checklist
          });

        return () => {
          if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);

      const handleRecoverPreviousStorageData = () => {
        const allKeys = Object.keys(localStorage).filter((k) =>
          k.startsWith("travel_planner_pins")
        );
        let recovered = [];
        allKeys.forEach((k) => {
          try {
            const arr = JSON.parse(localStorage.getItem(k));
            if (Array.isArray(arr)) {
              arr.forEach((item) => {
                const isDefaultSample = ["pin-101", "pin-102", "pin-103", "pin-104"].includes(
                  item.id
                );
                const alreadyIn = recovered.some((r) => r.name === item.name);
                if (!isDefaultSample && !alreadyIn) {
                  recovered.push(item);
                }
              });
            }
          } catch (e) {}
        });

        if (recovered.length > 0) {
          setPins((prev) => {
            const merged = [...prev];
            recovered.forEach((r) => {
              if (!merged.some((m) => m.name === r.name)) merged.push(r);
            });
            return merged;
          });
          setShowResetModal(false);
          showToast(`✨ 기기에 남아 있던 장소 ${recovered.length}곳을 찾아 클라우드에 합쳤습니다!`);
        } else {
          showToast("이 기기에서 추가로 발견된 이전 장소가 없습니다.");
        }
      };

      const selectedPinIndex = useMemo(
        () => pins.findIndex((p) => p.id === selectedPinId),
        [pins, selectedPinId]
      );
      const selectedPin = useMemo(
        () => (selectedPinIndex !== -1 ? pins[selectedPinIndex] : pins[0] || null),
        [pins, selectedPinIndex]
      );

      const selectedPinAvgSpend = useMemo(() => {
        if (!selectedPin) return null;
        return selectedPin.spendInfo || estimateGoogleAvgSpend(selectedPin.name, selectedPin.category);
      }, [selectedPin]);

      const prevTransitInfo = useMemo(() => {
        if (selectedPinIndex > 0) {
          return {
            from: pins[selectedPinIndex - 1],
            to: pins[selectedPinIndex],
            info: estimateTransitInfo(pins[selectedPinIndex - 1], pins[selectedPinIndex])
          };
        }
        return null;
      }, [pins, selectedPinIndex]);

      const nextTransitInfo = useMemo(() => {
        if (selectedPinIndex !== -1 && selectedPinIndex < pins.length - 1) {
          return {
            from: pins[selectedPinIndex],
            to: pins[selectedPinIndex + 1],
            info: estimateTransitInfo(pins[selectedPinIndex], pins[selectedPinIndex + 1])
          };
        }
        return null;
      }, [pins, selectedPinIndex]);

      const budgetStats = useMemo(() => {
        let totalPlannedKRW = 0;
        let totalBoughtKRW = 0;
        let totalGoogleAvgYenPerPerson = 0;

        pins.forEach((pin) => {
          const avgObj = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
          totalGoogleAvgYenPerPerson += Number(avgObj.avgYen || 0);

          pin.items.forEach((item) => {
            const krw = Number(item.price || 0);
            totalPlannedKRW += krw;
            if (item.bought) totalBoughtKRW += krw;
          });
        });

        let totalTransitMinutes = 0;
        let totalWalkMinutes = 0;
        if (pins.length >= 2) {
          for (let i = 0; i < pins.length - 1; i++) {
            const info = estimateTransitInfo(pins[i], pins[i + 1]);
            if (info) {
              totalTransitMinutes += info.transitMinutes;
              totalWalkMinutes += info.walkMinutes;
            }
          }
        }
        const totalPlannedJPY = exchangeRate > 0 ? Math.round(totalPlannedKRW / exchangeRate) : 0;

        return {
          totalPlannedKRW,
          totalPlannedJPY,
          totalBoughtKRW,
          remainingKRW: totalPlannedKRW - totalBoughtKRW,
          perPersonKRW: peopleCount > 0 ? Math.ceil(totalPlannedKRW / peopleCount) : totalPlannedKRW,
          perPersonJPY: peopleCount > 0 ? Math.ceil(totalPlannedJPY / peopleCount) : totalPlannedJPY,
          totalTransitFormatted: totalTransitMinutes > 0 ? formatMinutesToKorean(totalTransitMinutes) : "0분",
          totalWalkFormatted: totalWalkMinutes > 0 ? formatMinutesToKorean(totalWalkMinutes) : "0분",
          totalTransitMinutes,
          totalWalkMinutes,
          totalGoogleAvgYenPerPerson,
          totalGoogleAvgKRWPerPerson: Math.round(totalGoogleAvgYenPerPerson * exchangeRate)
        };
      }, [pins, peopleCount, exchangeRate]);

      // 🌍 구글 한국어 지도 타일 초기화
      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        const initCenter = pins.length > 0 ? [pins[0].lat, pins[0].lng] : [34.6674727, 135.5039453];
        const map = L.map(mapContainerRef.current, {
          zoomControl: false,
          attributionControl: false
        }).setView(initCenter, 14);

        L.tileLayer("https://mt1.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}", {
          maxZoom: 20
        }).addTo(map);

        L.control.zoom({ position: "bottomleft" }).addTo(map);
        mapInstanceRef.current = map;
      }, []);

      const clearActiveAnimationLayers = () => {
        const map = mapInstanceRef.current;
        if (!map) return;
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        if (travelerMarkerRef.current) {
          map.removeLayer(travelerMarkerRef.current);
          travelerMarkerRef.current = null;
        }
        if (activeSegmentLineRef.current) {
          map.removeLayer(activeSegmentLineRef.current);
          activeSegmentLineRef.current = null;
        }
      };

      // 📍 지도 위 마커 + 도보/대중교통 2가지 시간 동시 표시 배지
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        markersRef.current.forEach((m) => map.removeLayer(m));
        markersRef.current = [];
        polylinesRef.current.forEach((l) => map.removeLayer(l));
        polylinesRef.current = [];

        if (pins.length === 0) {
          clearActiveAnimationLayers();
          return;
        }

        for (let i = 0; i < pins.length - 1; i++) {
          const pinA = pins[i];
          const pinB = pins[i + 1];
          const transit = estimateTransitInfo(pinA, pinB);

          const segmentLine = L.polyline(
            [
              [pinA.lat, pinA.lng],
              [pinB.lat, pinB.lng]
            ],
            {
              color: pinA.completed && pinB.completed ? "#10b981" : "#6366f1",
              weight: 5,
              opacity: 0.85,
              dashArray: pinA.completed && pinB.completed ? null : "8, 8"
            }
          ).addTo(map);

          if (transit) {
            segmentLine.bindTooltip(
              `${i + 1}→${i + 2}: 🚇${transit.transitFormatted} / 🚶${transit.walkFormatted}`,
              {
                permanent: true,
                direction: "center",
                className: "route-time-badge"
              }
            );
          }
          polylinesRef.current.push(segmentLine);
        }

        pins.forEach((pin, idx) => {
          const isSelected = pin.id === selectedPin?.id;
          const bgColor = pin.completed
            ? "linear-gradient(135deg, #10b981, #059669)"
            : isSelected
            ? "linear-gradient(135deg, #6366f1, #ec4899)"
            : "linear-gradient(135deg, #2563eb, #1d4ed8)";

          const iconHtml = `
            <div class="custom-pin ${isSelected ? "pin-active" : ""}" style="background: ${bgColor}; transform: rotate(-45deg) scale(${isSelected ? 1.2 : 1});">
              <span>${pin.completed ? "✓" : idx + 1}</span>
            </div>
          `;

          const customIcon = L.divIcon({
            html: iconHtml,
            className: "",
            iconSize: [38, 38],
            iconAnchor: [19, 38],
            popupAnchor: [0, -38]
          });

          const avgSpend = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
          const nextPin = pins[idx + 1];
          const nextTransit = nextPin ? estimateTransitInfo(pin, nextPin) : null;

          const marker = L.marker([pin.lat, pin.lng], {
            icon: customIcon,
            draggable: true
          })
            .addTo(map)
            .bindPopup(
              `<div style="min-width: 210px; line-height: 1.45;">
                <div style="font-size:11px; color:#818cf8; font-weight:800;">코스 #${idx + 1} · ${pin.category}</div>
                <div style="font-size:14px; font-weight:900; margin: 2px 0 4px; color:#fff;">${pin.name}</div>
                <div style="font-size:11px; color:#34d399; font-weight:800; background:rgba(16,185,129,0.12); padding:4px 7px; border-radius:8px; margin-bottom:5px;">
                  📊 구글맵 인당 평균: ${avgSpend.label} (약 ${formatKRW(avgSpend.avgYen * exchangeRate)})
                </div>
                ${
                  nextTransit
                    ? `<div style="margin-top:5px; padding-top:5px; border-top:1px solid #334155; font-size:11px; color:#fde047; font-weight:700;">
                        다음(${nextPin.name})까지:<br/>
                        🚇 대중교통 약 ${nextTransit.transitFormatted} · 🚶 도보 약 ${nextTransit.walkFormatted}
                      </div>`
                    : ""
                }
              </div>`
            );

          marker.on("click", () => {
            setSelectedPinId(pin.id);
          });

          marker.on("dragend", (e) => {
            const newPos = e.target.getLatLng();
            setPins((prev) =>
              prev.map((p) =>
                p.id === pin.id ? { ...p, lat: newPos.lat, lng: newPos.lng } : p
              )
            );
            setSelectedPinId(pin.id);
            showToast(`📍 '${pin.name}' 위치가 이동되어 클라우드에 동기화됩니다!`);
          });

          markersRef.current.push(marker);
        });
      }, [pins, selectedPin, exchangeRate]);

      const handleOptimizeShortestRoute = () => {
        if (pins.length < 3) {
          showToast("⚠️ 3개 이상의 장소가 있을 때 최단 경로 정렬이 가능합니다.");
          return;
        }
        const beforeKm = getTotalRouteKm(pins);
        const optimized = optimizePinsShortestRoute(pins);
        const afterKm = getTotalRouteKm(optimized);
        const savedKm = Math.max(0, beforeKm - afterKm).toFixed(1);

        setPins(optimized);
        setSelectedPinId(optimized[0].id);

        if (mapInstanceRef.current) {
          const bounds = L.latLngBounds(optimized.map((p) => [p.lat, p.lng]));
          mapInstanceRef.current.flyToBounds(bounds.pad(0.3), { duration: 0.9 });
        }

        if (Number(savedKm) > 0) {
          showToast(
            `⚡ 최단 경로 재구성 완료! #1 '${optimized[0].name}' 기준 총 이동거리가 ${savedKm}km 단축되었습니다!`
          );
        } else {
          showToast(`⚡ 현재 코스가 이미 가장 효율적인 최단 동선입니다!`);
        }
      };

      const handleApplyGoogleAvgSpend = (pin, multiplierPeople = 1) => {
        if (!pin) return;
        const avgInfo = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
        const yenAmount = Math.round(avgInfo.avgYen * multiplierPeople);
        const krwAmount = Math.round(yenAmount * exchangeRate);

        const newItem = {
          id: "item-" + Date.now(),
          title: `${avgInfo.recommendedTitle} (${multiplierPeople}인 평균)`,
          price: krwAmount,
          yen: yenAmount,
          bought: false
        };

        setPins((prev) =>
          prev.map((p) => (p.id === pin.id ? { ...p, items: [...p.items, newItem] } : p))
        );
        showToast(
          `💴 평균 지출액 ${formatJPY(yenAmount)} (${formatKRW(krwAmount)})이 예산에 추가되었습니다!`
        );
      };

      const handleFindMyLocation = () => {
        if (!navigator.geolocation) {
          showToast("브라우저가 GPS 위치 정보를 지원하지 않습니다.");
          return;
        }
        showToast("🛰️ 현재 위치를 확인 중입니다...");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const map = mapInstanceRef.current;
            if (map) {
              if (myGpsMarkerRef.current) map.removeLayer(myGpsMarkerRef.current);
              const gpsIcon = L.divIcon({
                html: `<div class="my-gps-marker">📍</div>`,
                className: "",
                iconSize: [32, 32],
                iconAnchor: [16, 16]
              });
              myGpsMarkerRef.current = L.marker([lat, lng], {
                icon: gpsIcon,
                zIndexOffset: 2000
              })
                .addTo(map)
                .bindPopup("<b>내 현재 위치</b>")
                .openPopup();
              map.flyTo([lat, lng], 16, { duration: 1.0 });
              showToast("📍 현재 위치가 지도에 표시되었습니다!");
            }
          },
          () => showToast("위치 권한을 허용해주세요."),
          { enableHighAccuracy: true, timeout: 10000 }
        );
      };

      const animateBetweenPins = (fromPin, toPin, onComplete) => {
        const map = mapInstanceRef.current;
        if (!map || !fromPin || !toPin) {
          if (onComplete) onComplete();
          return;
        }

        clearActiveAnimationLayers();
        const transit = estimateTransitInfo(fromPin, toPin);

        setAnimatingInfo({ fromPin, toPin, transit, progress: 0 });
        setLastCompletedSegment({ fromPin, toPin, transit });

        const bounds = L.latLngBounds([
          [fromPin.lat, fromPin.lng],
          [toPin.lat, toPin.lng]
        ]);
        map.flyToBounds(bounds.pad(0.45), { duration: 0.8 });

        const vehicleEmoji = transit.mode.includes("도보")
          ? "🏃"
          : transit.mode.includes("신칸센")
          ? "🚄"
          : "🚇";

        const travelerIcon = L.divIcon({
          html: `<div class="traveler-avatar">${vehicleEmoji}</div>`,
          className: "",
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });

        const travelerMarker = L.marker([fromPin.lat, fromPin.lng], {
          icon: travelerIcon,
          zIndexOffset: 1000
        }).addTo(map);
        travelerMarkerRef.current = travelerMarker;

        const activeLine = L.polyline([[fromPin.lat, fromPin.lng]], {
          color: "#ec4899",
          weight: 6,
          opacity: 0.95
        }).addTo(map);
        activeSegmentLineRef.current = activeLine;

        const durationMs = 2000;
        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const rawT = Math.min(1, elapsed / durationMs);
          const t = rawT < 0.5 ? 4 * rawT * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 3) / 2;

          const curLat = fromPin.lat + (toPin.lat - fromPin.lat) * t;
          const curLng = fromPin.lng + (toPin.lng - fromPin.lng) * t;

          travelerMarker.setLatLng([curLat, curLng]);
          activeLine.setLatLngs([
            [fromPin.lat, fromPin.lng],
            [curLat, curLng]
          ]);

          setAnimatingInfo((prev) =>
            prev ? { ...prev, progress: Math.round(rawT * 100) } : null
          );

          if (rawT < 1) {
            animFrameRef.current = requestAnimationFrame(step);
          } else {
            map.flyTo([toPin.lat, toPin.lng], 16, { duration: 0.8 });
            setTimeout(() => {
              clearActiveAnimationLayers();
              setAnimatingInfo(null);
              setSelectedPinId(toPin.id);
              const toIdx = pins.findIndex((p) => p.id === toPin.id);
              if (toIdx !== -1 && markersRef.current[toIdx]) {
                markersRef.current[toIdx].openPopup();
              }
              if (onComplete) onComplete();
            }, 800);
          }
        };

        animFrameRef.current = requestAnimationFrame(step);
      };

      const handleCompleteAndMoveNext = (pinId) => {
        const currentIndex = pins.findIndex((p) => p.id === pinId);
        if (currentIndex === -1) return;

        const currentPin = pins[currentIndex];
        const nextPin = pins[currentIndex + 1] || null;

        setPins((prev) =>
          prev.map((p) => (p.id === pinId ? { ...p, completed: true } : p))
        );

        if (nextPin) {
          const tInfo = estimateTransitInfo(currentPin, nextPin);
          showToast(
            `✅ '${currentPin.name}' 완료! 다음 '${nextPin.name}'까지 대중교통 ${tInfo.transitFormatted} / 도보 ${tInfo.walkFormatted}`
          );
          if (mobileView === "list" || mobileView === "detail") {
            setMobileView("split");
          }
          animateBetweenPins(currentPin, nextPin);
        } else {
          showToast(`🎉 모든 여행 코스를 완료했습니다!`);
        }
      };

      const handlePlayFullJourney = () => {
        if (pins.length < 2 || isJourneyPlaying) return;
        setActiveTab("itinerary");
        setMobileView("split");
        setIsJourneyPlaying(true);
        showToast("🎬 전체 이동 경로 시뮬레이션을 시작합니다!");

        let idx = 0;
        const playNext = () => {
          if (idx >= pins.length - 1) {
            setIsJourneyPlaying(false);
            showToast("✨ 전체 코스 주행이 완료되었습니다.");
            return;
          }
          animateBetweenPins(pins[idx], pins[idx + 1], () => {
            idx += 1;
            setTimeout(playNext, 450);
          });
        };
        playNext();
      };

      const handleExportJSON = () => {
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(
            JSON.stringify({ tripTitle, exchangeRate, peopleCount, pins, notes, checklist }, null, 2)
          );
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `${tripTitle}_plan.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("💾 여행 계획과 메모장이 JSON 파일로 백업되었습니다!");
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsText(file, "UTF-8");
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed.pins) {
              setPins(parsed.pins);
              if (parsed.tripTitle) setTripTitle(parsed.tripTitle);
              if (parsed.exchangeRate) setExchangeRate(parsed.exchangeRate);
              if (parsed.notes) setNotes(parsed.notes);
              if (parsed.checklist) setChecklist(parsed.checklist);
              if (parsed.pins[0]) setSelectedPinId(parsed.pins[0].id);
              showToast("📂 여행 계획을 성공적으로 불러와 클라우드에 동기화합니다!");
            }
          } catch {
            showToast("⚠️ 올바른 JSON 파일이 아닙니다.");
          }
        };
      };

      // 🔍 구글 지도 링크(모바일 앱 공유 maps.app.goo.gl 포함) 해독 & 다국어(한/일/영) 검색 목록
      const executePlaceSearch = async (rawQueryInput) => {
        const query = (rawQueryInput ?? searchKeyword).trim();
        if (!query) return;

        setIsSearching(true);
        setSearchResults([]);
        setTranslatedInfo(null);

        try {
          const { cleanUrl, textHint } = extractUrlAndHintFromInput(query);
          const isUrl =
            Boolean(cleanUrl) ||
            query.startsWith("http://") ||
            query.startsWith("https://") ||
            query.includes("maps.app") ||
            query.includes("google.") ||
            query.includes("goo.gl") ||
            query.includes("/maps/");

          if (isUrl) {
            const clientParsed = parseGoogleMapsUrlClient(query);
            if (clientParsed) {
              setSearchResults([clientParsed]);
              setIsSearching(false);
              showToast("📍 구글맵 링크 좌표를 즉시 확인했습니다! [＋ 선택]을 눌러 추가하세요.");
              return;
            }
          }

          try {
            const targetUrlParam = cleanUrl || query;
            const apiParam = isUrl
              ? `url=${encodeURIComponent(targetUrlParam)}&hint=${encodeURIComponent(textHint || "")}`
              : `q=${encodeURIComponent(query)}`;
            const apiRes = await fetch(`/api/resolve?${apiParam}`);
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              if (apiData.translated) {
                setTranslatedInfo({
                  original: apiData.originalQuery || textHint || query,
                  ja: apiData.translated.ja,
                  en: apiData.translated.en
                });
              }

              // 모바일 구글맵 단축 링크(maps.app.goo.gl)에서 좌표가 바로 해독된 경우!
              if (
                apiData.resolved &&
                apiData.lat !== undefined &&
                apiData.lat !== null &&
                apiData.lng !== undefined &&
                apiData.lng !== null
              ) {
                const resolvedTitle = apiData.name || textHint || "구글맵 공유 장소";
                const primaryItem = {
                  name: resolvedTitle,
                  address: apiData.address || targetUrlParam,
                  lat: Number(apiData.lat),
                  lng: Number(apiData.lng),
                  spendInfo: estimateGoogleAvgSpend(resolvedTitle, customCategory)
                };
                const extraItems = Array.isArray(apiData.results)
                  ? apiData.results
                      .filter(
                        (r) =>
                          Math.abs(Number(r.lat) - primaryItem.lat) > 0.0005 ||
                          Math.abs(Number(r.lng) - primaryItem.lng) > 0.0005
                      )
                      .map((r) => ({
                        ...r,
                        lat: Number(r.lat),
                        lng: Number(r.lng),
                        spendInfo: estimateGoogleAvgSpend(r.name, customCategory)
                      }))
                  : [];
                setSearchResults([primaryItem, ...extraItems]);
                setIsSearching(false);
                showToast(`📍 '${resolvedTitle}' 위치를 찾았습니다! [＋ 선택]을 눌러주세요.`);
                return;
              }

              if (apiData.results && apiData.results.length > 0) {
                setSearchResults(
                  apiData.results.map((r) => ({
                    ...r,
                    lat: Number(r.lat),
                    lng: Number(r.lng),
                    spendInfo: r.spendInfo || estimateGoogleAvgSpend(r.name, customCategory)
                  }))
                );
                setIsSearching(false);
                return;
              }
            }
          } catch (err) {}

          // 만약 URL이었는데 서버 리다이렉트 추적이 실패했고 힌트 텍스트(가게 이름)도 없다면 URL 자체를 지오코더에 넣지 않음
          const fallbackKeyword = isUrl ? textHint : query;
          if (!fallbackKeyword || fallbackKeyword.startsWith("http")) {
            showToast("⚠️ 단축 링크에서 좌표를 찾지 못했습니다. 장소 이름으로 검색해보세요!");
            setIsSearching(false);
            return;
          }

          const translateDirect = async (text, tl) => {
            try {
              const r = await fetch(
                `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(
                  text
                )}`
              );
              const d = await r.json();
              return d?.[0]?.map((x) => x[0]).join("") || text;
            } catch {
              return text;
            }
          };

          const [jaKw, enKw] = await Promise.all([
            translateDirect(fallbackKeyword, "ja"),
            translateDirect(fallbackKeyword, "en")
          ]);
          setTranslatedInfo({ original: fallbackKeyword, ja: jaKw, en: enKw });

          const extra = [];
          if (enKw.toLowerCase().startsWith("hotel ")) {
            extra.push(enKw.replace(/^hotel\s+/i, "") + " Hotel");
          }

          const keywords = Array.from(
            new Set([fallbackKeyword, jaKw, enKw, ...extra].filter(Boolean))
          );
          const directList = [];

          await Promise.all(
            keywords.map(async (kw) => {
              try {
                const pRes = await fetch(
                  `https://photon.komoot.io/api/?q=${encodeURIComponent(kw)}&limit=6`
                );
                const pData = await pRes.json();
                if (pData?.features) {
                  pData.features.forEach((f) => {
                    const coords = f.geometry?.coordinates;
                    const props = f.properties || {};
                    if (coords && coords.length === 2) {
                      const title = props.name || props.street || kw;
                      const addr = [props.country, props.city, props.district, props.street]
                        .filter(Boolean)
                        .join(" ");
                      directList.push({
                        name: title,
                        address: addr || title,
                        lat: parseFloat(coords[1]),
                        lng: parseFloat(coords[0]),
                        spendInfo: estimateGoogleAvgSpend(title, customCategory)
                      });
                    }
                  });
                }
              } catch (e) {}

              try {
                const arcRes = await fetch(
                  `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine=${encodeURIComponent(
                    kw
                  )}&f=json&outFields=PlaceName,Place_addr,Match_addr&maxLocations=6`
                );
                const arcData = await arcRes.json();
                if (arcData?.candidates) {
                  arcData.candidates.forEach((c) => {
                    if (c.location) {
                      const title = c.attributes?.PlaceName || c.address.split(",")[0] || kw;
                      directList.push({
                        name: title,
                        address: c.attributes?.Place_addr || c.attributes?.Match_addr || c.address,
                        lat: c.location.y,
                        lng: c.location.x,
                        spendInfo: estimateGoogleAvgSpend(title, customCategory)
                      });
                    }
                  });
                }
              } catch (e) {}

              try {
                const nomRes = await fetch(
                  `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(
                    kw
                  )}&limit=5&accept-language=ko,ja,en`
                );
                const nomData = await nomRes.json();
                if (Array.isArray(nomData)) {
                  nomData.forEach((item) => {
                    const title = item.name || item.display_name.split(",")[0];
                    directList.push({
                      name: title,
                      address: item.display_name,
                      lat: parseFloat(item.lat),
                      lng: parseFloat(item.lon),
                      spendInfo: estimateGoogleAvgSpend(title, customCategory)
                    });
                  });
                }
              } catch (e) {}
            })
          );

          const unique = [];
          for (const item of directList) {
            if (
              !unique.some(
                (u) => Math.abs(u.lat - item.lat) < 0.0006 && Math.abs(u.lng - item.lng) < 0.0006
              )
            ) {
              unique.push(item);
            }
          }

          setSearchResults(unique.slice(0, 10));
        } finally {
          setIsSearching(false);
        }
      };

      const handleSearchPlacesAndLinks = async (e) => {
        if (e && e.preventDefault) e.preventDefault();

      const handlePasteFromClipboard = async () => {
        try {

            showToast("입력창을 길게 눌러 '붙여넣기'를 해주세요!");
            return;
          }
          const text = await navigator.clipboard.readText();
          if (text && text.trim()) {
            setSearchKeyword(text.trim());
            await executePlaceSearch(text.trim());
          } else {
            showToast("클립보드에 복사된 텍스트나 구글맵 링크가 없습니다.");
          }
        } catch (err) {

        }
      };

        const newPin = {
          id: "pin-" + Date.now(),
          name,
          category: finalCategory,
          address: address || "",
          lat: Number(lat),
          lng: Number(lng),
          completed: false,
          memo: "",
          customTransitMinutes: null,
          spendInfo: computedSpend,
          items: []
        };

        setPins((prev) => {
          const nextPins = [...prev, newPin];
          pushCloudData(
            {
              ...latestStateRef.current,
              pins: nextPins
            },
            false
          );
          return nextPins;
        });
        setSelectedPinId(newPin.id);
        setShowAddModal(false);
        setSearchKeyword("");
        setSearchResults([]);

        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo([newPin.lat, newPin.lng], 16, { duration: 0.9 });
        }
        showToast(`📍 '${newPin.name}' 추가 및 클라우드 실시간 동기화 완료!`);
      };

      const handleMovePinOrder = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= pins.length) return;
        const copied = [...pins];
        const temp = copied[index];
        copied[index] = copied[targetIndex];
        copied[targetIndex] = temp;
        setPins(copied);
      };

      const handleDragStart = (index) => {
        dragItemIndexRef.current = index;
      };
      const handleDragEnter = (index) => {
        dragOverIndexRef.current = index;
      };
      const handleDragEnd = () => {
        const from = dragItemIndexRef.current;
        const to = dragOverIndexRef.current;
        if (from !== null && to !== null && from !== to) {
          const updated = [...pins];
          const [moved] = updated.splice(from, 1);
          updated.splice(to, 0, moved);
          setPins(updated);
          showToast("🔄 코스 순서가 변경되었습니다!");
        }
        dragItemIndexRef.current = null;
        dragOverIndexRef.current = null;
      };

      const handleSavePinEdit = (pinId) => {

              </section>

              {/* 우측/하단: 준비물 & 할 일 체크리스트 (4칸 차지) */}
              <section className="lg:col-span-4 flex flex-col bg-slate-900 border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl">
                <h3 className="text-base sm:text-lg font-black text-white">
                  ✅ 여행 준비물 & 할 일 체크리스트
                </h3>
                <p className="text-xs text-slate-400 mt-0.5 mb-3">
                  함께 챙겨야 할 준비물이나 예약 할 일을 체크하세요.
                </p>

                <form onSubmit={handleAddChecklistItem} className="flex gap-2 mb-4">
                  <input
                    type="text"
                    value={newCheckText}
                    onChange={(e) => setNewCheckText(e.target.value)}
                    placeholder="준비물이나 할 일 추가 (예: 유심/eSIM 구매)"
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white"
                  />
                  <button
                    type="submit"
                    className="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shrink-0"
                  >
                    ＋ 추가
                  </button>
                </form>

                <div className="flex-1 overflow-y-auto space-y-2">
                  {checklist.map((item) => (
                    <div
                      key={item.id}
                      className={`flex items-center justify-between p-3 rounded-2xl border ${
                        item.done
                          ? "bg-emerald-950/20 border-emerald-500/40"
                          : "bg-slate-950 border-slate-800"
                      }`}
                    >
                      <label className="flex items-center gap-2.5 cursor-pointer flex-1">
                        <input
                          type="checkbox"
                          checked={item.done}
                          onChange={() =>
                            setChecklist((prev) =>
                              prev.map((c) => (c.id === item.id ? { ...c, done: !c.done } : c))
                            )
                          }
                          className="w-4 h-4 rounded accent-emerald-500"
                        />
                        <span
                          className={`text-xs sm:text-sm font-bold ${
                            item.done ? "line-through text-slate-400" : "text-white"
                          }`}
                        >
                          {item.text}
                        </span>
                      </label>
                      <button
                        onClick={() =>
                          setChecklist((prev) => prev.filter((c) => c.id !== item.id))
                        }
                        className="text-slate-400 hover:text-rose-500 text-xs px-1.5"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </section>
            </main>
          )}

          {/* =================================================================
              💰 메인 영역 3: 예산 · 정산 탭
             ================================================================= */}
          {(activeTab === "budget" || mobileView === "budget") && (
            <main className="flex-1 max-w-[1300px] w-full mx-auto p-3 sm:p-6 space-y-5">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
                <div className="text-xs font-bold text-slate-300">
                  💴 일본 엔화(¥) 자동 환산 기준 (1엔당 원화 설정):
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400">1엔 =</span>
                  <input
                    type="number"
                    step="0.05"
                    value={exchangeRate}
                    onChange={(e) => setExchangeRate(Number(e.target.value) || 9.0)}
                    className="w-24 bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-extrabold text-amber-300 text-right"
                  />
                  <span className="text-xs text-slate-300 font-bold">원</span>
                </div>
              </div>

              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                <div className="bg-slate-900 border border-slate-800 p-4 sm:p-5 rounded-3xl">
                  <span className="text-xs font-bold text-slate-400">내 총 계획 예산</span>
                  <div className="text-lg sm:text-2xl font-black text-white mt-1">
                    {formatKRW(budgetStats.totalPlannedKRW)}
                  </div>
                  <div className="text-xs sm:text-sm font-bold text-amber-300 mt-0.5">
                    약 {formatJPY(budgetStats.totalPlannedJPY)}
                  </div>
                </div>

                <div className="bg-slate-900 border border-emerald-500/30 p-4 sm:p-5 rounded-3xl">
                  <span className="text-xs font-bold text-emerald-400">📊 구글맵 기준 1인 평균 총합</span>
                  <div className="text-lg sm:text-2xl font-black text-emerald-400 mt-1">
                    {formatKRW(budgetStats.totalGoogleAvgKRWPerPerson)}
                  </div>
                  <p className="text-[11px] text-slate-400 mt-1">
                    코스 전체 1인 평균 ({formatJPY(budgetStats.totalGoogleAvgYenPerPerson)})
                  </p>
                </div>

                <div className="bg-slate-900 border border-amber-500/30 p-4 sm:p-5 rounded-3xl">
                  <span className="text-xs font-bold text-amber-400">결제 완료 / 남은 예산</span>
                  <div className="text-lg sm:text-2xl font-black text-amber-300 mt-1">
                    {formatKRW(budgetStats.remainingKRW)}
                  </div>
                  <p className="text-[11px] text-slate-400 mt-1">
                    완료: {formatKRW(budgetStats.totalBoughtKRW)}
                  </p>
                </div>

                <div className="bg-slate-900 border border-indigo-500/40 p-4 sm:p-5 rounded-3xl">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-indigo-400">1인당 정산 (1/N)</span>
                    <div className="flex items-center gap-1.5 bg-slate-950/60 px-2 py-0.5 rounded-lg border border-slate-800">
                      <button
                        onClick={() => setPeopleCount((c) => Math.max(1, c - 1))}
                        className="text-xs font-black text-indigo-400 px-1"
                      >
                        -
                      </button>
                      <span className="text-xs font-extrabold text-white">{peopleCount}명</span>
                      <button
                        onClick={() => setPeopleCount((c) => c + 1)}
                        className="text-xs font-black text-indigo-400 px-1"
                      >
                        +
                      </button>
                    </div>
                  </div>
                  <div className="text-lg sm:text-2xl font-black text-white mt-1">
                    {formatKRW(budgetStats.perPersonKRW)}
                  </div>
                  <div className="text-xs font-bold text-indigo-400 mt-0.5">
                    약 {formatJPY(budgetStats.perPersonJPY)}
                  </div>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 sm:p-6 space-y-3">
                <h3 className="text-sm sm:text-base font-extrabold text-white">
                  📊 장소별 구글 맵 평균 지출액 vs 내 예산 비교
                </h3>
                {pins.map((pin, idx) => {
                  const pinTotal = pin.items.reduce((s, i) => s + Number(i.price || 0), 0);
                  const avgSpend = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
                  return (
                    <div
                      key={pin.id}
                      className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 space-y-2"
                    >
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                          <span className="font-extrabold text-xs sm:text-sm text-white">
                            #{idx + 1} {pin.name}
                          </span>
                          <span className="ml-2 text-[11px] text-amber-300 font-bold">
                            (구글맵 인당 평균: {avgSpend.label} / 약 {formatKRW(avgSpend.avgYen * exchangeRate)})
                          </span>
                        </div>
                        <span className="font-black text-xs sm:text-sm text-emerald-400">
                          내 예산: {formatKRW(pinTotal)} ({formatJPY(Math.round(pinTotal / exchangeRate))})
                        </span>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {pin.items.map((it) => (
                          <span
                            key={it.id}
                            className="text-xs px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-slate-200"
                          >
                            {it.bought ? "✅ " : "🛍️ "} {it.title}: <b>{formatKRW(it.price)}</b>
                          </span>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* 모바일 하단 네비게이션 (5개 탭: 지도+코스 / 코스목록 / 장소상세 / 대형메모장 / 예산정산) */}
          <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 grid grid-cols-5 px-1.5 py-1.5">
            <button
              onClick={() => {
                setActiveTab("itinerary");
                setMobileView("split");
              }}
              className={`flex flex-col items-center py-1 rounded-xl text-[10px] font-extrabold ${
                mobileView === "split" ? "text-indigo-400 bg-indigo-500/15" : "text-slate-400"
              }`}
            >
              <span>🗺️</span>
              <span>지도+코스</span>
            </button>
            <button
              onClick={() => {
                setActiveTab("itinerary");
                setMobileView("list");
              }}
              className={`flex flex-col items-center py-1 rounded-xl text-[10px] font-extrabold ${
                mobileView === "list" ? "text-indigo-400 bg-indigo-500/15" : "text-slate-400"
              }`}
            >
              <span>📋</span>
              <span>코스({pins.length})</span>
            </button>
            <button
              onClick={() => {
                setActiveTab("itinerary");
                setMobileView("detail");
              }}
              className={`flex flex-col items-center py-1 rounded-xl text-[10px] font-extrabold ${
                mobileView === "detail" ? "text-indigo-400 bg-indigo-500/15" : "text-slate-400"
              }`}
            >
              <span>📊</span>
              <span>상세·평균값</span>
            </button>
            <button
              onClick={() => {
                setActiveTab("notepad");
                setMobileView("notepad");
              }}
              className={`flex flex-col items-center py-1 rounded-xl text-[10px] font-extrabold ${
                mobileView === "notepad" ? "text-amber-400 bg-amber-500/15" : "text-slate-400"
              }`}
            >
              <span>📝</span>
              <span>대형메모장</span>
            </button>
            <button
              onClick={() => {
                setActiveTab("budget");
                setMobileView("budget");
              }}
              className={`flex flex-col items-center py-1 rounded-xl text-[10px] font-extrabold ${
                mobileView === "budget" ? "text-emerald-400 bg-emerald-500/15" : "text-slate-400"
              }`}
            >
              <span>💰</span>
              <span>예산·정산</span>
            </button>
          </nav>

          {/* 검색 모달 */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-xl w-full p-4 sm:p-6 shadow-2xl space-y-3.5 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-sm sm:text-lg text-white">
                    📍 구글맵 링크 & 다국어(한/일/영) 장소 검색
                  </h3>
                  <button
                    onClick={() => setShowAddModal(false)}
                    className="text-slate-400 hover:text-white text-sm font-bold px-2 py-1"
                  >
                    ✕ 닫기
                  </button>
                </div>

                <form onSubmit={handleSearchPlacesAndLinks} className="space-y-2">
                  <div className="flex flex-col sm:flex-row gap-2">
                    <select
                      value={customCategory}
                      onChange={(e) => setCustomCategory(e.target.value)}
                      className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white"
                    >
                      <option>🏨 숙소·호텔</option>
                      <option>📸 명소·포토존</option>
                      <option>🍜 맛집</option>
                      <option>☕ 카페·디저트</option>
                      <option>🛍️ 쇼핑·드럭스토어</option>
                      <option>✈️ 공항·교통</option>
                    </select>
                    <div className="flex gap-1.5 flex-1">
                      <input
                        type="text"
                        value={searchKeyword}
                        onChange={(e) => setSearchKeyword(e.target.value)}
                        onPaste={(e) => {
                          const pasted = e.clipboardData?.getData("text");
                          if (
                            pasted &&
                            (pasted.includes("http") ||
                              pasted.includes("maps.app") ||
                              pasted.includes("goo.gl") ||
                              pasted.includes("google."))
                          ) {
                            setTimeout(() => executePlaceSearch(pasted), 60);
                          }
                        }}
                        placeholder="구글맵 공유 링크 붙여넣기 또는 한글/일어/영어 검색"
                        className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white"
                      />
                      <button
                        type="submit"
                        disabled={isSearching}
                        className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 keep-white font-extrabold text-xs shrink-0"
                      >
                        {isSearching ? "분석중..." : "🔍 검색"}
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center justify-between gap-2 pt-0.5">
                    <button
                      type="button"
                      onClick={handlePasteFromClipboard}
                      className="w-full py-2 px-3 rounded-xl bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-500/40 text-indigo-400 text-xs font-extrabold flex items-center justify-center gap-1.5 transition"
                    >
                      <span>📋 핸드폰 구글맵 앱에서 '공유 → 복사'한 링크 원터치 붙여넣기</span>
                    </button>
                  </div>

                  {translatedInfo && (
                    <div className="text-[11px] text-indigo-400 bg-indigo-950/40 px-3 py-1.5 rounded-xl border border-indigo-500/30">
                      🌐 자동 다국어 변환 검색됨: <b>{translatedInfo.original}</b> → 일문:{" "}
                      <b>{translatedInfo.ja}</b> / 영문: <b>{translatedInfo.en}</b>
                    </div>
                  )}
                </form>

                {searchResults.length > 0 && (
                  <div className="space-y-2 max-h-60 overflow-y-auto bg-slate-950 p-2.5 rounded-2xl border border-indigo-500/50">
                    <div className="text-xs font-extrabold text-emerald-400 px-1">
                      ✅ 검색 결과 목록 ({searchResults.length}건) — 인당 평균 지출액 자동 분석됨
                    </div>
                    {searchResults.map((res, idx) => {
                      const sp = res.spendInfo || estimateGoogleAvgSpend(res.name, customCategory);
                      return (
                        <div
                          key={idx}
                          onClick={() =>
                            addPinToMap({
                              name: res.name,
                              category: customCategory,
                              address: res.address,
                              lat: res.lat,
                              lng: res.lng,
                              spendInfo: sp
                            })
                          }
                          className="p-2.5 rounded-xl bg-slate-900 hover:bg-indigo-950/80 border border-slate-800 hover:border-indigo-500 cursor-pointer flex items-center justify-between gap-2"
                        >
                          <div>
                            <div className="text-xs sm:text-sm font-extrabold text-white">
                              {res.name}
                            </div>
                            <div className="text-[11px] text-slate-400 mt-0.5 line-clamp-1">
                              {res.address}
                            </div>
                            <div className="text-[11px] text-amber-300 font-bold mt-1">
                              📊 구글맵 인당 평균: {sp.label} (약 {formatKRW(sp.avgYen * exchangeRate)})
                            </div>
                          </div>
                          <span className="px-2.5 py-1.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black shrink-0">
                            ＋ 선택
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div>
                  <div className="text-xs font-bold text-slate-400 mb-1.5">
                    🇯🇵 자주 찾는 장소 빠른 추가
                  </div>
                  <div className="max-h-40 overflow-y-auto space-y-1.5 pr-1">
                    {PRESET_PLACES.map((p, i) => {
                      const sp = estimateGoogleAvgSpend(p.name, p.category);
                      return (
                        <div
                          key={i}
                          onClick={() => addPinToMap({ ...p, spendInfo: sp })}
                          className="p-2.5 rounded-xl bg-slate-950 hover:bg-indigo-950/50 border border-slate-800 cursor-pointer flex items-center justify-between"
                        >
                          <div>
                            <div className="text-xs font-extrabold text-white">{p.name}</div>
                            <div className="text-[10px] text-slate-400">
                              {p.category} · 인당 평균 {sp.label}
                            </div>
                          </div>
                          <span className="text-xs font-bold text-indigo-400">추가 ＋</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 데이터 관리 & 동기화 모달 */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-base text-white">⚙️ 클라우드 동기화 및 데이터 관리</h3>
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="text-slate-400 hover:text-white text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                <button
                  onClick={() => {
                    pushCloudData(
                      {
                        pins,
                        tripTitle,
                        exchangeRate,
                        peopleCount,
                        notes,
                        checklist,
                        forceOverwrite: true
                      },
                      true
                    );
                    setShowResetModal(false);
                  }}
                  className="w-full p-3.5 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-left"
                >
                  <div className="text-xs font-extrabold text-amber-300">
                    📤 이 기기(맥북/폰)의 현재 일정을 클라우드로 강제 전송
                  </div>
                  <p className="text-[11px] text-slate-400 mt-0.5">
                    현재 화면에 보이는 코스와 메모를 모든 핸드폰과 PC에 즉시 똑같이 적용합니다.
                  </p>
                </button>

                <button
                  onClick={() => {
                    fetchCloudData(true);
                    setShowResetModal(false);
                  }}
                  className="w-full p-3.5 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 text-left"
                >
                  <div className="text-xs font-extrabold text-indigo-400">
                    📥 지금 즉시 클라우드 최신 데이터 불러오기
                  </div>
                  <p className="text-[11px] text-slate-400 mt-0.5">
                    여자친구 폰이나 맥북에서 방금 수정한 내용을 즉시 가져옵니다.
                  </p>
                </button>

                <button
                  onClick={handleRecoverPreviousStorageData}
                  className="w-full p-3.5 rounded-2xl bg-emerald-600/20 border border-emerald-500/40 text-left"
                >
                  <div className="text-xs font-extrabold text-emerald-400">
                    🔄 이 기기의 이전 버전 코스 찾아 합치기
                  </div>
                  <p className="text-[11px] text-slate-400 mt-0.5">
                    현재 브라우저에 남아 있던 예전 코스들을 찾아 클라우드에 합칩니다.
                  </p>
                </button>

                <div className="flex gap-2">
                  <button
                    onClick={handleExportJSON}
                    className="flex-1 p-3 rounded-2xl bg-slate-800 border border-slate-700 text-xs font-extrabold text-white"
                  >
                    💾 파일로 백업
                  </button>
                  <label className="flex-1 p-3 rounded-2xl bg-slate-800 border border-slate-700 text-xs font-extrabold text-white text-center cursor-pointer">
                    📂 파일 불러오기
                    <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                  </label>
                </div>

                <button
                  onClick={() => {
                    setPins((prev) => prev.map((p) => ({ ...p, completed: false })));
                    setLastCompletedSegment(null);
                    setShowResetModal(false);
                    showToast("🔄 방문 완료(OK) 체크만 초기화되었습니다.");
                  }}
                  className="w-full p-3 rounded-2xl bg-slate-800 border border-slate-700 text-left text-xs font-extrabold text-slate-300"
                >
                  ☑️ 방문 완료(OK) 체크 상태만 초기화
                </button>

                <button
                  onClick={() => {
                    explicitlyClearedRef.current = true;
                    setPins([]);
                    setSelectedPinId(null);
                    setLastCompletedSegment(null);
                    setShowResetModal(false);
                    pushCloudData(
                      {
                        pins: [],
                        tripTitle,
                        exchangeRate,
                        peopleCount,
                        notes,
                        checklist,
                        explicitlyCleared: true,
                        forceOverwrite: true
                      },
                      true
                    );
                    showToast("🗑️ 모든 핀이 비워졌습니다.");
                  }}
                  className="w-full p-3 rounded-2xl bg-rose-600/20 border border-rose-500/40 text-left text-xs font-extrabold text-rose-400"
                >
                  🗑️ 모든 핀 비우기
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
