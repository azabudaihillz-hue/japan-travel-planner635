                                <button
                                  type="button"
                                  onClick={() =>
                                    setExpandedPinId((prev) => (prev === pin.id ? null : pin.id))
                                  }
                                  className="px-2.5 py-1 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-[11px] font-extrabold text-indigo-600 transition shadow-sm"
                                >
                                  {isExpanded ? "접기 ▴" : "상세·예산 ▾"}
                                </button>

                                {!pin.completed ? (
                                  <button
                                    type="button"
                                    onClick={() => handleCompleteAndMoveNext(pin.id)}
                                    className="px-2.5 py-1 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-black text-[11px] shadow-sm transition"
                                  >
                                    ✅ 완료
                                  </button>
                                ) : (
                                  <button
                                    type="button"
                                    onClick={() =>
                                      setPins((prev) =>

                                    className="px-2 py-1 rounded-xl bg-slate-100 text-slate-500 text-[11px] font-bold border border-slate-200 transition"

                                    ↩ 취소
                                  </button>

                                    <span className="text-[11px] font-extrabold text-indigo-700 bg-white px-2.5 py-0.5 rounded-full border border-indigo-100 flex items-center gap-1 shadow-sm">

                                      <span>구글 맵 방문객 인당 평균</span>
                                    </span>
                                    <span className="text-xs sm:text-sm font-black text-indigo-900">
                                      {avgSpend.label} (약 {formatKRW(avgSpend.avgYen * exchangeRate)})
                                    </span>
                                  </div>
                                  <div className="flex items-center gap-1.5 pt-0.5">
                                    <button
                                      type="button"
                                      onClick={() => handleApplyGoogleAvgSpend(pin, 1)}
                                      className="flex-1 py-1.5 px-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-[11px] sm:text-xs shadow-sm transition active:scale-[0.98]"
                                    >
                                      ＋ 1인 평균({formatJPY(avgSpend.avgYen)}) 담기
                                    </button>
                                    <button
                                      type="button"
                                      onClick={() => handleApplyGoogleAvgSpend(pin, peopleCount)}
                                      className="flex-1 py-1.5 px-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-[11px] sm:text-xs shadow-sm transition active:scale-[0.98]"
                                    >
                                      ＋ {peopleCount}인({formatJPY(avgSpend.avgYen * peopleCount)}) 담기
                                    </button>
                                  </div>
                                </div>

                                {/* 이름·카테고리 수정 & 구글맵 바로가기 */}
                                <div className="flex items-center justify-between gap-2 flex-wrap">
                                  <span className="text-[11px] font-extrabold text-indigo-700">
                                    ✨ 장소 설정 · 메모 · 예산 항목
                                  </span>
                                  <div className="flex items-center gap-1.5">
                                    <button
                                      type="button"
                                      onClick={() => {
                                        if (editingPinId === pin.id) {
                                          setEditingPinId(null);
                                        } else {
                                          setEditingPinId(pin.id);
                                          setEditNameText(pin.name);
                                          setEditCategoryText(pin.category);
                                        }
                                      }}
                                      className="text-[11px] font-bold text-slate-700 bg-white hover:bg-slate-50 px-2.5 py-1 rounded-xl border border-slate-200 shadow-sm transition"
                                    >
                                      {editingPinId === pin.id ? "취소" : "✏️ 이름·카테고리 수정"}
                                    </button>
                                    <a
                                      href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
                                        pin.name
                                      )}`}
                                      target="_blank"
                                      rel="noreferrer"
                                      className="text-[11px] font-bold text-indigo-600 bg-white hover:bg-slate-50 px-2.5 py-1 rounded-xl border border-slate-200 shadow-sm transition"
                                    >
                                      🗺️ 구글맵↗
                                    </a>
                                  </div>
                                </div>

                                {editingPinId === pin.id && (
                                  <div className="p-2.5 rounded-2xl bg-white border border-indigo-200 space-y-2 shadow-sm">
                                    <div className="flex flex-col sm:flex-row gap-2">
                                      <select
                                        value={editCategoryText}
                                        onChange={(e) => setEditCategoryText(e.target.value)}
                                        className="bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs text-slate-900"
                                      >
                                        <option>🏨 숙소·호텔</option>
                                        <option>📸 명소·포토존</option>
                                        <option>🍜 맛집</option>
                                        <option>☕ 카페·디저트</option>
                                        <option>🛍️ 쇼핑·드럭스토어</option>
                                        <option>🎢 테마파크</option>
                                        <option>🌃 전망대·야경</option>
                                        <option>✈️ 공항·교통</option>
                                      </select>
                                      <div className="flex gap-1.5 flex-1">
                                        <input
                                          type="text"
                                          spellCheck={false}
                                          autoCorrect="off"
                                          autoCapitalize="off"
                                          autoComplete="off"
                                          value={editNameText}
                                          onChange={(e) => setEditNameText(e.target.value)}
                                          className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-indigo-500"
                                        />
                                        <button
                                          type="button"
                                          onClick={() => handleSavePinEdit(pin.id)}
                                          className="bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-2 rounded-xl text-xs font-black shadow-sm"
                                        >
                                          저장
                                        </button>
                                      </div>
                                    </div>
                                  </div>
                                )}

                                {/* 다음 장소 도보 소요시간 요약 */}
                                {transitToNext && (
                                  <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-[11px] space-y-1">
                                    <div className="flex items-center justify-between gap-2">
                                      <span className="text-slate-600 truncate">
                                        ➡️ 다음 <b>{nextPin.name}</b>까지:
                                      </span>
                                      <span className="font-extrabold text-emerald-600 shrink-0">
                                        🚶 도보 약 {transitToNext.walkFormatted} ({transitToNext.distanceKm}km)
                                      </span>
                                    </div>
                                  </div>
                                )}

                                {/* 📝 이 장소의 메모 및 꿀팁 */}
                                <div>
                                  <label className="block text-xs font-extrabold text-slate-700 mb-1">
                                    📝 장소 메모 · 영업시간 · 예약번호
                                  </label>
                                  <textarea
                                    rows={2}
                                    spellCheck={false}
                                    autoCorrect="off"
                                    autoCapitalize="off"
                                    autoComplete="off"
                                    value={pin.memo}
                                    onChange={(e) => {
                                      const val = e.target.value;
                                      setPins((prev) =>
                                        prev.map((p) => (p.id === pin.id ? { ...p, memo: val } : p))
                                      );
                                    }}
                                    placeholder="영업시간, 예약번호, 체크인 시간, 추천 메뉴 등을 자유롭게 적어두세요"
                                    className="w-full bg-white border border-slate-200 focus:border-indigo-500 focus:outline-none rounded-xl p-2.5 text-xs sm:text-sm text-slate-900 resize-none shadow-inner"
                                  />
                                </div>

                                {/* ✅ 장소별 할 일 (localTodos) */}
                                <div className="space-y-2 p-3 rounded-2xl bg-indigo-50/40 border border-indigo-100" onClick={(e) => e.stopPropagation()}>
                                  <div className="flex items-center justify-between">
                                    <label className="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">
                                      <span>✅</span>
                                      <span>장소별 할 일 · 체크리스트 ({(pin.localTodos || []).length}건)</span>
                                    </label>
                                    <span className="text-[11px] font-bold text-indigo-600">
                                      {(pin.localTodos || []).filter(t => t.done).length}/{(pin.localTodos || []).length} 완료
                                    </span>
                                  </div>

                                  {(pin.localTodos || []).length > 0 && (
                                    <div className="space-y-1.5">
                                      {(pin.localTodos || []).map((todo) => (
                                        <label
                                          key={todo.id}
                                          className={`flex items-center justify-between p-2 rounded-xl border transition cursor-pointer ${
                                            todo.done ? "bg-emerald-50/60 border-emerald-200" : "bg-white border-slate-200"
                                          }`}
                                          onClick={(e) => e.stopPropagation()}
                                        >
                                          <div className="flex items-center gap-2 min-w-0 flex-1">
                                            <input
                                              type="checkbox"
                                              checked={!!todo.done}
                                              onChange={() => handleToggleLocalTodo(pin.id, todo.id)}
                                              onClick={(e) => e.stopPropagation()}
                                              className="w-4 h-4 rounded accent-emerald-500 shrink-0"
                                            />
                                            <span className={`text-xs font-bold break-keep ${todo.done ? "line-through text-slate-400" : "text-slate-800"}`}>
                                              {todo.text}
                                            </span>
                                          </div>
                                          <button
                                            type="button"
                                            className="w-5 h-5 rounded hover:bg-rose-100 text-rose-500 text-xs font-bold flex items-center justify-center shrink-0 ml-1.5 transition"
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              handleRemoveLocalTodo(pin.id, todo.id);
                                            }}
                                          >
                                            ✕
                                          </button>
                                        </label>
                                      ))}
                                    </div>
                                  )}

                                  <form
                                    onSubmit={(e) => {
                                      e.preventDefault();
                                      const input = e.currentTarget.elements.namedItem("localTodoText");
                                      if (input && input.value.trim()) {
                                        handleAddLocalTodo(pin.id, input.value.trim());
                                        input.value = "";
                                      }
                                    }}
                                    className="flex gap-1.5 pt-0.5"
                                    onClick={(e) => e.stopPropagation()}
                                  >
                                    <input
                                      name="localTodoText"
                                      type="text"
                                      spellCheck={false}
                                      autoCorrect="off"
                                      autoCapitalize="off"
                                      autoComplete="off"
                                      placeholder="이 장소에서 할 일 추가 (예: 시그니처 디저트 맛보기)"
                                      className="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-indigo-500 shadow-inner"
                                    />
                                    <button
                                      type="submit"
                                      className="btn-primary py-1.5 px-3 text-xs font-extrabold shrink-0"
                                    >
                                      ＋ 추가
                                    </button>
                                  </form>
                                </div>

                                {/* 🛍️ 내 지출 예산 항목 추가 & 체크리스트 */}
                                <div className="space-y-2">
                                  <div className="flex items-center justify-between">
                                    <label className="text-xs font-extrabold text-slate-700">
                                      🛍️ 이 장소의 지출·예산 항목 ({pin.items.length}건)
                                    </label>
                                    <span className="text-xs font-black text-emerald-600">
                                      합계: {formatKRW(pinTotalKRW)}
                                    </span>
                                  </div>

                                  <form
                                    onSubmit={(e) => handleAddItem(e, pin)}
                                    className="flex flex-col sm:flex-row gap-1.5"
                                  >
                                    <input
                                      type="text"
                                      spellCheck={false}
                                      autoCorrect="off"
                                      autoCapitalize="off"
                                      autoComplete="off"
                                      placeholder="항목명 (예: 숙소비, 라멘, 입장권)"
                                      value={newItemTitle}
                                      onChange={(e) => setNewItemTitle(e.target.value)}
                                      className="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-indigo-500 shadow-inner"
                                    />
                                    <div className="flex gap-1.5">
                                      <select
                                        value={inputCurrency}
                                        onChange={(e) => setInputCurrency(e.target.value)}

                                type="button"
                                onClick={() => handleApplyGoogleAvgSpend(pin, 1)}
                                className="px-2.5 py-1 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 text-[11px] font-extrabold transition"
                              >
                                ＋ 1인 평균 담기
                              </button>
                              <button
                                type="button"
                                onClick={() => handleApplyGoogleAvgSpend(pin, peopleCount)}
                                className="px-2.5 py-1 rounded-xl bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 text-[11px] font-extrabold transition"
                              >
                                ＋ {peopleCount}인 평균 담기
                              </button>
                              <span className="font-black text-xs sm:text-sm text-emerald-600 ml-1">
                                내 예산: {formatKRW(pinTotal)} (
                                {formatJPY(Math.round(pinTotal / exchangeRate))})
                              </span>
                            </div>
                          </div>

                          {pin.items.length > 0 && (
                            <div className="flex flex-wrap gap-1.5 pt-1">
                              {pin.items.map((it) => (
                                <span
                                  key={it.id}
                                  className="text-xs px-2.5 py-1 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 flex items-center gap-1.5 shadow-sm"
                                >
                                  <span>
                                    {it.bought ? "✅ " : "🛍️ "} {it.title}: <b>{formatKRW(it.price)}</b>
                                  </span>
                                  <button
                                    type="button"
                                    onClick={() =>
                                      requestDeleteConfirm(
                                        "예산 항목을 삭제하시겠습니까?",
                                        `'${it.title}' (${formatKRW(it.price)}) 항목을 삭제합니다.`,
                                        () => {
                                          setPins((prev) =>
                                            prev.map((p) =>
                                              p.id === pin.id
                                                ? {
                                                    ...p,
                                                    items: p.items.filter((x) => x.id !== it.id)
                                                  }
                                                : p
                                            )
                                          );
                                        }
                                      )
                                    }
                                    className="text-slate-400 hover:text-rose-600 font-black ml-0.5"
                                  >
                                    ✕
                                  </button>
                                </span>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })
                  )}
                </div>
              </main>
            );
          })()}

          {/* =================================================================
              📱 모바일 하단 앱 네비게이션 (Apple Liquid Glass)
             ================================================================= */}
          <nav className="lg:hidden bottom-tab-bar">
            <button
              onClick={() => switchAppView("split")}
              className={`tab-item ${currentView === "split" ? "tab-item-active" : ""}`}
            >
              <span className="text-base">🗺️</span>
              <span>지도 · 코스 ({pins.length})</span>
            </button>
            <button
              onClick={() => switchAppView("notepad")}
              className={`tab-item ${currentView === "notepad" ? "tab-item-active" : ""}`}
            >
              <span className="text-base">📝</span>
              <span>메모 · 할일</span>
            </button>
            <button
              onClick={() => switchAppView("budget")}
              className={`tab-item ${currentView === "budget" ? "tab-item-active" : ""}`}
            >
              <span className="text-base">💰</span>
              <span>예산 · 정산</span>
            </button>
          </nav>

          {/* =================================================================
              🔍 장소 검색 모달 (Requirement 6: .modal-overlay & .modal-panel)
             ================================================================= */}
          {showAddModal && (
            <div className="modal-overlay" onClick={() => setShowAddModal(false)}>
              <div
                className="modal-panel max-w-xl max-h-[90vh] overflow-y-auto space-y-3.5"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center justify-between pb-2 border-b border-slate-200">
                  <h3 className="font-extrabold text-sm sm:text-lg text-slate-900">
                    📍 구글맵 링크 & 다국어(한/일/영) 장소 검색
                  </h3>
                  <button
                    onClick={() => setShowAddModal(false)}
                    className="text-slate-400 hover:text-slate-700 text-sm font-bold px-2 py-1"
                  >
                    ✕ 닫기
                  </button>
                </div>

                <form onSubmit={handleSearchPlacesAndLinks} className="space-y-2">
                  <div className="flex flex-col sm:flex-row gap-2">
                    <select
                      value={customCategory}
                      onChange={(e) => setCustomCategory(e.target.value)}
                      className="bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-900"
                    >
                      <option>🏨 숙소·호텔</option>
                      <option>📸 명소·포토존</option>
                      <option>🍜 맛집</option>
                      <option>☕ 카페·디저트</option>
                      <option>🛍️ 쇼핑·드럭스토어</option>
                      <option>🎢 테마파크</option>
                      <option>🌃 전망대·야경</option>
                      <option>✈️ 공항·교통</option>
                    </select>
                    <div className="flex gap-1.5 flex-1">
                      <input
                        type="text"
                        spellCheck={false}
                        autoCorrect="off"
                        autoCapitalize="off"
                        autoComplete="off"
                        value={searchKeyword}
                        onChange={(e) => setSearchKeyword(e.target.value)}
                        onPaste={(e) => {
                          const pasted = e.clipboardData?.getData("text");
                          if (
                            pasted &&
                            (pasted.includes("http") ||
                              pasted.includes("maps.app") ||
                              pasted.includes("goo.gl") ||
                              pasted.includes("google."))
                          ) {
                            setTimeout(() => executePlaceSearch(pasted), 60);
                          }
                        }}
                        placeholder="구글맵 공유 링크 붙여넣기 또는 한글/일어/영어 검색"
                        className="modal-input flex-1 min-w-0"
                      />
                      <button
                        type="submit"
                        disabled={isSearching}
                        className="btn-primary shrink-0 text-xs"
                      >
                        {isSearching ? "분석중..." : "🔍 검색"}
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center justify-between gap-2 pt-0.5">
                    <button
                      type="button"
                      onClick={handlePasteFromClipboard}
                      className="w-full py-2.5 px-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 text-xs font-extrabold flex items-center justify-center gap-1.5 transition"
                    >
                      <span>📋 구글맵 앱에서 '공유 → 복사'한 링크 원터치 붙여넣기</span>
                    </button>
                  </div>

                  {translatedInfo && (
                    <div className="text-[11px] text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100">
                      🌐 자동 다국어 변환 검색됨: <b>{translatedInfo.original}</b> → 일문:{" "}
                      <b>{translatedInfo.ja}</b> / 영문: <b>{translatedInfo.en}</b>
                    </div>
                  )}
                </form>

                {searchResults.length > 0 && (
                  <div className="space-y-2 max-h-60 overflow-y-auto bg-slate-50 p-2.5 rounded-2xl border border-indigo-100">
                    <div className="text-xs font-extrabold text-indigo-700 px-1">
                      ✅ 검색 결과 목록 ({searchResults.length}건) — 인당 평균 지출액 자동 분석됨
                    </div>
                    {searchResults.map((res, idx) => {
                      const sp = res.spendInfo || estimateGoogleAvgSpend(res.name, customCategory);
                      return (
                        <div
                          key={idx}
                          onClick={() =>
                            addPinToMap({
                              name: res.name,
                              category: customCategory,
                              address: res.address,
                              lat: res.lat,
                              lng: res.lng,
                              spendInfo: sp
                            })
                          }
                          className="p-2.5 rounded-xl bg-white hover:bg-indigo-50/50 border border-slate-200 hover:border-indigo-300 cursor-pointer flex items-center justify-between gap-2 transition"
                        >
                          <div className="min-w-0">
                            <div className="text-xs sm:text-sm font-extrabold text-slate-900 truncate">
                              {res.name}
                            </div>
                            <div className="text-[11px] text-slate-500 mt-0.5 line-clamp-1">
                              {res.address}
                            </div>
                            <div className="text-[11px] text-indigo-600 font-bold mt-1">
                              📊 구글맵 인당 평균: {sp.label} (약 {formatKRW(sp.avgYen * exchangeRate)})
                            </div>
                          </div>
                          <span className="px-2.5 py-1.5 rounded-xl bg-emerald-500 text-white text-xs font-black shrink-0 shadow-sm">
                            ＋ 선택
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div>
                  <div className="text-xs font-bold text-slate-500 mb-1.5">
                    ⭐️ 자주 찾는 인기 추천 장소 빠른 추가
                  </div>
                  <div className="max-h-40 overflow-y-auto space-y-1.5 pr-1">
                    {PRESET_PLACES.map((p, i) => {
                      const sp = estimateGoogleAvgSpend(p.name, p.category);
                      return (
                        <div
                          key={i}
                          onClick={() => addPinToMap({ ...p, spendInfo: sp })}
                          className="p-2.5 rounded-xl bg-white hover:bg-indigo-50/50 border border-slate-200 cursor-pointer flex items-center justify-between transition"
                        >
                          <div>
                            <div className="text-xs font-extrabold text-slate-900">{p.name}</div>
                            <div className="text-[10px] text-slate-500">
                              {p.category} · 인당 평균 {sp.label}
                            </div>
                          </div>
                          <span className="text-xs font-bold text-indigo-600">추가 ＋</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              ⚙️ 데이터 관리 & 보안 설정 모달 (Requirement 6: .modal-overlay & .modal-panel)
             ================================================================= */}
          {showResetModal && (
            <div className="modal-overlay" onClick={() => setShowResetModal(false)}>
              <div
                className="modal-panel max-w-md max-h-[90vh] overflow-y-auto space-y-3"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center justify-between pb-2 border-b border-slate-200">
                  <h3 className="font-extrabold text-base text-slate-900">⚙️ 동기화 및 보안 설정</h3>
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="text-slate-400 hover:text-slate-700 text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* 관리자 권한 및 화면 잠금 */}
                <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5">
                  <div className="flex items-center justify-between gap-2">
                    <div className="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">
                      <span>👑</span>
                      <span>비밀번호 관리 (관리자 권한)</span>
                    </div>
                    <button
                      type="button"
                      onClick={handleLockScreenNow}
                      className="text-[11px] font-extrabold px-2.5 py-1 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 transition"
                    >
                      🔒 화면 잠그기
                    </button>
                  </div>
                  <p className="text-[11px] text-slate-500 leading-relaxed">
                    관리자 전용 비밀번호를 입력하면 접속 허용 비밀번호를 새로 지정·추가하거나 차단된 IP를 관리할 수 있습니다.
                  </p>
                  <form onSubmit={handleAdminLogin} className="flex items-center gap-1.5">
                    <input
                      type="password"
                      value={adminKeyInput}
                      onChange={(e) => setAdminKeyInput(e.target.value)}
                      placeholder="관리자 전용 비밀번호 입력"
                      className="modal-input flex-1 min-w-0 text-xs py-2"
                    />
                    <button
                      type="submit"
                      className="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-black shrink-0 transition shadow-sm"
                    >
                      관리자 열기
                    </button>
                  </form>
                  {adminFeedbackMsg && (
                    <p className="text-[11px] text-rose-600 font-bold">{adminFeedbackMsg}</p>
                  )}
                </div>

                {/* 원클릭 난수 초대 링크 */}
                <button
                  type="button"
                  onClick={handleGenerateInviteTicket}
                  className="w-full p-3.5 rounded-2xl bg-gradient-to-r from-pink-50 to-indigo-50 border border-pink-200 text-left hover:shadow-sm transition"
                >
                  <div className="text-xs font-extrabold text-pink-700 flex items-center justify-between">
                    <span>🎲 원클릭 난수 초대 링크 복사</span>
                    <span className="text-[10px] text-pink-600 font-bold">비밀번호 노출 0%</span>
                  </div>
                  <p className="text-[11px] text-slate-600 mt-0.5 whitespace-normal leading-relaxed">
                    매번 다른 보안 난수 토큰으로 생성되어 실제 비밀번호를 알 수 없으며, 누르는 즉시 플래너가 열립니다. (💡 초대 링크는 별도 여행 방이 아니라 모두가 같은 일정을 함께 확인·편집하는 <strong>공유 플래너 입장권</strong>입니다)
                  </p>
                </button>

                <button
                  onClick={() => {
                    pushCloudData(
                      {
                        pins,
                        tripTitle,
                        exchangeRate,
                        peopleCount,
                        notes,
                        checklist,
                        forceOverwrite: true
                      },
                      true
                    );
                    setShowResetModal(false);
                  }}
                  className="w-full p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-left hover:bg-amber-100/60 transition"
                >
                  <div className="text-xs font-extrabold text-amber-800">
                    📤 이 기기의 현재 일정을 클라우드로 강제 전송
                  </div>
                  <p className="text-[11px] text-slate-600 mt-0.5 whitespace-normal">
                    현재 화면에 보이는 코스와 메모를 연결된 모든 기기에 즉시 똑같이 적용합니다.
                  </p>
                </button>

                <button
                  onClick={() => {
                    fetchCloudData(true);
                    setShowResetModal(false);
                  }}
                  className="w-full p-3.5 rounded-2xl bg-indigo-50 border border-indigo-200 text-left hover:bg-indigo-100/60 transition"
                >
                  <div className="text-xs font-extrabold text-indigo-700">
                    📥 지금 즉시 클라우드 최신 데이터 불러오기
                  </div>
                  <p className="text-[11px] text-slate-600 mt-0.5 whitespace-normal">
                    다른 기기에서 방금 수정한 내용을 불러옵니다.
                  </p>
                </button>

                <button
                  onClick={handleRestoreSecuritySnapshot}
                  className="w-full p-3.5 rounded-2xl bg-cyan-50 border border-cyan-200 text-left hover:bg-cyan-100/60 transition"
                >
                  <div className="text-xs font-extrabold text-cyan-800">
                    🛡️ 보안 스냅샷 금고에서 즉시 복구
                  </div>
                  <p className="text-[11px] text-slate-600 mt-0.5 whitespace-normal">
                    실수나 외부 영향으로 일정이 지워졌을 때, 기기 내부 보안 금고에 자동 보관된 직전 일정을 즉시 되살립니다.
                  </p>
                </button>

                <button
                  onClick={handleRecoverPreviousStorageData}
                  className="w-full p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-left hover:bg-emerald-100/60 transition"
                >
                  <div className="text-xs font-extrabold text-emerald-800">
                    🔄 이 기기의 이전 버전 코스 찾아 합치기
                  </div>
                  <p className="text-[11px] text-slate-600 mt-0.5 whitespace-normal">
                    현재 브라우저에 남아 있던 예전 코스들을 찾아 클라우드에 합칩니다.
                  </p>
                </button>

                <div className="flex gap-2">
                  <button
                    onClick={handleExportJSON}
                    className="btn-ghost flex-1 text-xs text-center"
                  >
                    💾 파일로 백업
                  </button>
                  <label className="btn-ghost flex-1 text-xs text-center cursor-pointer">
                    📂 파일 불러오기
                    <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                  </label>
                </div>

                <button
                  onClick={() => {
                    setPins((prev) => prev.map((p) => ({ ...p, completed: false })));
                    setLastCompletedSegment(null);
                    setShowResetModal(false);
                    showToast("🔄 방문 완료(OK) 체크만 초기화되었습니다.");
                  }}
                  className="btn-ghost w-full text-left text-xs text-slate-700"
                >
                  ☑️ 방문 완료(OK) 체크 상태만 초기화
                </button>

                <button
                  onClick={() => {
                    setShowResetModal(false);
                    requestDeleteConfirm(
                      "모든 코스를 비우시겠습니까?",
                      "등록된 모든 여행 코스 핀이 삭제됩니다. 계속하시겠습니까?",
                      () => {
                        explicitlyClearedRef.current = true;
                        setPins([]);
                        setSelectedPinId(null);
                        setLastCompletedSegment(null);
                        pushCloudData(
                          {
                            pins: [],
                            tripTitle,
                            exchangeRate,
                            peopleCount,
                            notes,
                            checklist,
                            explicitlyCleared: true,
                            forceOverwrite: true
                          },
                          true
                        );
                        showToast("🗑️ 모든 핀이 비워졌습니다.");
                      }
                    );
                  }}
                  className="btn-danger w-full text-left text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 border border-rose-200"
                >
                  🗑️ 모든 핀 비우기
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
