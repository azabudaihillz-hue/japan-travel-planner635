        return merged.slice(0, 200);
      };

      const applyRemotePayload = (remote, isManual = false) => {
        if (!remote || typeof remote !== "object") return false;

        const remoteUpdatedAt = Number(remote.updatedAt || 0);
        if (
          !isManual &&
          remoteUpdatedAt > 0 &&
          lastUpdatedAtRef.current > 0 &&
          remoteUpdatedAt <= lastUpdatedAtRef.current
        ) {
          setSyncStatus("synced");
          return false;
        }

        const currentLocal = latestStateRef.current;
        const remotePins = sanitizePinList(remote.pins);

        if (
          Array.isArray(currentLocal.pins) &&
          currentLocal.pins.length > remotePins.length &&
          currentLocal.pins.length > 0
        ) {
          saveSecuritySnapshot(currentLocal, "before-remote-sync");
        }

        isApplyingRemoteRef.current = true;
        lastUpdatedAtRef.current = remoteUpdatedAt || Date.now();

        // 1) 핀(pins) 방어: 원격이 비어 있고 로컬에 의미 있는 핀이 있으면 로컬 삭제 금지 및 복구 푸시
        if (Array.isArray(remote.pins)) {
          if (
            remotePins.length === 0 &&
            !remote.explicitlyCleared &&
            Array.isArray(currentLocal.pins) &&
            currentLocal.pins.length > 0
          ) {
            pushCloudData({ ...currentLocal, forceOverwrite: true }, true);
          } else {
            setPins(remotePins);
            if (remotePins.length > 0) {
              setSelectedPinId((prevId) =>
                remotePins.some((p) => p.id === prevId) ? prevId : remotePins[0].id
              );
            }
          }
        }

        if (remote.tripTitle) {
          setTripTitle(cleanSafeText(remote.tripTitle, 80, "우리의 여행 플래너 ✈️"));
        }
        if (remote.exchangeRate) {
          setExchangeRate(Math.max(0.5, Math.min(100, Number(remote.exchangeRate) || 9.05)));
        }
        if (remote.peopleCount) {
          setPeopleCount(Math.max(1, Math.min(50, Math.round(Number(remote.peopleCount) || 2))));
        }

        // 2) 메모(notes) 방어 & 스마트 병합
        if (Array.isArray(remote.notes)) {
          const mergedNotes = mergeNotes(currentLocal.notes, remote.notes);
          setNotes(mergedNotes);

          if (
            hasMeaningfulNotes(currentLocal.notes) &&
            !hasMeaningfulNotes(remote.notes) &&
            !remote.explicitlyCleared
          ) {
            pushCloudData({ ...currentLocal, notes: mergedNotes, forceOverwrite: true }, true);
          }
        }

        // 3) 체크리스트(checklist) 방어 & 스마트 병합
        if (Array.isArray(remote.checklist)) {
          const mergedChecklist = mergeChecklist(currentLocal.checklist, remote.checklist);
          setChecklist(mergedChecklist);

          if (
            hasMeaningfulChecklist(currentLocal.checklist) &&
            !hasMeaningfulChecklist(remote.checklist) &&
            !remote.explicitlyCleared
          ) {
            pushCloudData({ ...currentLocal, checklist: mergedChecklist, forceOverwrite: true }, true);
          }
        }

        setLastSyncedTime(
          new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
        );
        setSyncStatus("synced");

        setTimeout(() => {
          isApplyingRemoteRef.current = false;
          isInitialCloudLoadedRef.current = true;
        }, 350);

        if (isManual) {
          showToast("☁️ 클라우드에서 최신 여행 일정과 메모를 동기화했습니다!");
        }
        return true;
      };

      const fetchCloudData = async (isManual = false, pinOverride = "") => {
        const activePin = (pinOverride || savedAuthPinRef.current || "").trim();
        if (!activePin) {
          setIsEntryAuthenticated(false);
          setIsEntryChecking(false);
          return;
        }

        try {
          if (isManual) setSyncStatus("connecting");
          const res = await fetch(`/api/sync?t=${Date.now()}`, {
            method: "GET",
            cache: "no-store",
            headers: {
              "X-Requested-With": CSRF_HEADER_VALUE,
              "X-Planner-Pin": activePin
            }
          });

          const json = await res.json().catch(() => ({}));

          if (res.status === 403 && json.ipBanned) {
            setIsIpBanned(true);
            if (json.clientIp) setDetectedClientIp(json.clientIp);
            setIsEntryAuthenticated(false);
            setIsEntryChecking(false);
            setEntryErrorMsg(json.error || "🚫 비밀번호 5회 오류로 현재 IP의 접속이 차단되었습니다.");
            return;
          }

          if (res.status === 401) {
            // 저장된 비밀번호가 더 이상 유효하지 않음 (관리자가 비밀번호를 변경한 경우 등)
            setSavedAuthPin("");
            setIsEntryAuthenticated(false);
            setIsEntryChecking(false);
            return;
          }

          if (!res.ok) {
            throw new Error(`Sync GET failed: ${res.status}`);
          }

          setIsEntryAuthenticated(true);
          setIsEntryChecking(false);

          const remote = json && json.data ? json.data : json;
          if (remote && !remote.empty) {
            if (remote.clientId && remote.clientId === CLIENT_ID && !isManual) {
              setSyncStatus("synced");
              isInitialCloudLoadedRef.current = true;
              return;
            }
            applyRemotePayload(remote, isManual);
            isInitialCloudLoadedRef.current = true;
          } else {
            isInitialCloudLoadedRef.current = true;
            const currentLocal = latestStateRef.current;
            if (hasLocalMeaningfulData(currentLocal)) {
              await pushCloudData({ ...currentLocal, forceOverwrite: true }, true);
            } else {
              setSyncStatus("synced");
            }
          }
        } catch (e) {
          setSyncStatus("offline");
          setIsEntryChecking(false);
          isInitialCloudLoadedRef.current = true;
        }
      };

      // ☁️ 변경 사항을 보안 게이트웨이(/api/sync)에 저장
      const pushCloudData = async (customPayload, isForce = false) => {
        const activePin = (savedAuthPinRef.current || "").trim();
        if (!activePin || !isEntryAuthenticated) return;

        try {
          const base = customPayload || latestStateRef.current;
          const pinsList = sanitizePinList(base.pins);

          if (pinsList.length > 0) {
            saveSecuritySnapshot({ ...base, pins: pinsList }, "local-edit");
          }

          if (
            pinsList.length === 0 &&
            !explicitlyClearedRef.current &&
            !isForce &&
            !base.forceOverwrite &&
            !hasLocalMeaningfulData(base)
          ) {
            setSyncStatus("synced");
            return;
          }

          setSyncStatus("saving");
          const nowTs = Date.now();
          lastUpdatedAtRef.current = nowTs;

          const payload = {
            pins: pinsList,
            tripTitle: cleanSafeText(base.tripTitle, 80, "우리의 여행 플래너 ✈️"),
            exchangeRate: Math.max(0.5, Math.min(100, Number(base.exchangeRate) || 9.05)),
            peopleCount: Math.max(1, Math.min(50, Math.round(Number(base.peopleCount) || 2))),
            notes: Array.isArray(base.notes) ? base.notes.slice(0, 30) : DEFAULT_NOTE_PAD,
            checklist: Array.isArray(base.checklist) ? base.checklist.slice(0, 200) : [],
            explicitlyCleared: Boolean(explicitlyClearedRef.current || base.explicitlyCleared),
            forceOverwrite: Boolean(isForce || base.forceOverwrite),
            updatedAt: nowTs,
            clientId: CLIENT_ID,
            authPin: activePin
          };

          const res = await fetch("/api/sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": CSRF_HEADER_VALUE,
              "X-Planner-Pin": activePin
            },
            body: JSON.stringify(payload)
          });

          if (res.status === 401 || res.status === 403) {
            clearNoteSaveTimer();
            setNoteSaveStatus("error");
            noteSaveTimerRef.current = setTimeout(() => {
              setNoteSaveStatus("idle");
            }, 4500);

            const errJson = await res.json().catch(() => ({}));
            if (errJson.ipBanned) {
              setIsIpBanned(true);
              if (errJson.clientIp) setDetectedClientIp(errJson.clientIp);
            }
            if (errJson.requiresAuth || errJson.ipBanned) {
              setSavedAuthPin("");
              setIsEntryAuthenticated(false);
              setEntryErrorMsg(errJson.error || "인증이 만료되었습니다. 비밀번호를 다시 입력해주세요.");
            }
            return;
          }

          if (res.ok) {
            setLastSyncedTime(
              new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
            );
            setSyncStatus("synced");

            // 📝 [수정 D] 메모 저장 직후 '저장됨 ✓' 피드백 (2.5초 후 자동 idle)
            clearNoteSaveTimer();
            setNoteSaveStatus("saved");
            noteSaveTimerRef.current = setTimeout(() => {
              setNoteSaveStatus("idle");
            }, 2500);

            if (isForce) {
              showToast("☁️ 현재 기기의 일정을 클라우드에 강제 동기화했습니다!");
            }
          } else {
            setSyncStatus("offline");
            clearNoteSaveTimer();
            setNoteSaveStatus("error");
            noteSaveTimerRef.current = setTimeout(() => {
              setNoteSaveStatus("idle");
            }, 4500);
          }
        } catch (e) {
          setSyncStatus("offline");
          clearNoteSaveTimer();
          setNoteSaveStatus("error");
          noteSaveTimerRef.current = setTimeout(() => {
            setNoteSaveStatus("idle");
          }, 4500);
        }
      };

      // 🔑 시작 페이지 입장 비밀번호 검증 핸들러 (5회 실패 시 IP 자동 차단 / 원클릭 프리패스 링크 지원)
      const handleEntryLogin = async (e, directPassword = null) => {
        if (e && e.preventDefault) e.preventDefault();
        const candidate = (directPassword !== null ? directPassword : entryPasswordInput).trim();
        if (!candidate) {
          setEntryErrorMsg("비밀번호를 입력해주세요.");
          return;
        }
        setEntryErrorMsg("");

        try {
          const res = await fetch("/api/sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": CSRF_HEADER_VALUE,
              "X-Planner-Pin": candidate
            },
            body: JSON.stringify({
              action: "authenticateEntry",
              password: candidate
            })
          });

          const data = await res.json().catch(() => ({}));
          if (data.clientIp) setDetectedClientIp(data.clientIp);

          if (res.ok && data.authenticated) {
            setSavedAuthPin(candidate);
            savedAuthPinRef.current = candidate;
            setIsIpBanned(false);
            setRemainingAttempts(5);
            setEntryPasswordInput("");
            setEntryErrorMsg("");
            setIsEntryAuthenticated(true);

            if (data.cloudData && !data.cloudData.empty) {
              applyRemotePayload(data.cloudData, false);
            }
            isInitialCloudLoadedRef.current = true;

            // 만약 시작 페이지 입력칸에 관리자 비밀번호를 입력한 경우 → 관리자 권한 페이지도 즉시 오픈!
            if (data.openedAdmin) {
              setVerifiedAdminKey(candidate);
              setAdminAccessEntries(data.accessEntries || []);
              setAdminBannedIps(data.bannedIps || []);
              setShowAdminPage(true);
              showToast("👑 관리자 권한으로 인증되어 관리자 페이지가 열렸습니다!");
            } else {
              showToast("🔓 비밀번호 인증 완료! 환영합니다.");
            }

          } else {
            if (data.ipBanned || res.status === 403) {
              setIsIpBanned(true);
              setRemainingAttempts(0);
            } else if (typeof data.remainingAttempts === "number") {
              setRemainingAttempts(data.remainingAttempts);
            }
            setEntryErrorMsg(
              data.error || "비밀번호가 일치하지 않습니다. (5회 실패 시 IP가 자동 차단됩니다)"
            );
          }
        } catch {
          setEntryErrorMsg("⚠️ 서버와 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
        }
      };

      // 👑 관리자 전용 비밀번호 인증 후 [관리자 권한 페이지] 열기
      const handleAdminLogin = async (e, directAdminKey = null) => {
        if (e && e.preventDefault) e.preventDefault();
        const keyCandidate = (directAdminKey !== null ? directAdminKey : adminKeyInput).trim();
        if (!keyCandidate) {
          setAdminFeedbackMsg("⚠️ 관리자 전용 비밀번호를 입력해주세요.");
          return;
        }
        setAdminFeedbackMsg("");

        try {
          const res = await fetch("/api/sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": CSRF_HEADER_VALUE
            },
            body: JSON.stringify({
              action: "adminLogin",
              adminKey: keyCandidate
            })
          });

          const data = await res.json().catch(() => ({}));
          if (res.ok && data.adminAuthorized) {
            setVerifiedAdminKey(keyCandidate);
            setAdminKeyInput("");
            setAdminAccessEntries(data.accessEntries || []);
            setAdminBannedIps(data.bannedIps || []);
            setIsIpBanned(false);
            setRemainingAttempts(5);
            setEntryErrorMsg("");
            setShowAdminAuthBox(false);
            setShowAdminPage(true);
            setAdminFeedbackMsg("");
          } else {
            if (data.ipBanned || res.status === 403) {
              setIsIpBanned(true);
              setRemainingAttempts(0);
            } else if (typeof data.remainingAttempts === "number") {
              setRemainingAttempts(data.remainingAttempts);
            }
            setAdminFeedbackMsg(data.error || "🚫 관리자 비밀번호가 일치하지 않습니다.");
          }
        } catch {
          setAdminFeedbackMsg("⚠️ 관리자 인증 요청 중 오류가 발생했습니다.");
        }
      };

      // 👑 관리자: 지정된 비밀번호로 단독 변경 또는 새 비밀번호 추가
      const handleAdminSavePassword = async (mode = "setPrimary") => {
        const newPw = adminNewPasswordInput.trim();
        if (newPw.length < 4) {
          setAdminFeedbackMsg("⚠️ 새로 지정할 비밀번호는 4자리 이상 입력해주세요.");
          return;
        }
        try {
          const res = await fetch("/api/sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": CSRF_HEADER_VALUE
            },
            body: JSON.stringify({
              action: mode === "setPrimary" ? "adminSetPrimaryPassword" : "adminAddPassword",
              adminKey: verifiedAdminKey,
              newPassword: newPw,
              label:
                adminNewPasswordLabel.trim() ||
                (mode === "setPrimary" ? "관리자 단독 지정 비밀번호" : "추가 허용 비밀번호")
            })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok) {
            setAdminAccessEntries(data.accessEntries || []);
            setAdminBannedIps(data.bannedIps || []);
            setSavedAuthPin(newPw);
            savedAuthPinRef.current = newPw;
            setAdminNewPasswordInput("");
            setAdminNewPasswordLabel("");
            setAdminFeedbackMsg(data.message || "✅ 비밀번호 설정이 반영되었습니다!");
            showToast(data.message || "✅ 새 접속 비밀번호가 적용되었습니다!");
          } else {
            setAdminFeedbackMsg(data.error || "⚠️ 비밀번호 저장에 실패했습니다.");
          }
        } catch {
          setAdminFeedbackMsg("⚠️ 서버 통신 중 오류가 발생했습니다.");
        }
      };

      // 👑 관리자: 등록된 특정 비밀번호 삭제
      const handleAdminDeletePassword = async (entryId) => {
        try {
          const res = await fetch("/api/sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": CSRF_HEADER_VALUE
            },
            body: JSON.stringify({
              action: "adminDeletePassword",
              adminKey: verifiedAdminKey,
              entryId
            })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok) {
            setAdminAccessEntries(data.accessEntries || []);
            setAdminFeedbackMsg(data.message || "🗑️ 비밀번호가 삭제되었습니다.");
          } else {
            setAdminFeedbackMsg(data.error || "⚠️ 삭제할 수 없습니다.");
          }
        } catch {
          setAdminFeedbackMsg("⚠️ 삭제 중 오류가 발생했습니다.");
        }
      };

      // 👑 관리자: 차단된 IP 해제
      const handleAdminUnbanIp = async (targetIp = "ALL") => {
        try {
          const res = await fetch("/api/sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": CSRF_HEADER_VALUE
            },
            body: JSON.stringify({
              action: "adminUnbanIp",
              adminKey: verifiedAdminKey,
              targetIp
            })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok) {
            setAdminBannedIps(data.bannedIps || []);
            setIsIpBanned(false);
            setRemainingAttempts(5);
            setAdminFeedbackMsg("🔓 IP 차단이 즉시 해제되었습니다.");
          }
        } catch {
          setAdminFeedbackMsg("⚠️ IP 차단 해제 중 오류가 발생했습니다.");
        }
      };

      const handleLockScreenNow = () => {
        setSavedAuthPin("");
        savedAuthPinRef.current = "";
        setIsEntryAuthenticated(false);
        setShowResetModal(false);
        setShowAdminPage(false);
        showToast("🔒 화면이 잠겼습니다. 다시 입장하려면 비밀번호를 입력해주세요.");
      };

      // 🎲 지속적 난수 초대 티켓 생성 (비밀번호 노출 0% Opaque Random Token)
      const handleGenerateInviteTicket = async () => {
        try {
          showToast("🎲 보안 난수 초대 링크 생성 중...");
          const res = await fetch("/api/sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": CSRF_HEADER_VALUE,
              "X-Planner-Pin": savedAuthPinRef.current || ""
            },
            body: JSON.stringify({
              action: "generateInviteTicket",
              adminKey: verifiedAdminKey || "",
              label: "동행인 초대 링크"
            })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ticket) {
            const shareUrl = `${window.location.origin}${window.location.pathname}#invite=${data.ticket}`;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(shareUrl);
              showToast("📋 매번 새롭게 생성되는 난수 보안 초대 링크가 복사되었습니다!");
            } else {
              window.prompt("아래 보안 초대 링크를 복사하여 공유하세요:", shareUrl);
            }
          } else {
            showToast("⚠️ 초대 링크 생성에 실패했습니다.");
          }
        } catch {
          showToast("⚠️ 네트워크 오류로 초대 링크를 생성하지 못했습니다.");
        }
      };

      // 🎫 난수 초대 티켓 자동 수락 및 로그인
      const handleRedeemInviteTicket = async (ticket) => {
        setIsEntryChecking(true);
        try {
          const res = await fetch("/api/sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": CSRF_HEADER_VALUE
            },
            body: JSON.stringify({
              action: "redeemInviteTicket",
              ticket
            })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.authenticated) {
            const sessionPin = `ticket:${ticket}`;
            setSavedAuthPin(sessionPin);
            savedAuthPinRef.current = sessionPin;
            setIsEntryAuthenticated(true);
            setIsEntryChecking(false);
            if (data.cloudData && !data.cloudData.empty) {
              applyRemotePayload(data.cloudData, false);
            }
            isInitialCloudLoadedRef.current = true;
            showToast("✨ 보안 초대 링크로 접속되었습니다! (이 기기는 영구 자동 로그인됩니다)");

          } else {
            setIsEntryChecking(false);
            setEntryErrorMsg(data.error || "유효하지 않거나 만료된 초대 링크입니다.");
          }
        } catch {
          setIsEntryChecking(false);
          setEntryErrorMsg("⚠️ 초대 링크 확인 중 네트워크 오류가 발생했습니다.");
        }
      };

      // 첫 실행 시: 1) URL 난수 초대 티켓/원클릭 패스키 자동 감지 -> 2) 저장된 기기 인증 확인 -> 3) 실시간 폴링 동기화
      useEffect(() => {
        // 🚀 URL에서 지속 난수 초대 티켓(#invite=... 또는 ?invite=...) 자동 감지 및 자동 로그인
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const hashStr = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
          const hashParams = new URLSearchParams(hashStr);

          const incomingTicket =
            urlParams.get("invite") ||
            urlParams.get("ticket") ||
            hashParams.get("invite") ||
            hashParams.get("ticket");

          if (incomingTicket) {
            window.history.replaceState({}, document.title, window.location.pathname);
            handleRedeemInviteTicket(incomingTicket);
            return;
          }

          const incomingPass =
            urlParams.get("auth") ||
            urlParams.get("pass") ||
            urlParams.get("key") ||
            urlParams.get("token") ||
            hashParams.get("auth") ||
            hashParams.get("pass") ||
            hashParams.get("key") ||
            hashParams.get("token");

          const incomingAdmin = urlParams.get("admin") || hashParams.get("admin");

          if (incomingPass) {
            window.history.replaceState({}, document.title, window.location.pathname);
            handleEntryLogin(null, incomingPass);
            return;
          }

          if (incomingAdmin) {
            window.history.replaceState({}, document.title, window.location.pathname);
            handleAdminLogin(null, incomingAdmin);
            return;
          }
        } catch (e) {}

        if (savedAuthPinRef.current) {
          fetchCloudData(false, savedAuthPinRef.current);
        } else {
          setIsEntryChecking(false);
        }

        const timer = setInterval(() => {
          if (
            savedAuthPinRef.current &&
            !isApplyingRemoteRef.current &&
            document.visibilityState === "visible"
          ) {
            fetchCloudData(false, savedAuthPinRef.current);
          }
        }, 3000);

        const handleFocusOrVisible = () => {
          if (
            savedAuthPinRef.current &&
            document.visibilityState === "visible" &&
            !isApplyingRemoteRef.current
          ) {
            fetchCloudData(false, savedAuthPinRef.current);
          }
        };
        window.addEventListener("focus", handleFocusOrVisible);
        document.addEventListener("visibilitychange", handleFocusOrVisible);

        return () => {
          clearInterval(timer);
          window.removeEventListener("focus", handleFocusOrVisible);
          document.removeEventListener("visibilitychange", handleFocusOrVisible);
        };
      }, []);

      // 내 기기에서 핀/제목/환율/메모장/체크리스트 수정 시 0.4초 뒤 클라우드 실시간 저장
      useEffect(() => {
        if (!isEntryAuthenticated || !isInitialCloudLoadedRef.current || isApplyingRemoteRef.current) {
          return;
        }
        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);

        saveTimeoutRef.current = setTimeout(() => {
          pushCloudData({
            pins,
            tripTitle,
            exchangeRate,
            peopleCount,
            notes,
            checklist
          });
        }, 400);

        return () => {
          if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        };
      }, [isEntryAuthenticated, pins, tripTitle, exchangeRate, peopleCount, notes, checklist]);

      useEffect(() => {
        setTimeout(() => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.invalidateSize();
          }
        }, 150);
      }, [mobileView, activeTab, isEntryAuthenticated]);

      const handleRecoverPreviousStorageData = () => {
        const allKeys = Object.keys(localStorage).filter((k) =>
          k.startsWith("travel_planner_pins")
        );
        let recovered = [];
        allKeys.forEach((k) => {
          try {
            const arr = sanitizePinList(JSON.parse(localStorage.getItem(k)));
            arr.forEach((item) => {
              const isDefaultSample = ["pin-101", "pin-102", "pin-103", "pin-104"].includes(
                item.id
              );
              const alreadyIn = recovered.some((r) => r.name === item.name);
              if (!isDefaultSample && !alreadyIn) {
                recovered.push(item);
              }
            });
          } catch (e) {}
        });

        if (recovered.length > 0) {
          setPins((prev) => {
            const merged = [...prev];
            recovered.forEach((r) => {
              if (!merged.some((m) => m.name === r.name)) merged.push(r);
            });
            return merged;
          });
          setShowResetModal(false);
          showToast(`✨ 기기에 남아 있던 장소 ${recovered.length}곳을 찾아 클라우드에 합쳤습니다!`);
        } else {
          showToast("이 기기에서 추가로 발견된 이전 장소가 없습니다.");
        }
      };

      const selectedPinIndex = useMemo(
        () => pins.findIndex((p) => p.id === selectedPinId),
        [pins, selectedPinId]
      );
      const selectedPin = useMemo(
        () => (selectedPinIndex !== -1 ? pins[selectedPinIndex] : pins[0] || null),
        [pins, selectedPinIndex]
      );

      const selectedPinAvgSpend = useMemo(() => {
        if (!selectedPin) return null;
        return selectedPin.spendInfo || estimateGoogleAvgSpend(selectedPin.name, selectedPin.category);
      }, [selectedPin]);

      const prevTransitInfo = useMemo(() => {
        if (selectedPinIndex > 0) {
          return {
            from: pins[selectedPinIndex - 1],
            to: pins[selectedPinIndex],
            info: estimateTransitInfo(pins[selectedPinIndex - 1], pins[selectedPinIndex])
          };
        }
        return null;
      }, [pins, selectedPinIndex]);

      const nextTransitInfo = useMemo(() => {
        if (selectedPinIndex !== -1 && selectedPinIndex < pins.length - 1) {
          return {
            from: pins[selectedPinIndex],
            to: pins[selectedPinIndex + 1],
            info: estimateTransitInfo(pins[selectedPinIndex], pins[selectedPinIndex + 1])
          };
        }
        return null;
      }, [pins, selectedPinIndex]);

      // H. 예산 요약 useMemo (총액·1인당·Day별 합계)
      const budgetSummary = useMemo(() => {
        let totalKRW = 0;
        let totalJPY = 0;
        let boughtKRW = 0;
        const byDay = {}; // { "day-1": { label, krw, jpy, count } }

        pins.forEach((pin) => {
          const dayId = pin.dayId || "day-1";
          const dayLabel = pin.dayLabel || "Day 1";
          if (!byDay[dayId]) {
            byDay[dayId] = { label: dayLabel, krw: 0, jpy: 0, count: 0 };
          }

          (pin.items || []).forEach((item) => {
            const krw = Number(item.price) || 0;
            const jpy = Number(item.yen) || (exchangeRate > 0 ? Math.round(krw / exchangeRate) : 0);
            totalKRW += krw;
            totalJPY += jpy;
            byDay[dayId].krw += krw;
            byDay[dayId].jpy += jpy;
            byDay[dayId].count += 1;
            if (item.bought) boughtKRW += krw;
          });
        });

        const people = Math.max(1, Number(peopleCount) || 1);
        const spentPercent =
          totalKRW > 0 ? Math.min(100, Math.round((boughtKRW / totalKRW) * 100)) : 0;

        return {
          totalKRW,
          totalJPY,
          boughtKRW,
          remainingKRW: Math.max(0, totalKRW - boughtKRW),
          perPersonKRW: Math.round(totalKRW / people),
          spentPercent,
          byDay: Object.entries(byDay).map(([id, v]) => ({ id, ...v }))
        };
      }, [pins, peopleCount, exchangeRate]);

      const budgetStats = useMemo(() => {
        let totalGoogleAvgYenPerPerson = 0;
        pins.forEach((pin) => {
          const avgObj = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
          totalGoogleAvgYenPerPerson += Number(avgObj.avgYen || 0);
        });

        let totalTransitMinutes = 0;
        let totalWalkMinutes = 0;
        if (pins.length >= 2) {
          for (let i = 0; i < pins.length - 1; i++) {
            const info = estimateTransitInfo(pins[i], pins[i + 1]);
            if (info) {
              totalTransitMinutes += info.transitMinutes;
              totalWalkMinutes += info.walkMinutes;
            }
          }
        }

        return {
          totalPlannedKRW: budgetSummary.totalKRW,
          totalPlannedJPY: budgetSummary.totalJPY,
          totalBoughtKRW: budgetSummary.boughtKRW,
          remainingKRW: budgetSummary.remainingKRW,
          perPersonKRW: budgetSummary.perPersonKRW,
          perPersonJPY: peopleCount > 0 ? Math.ceil(budgetSummary.totalJPY / peopleCount) : budgetSummary.totalJPY,
          totalTransitFormatted: totalTransitMinutes > 0 ? formatMinutesToKorean(totalTransitMinutes) : "0분",
          totalWalkFormatted: totalWalkMinutes > 0 ? formatMinutesToKorean(totalWalkMinutes) : "0분",
          totalTransitMinutes,
          totalWalkMinutes,
          totalGoogleAvgYenPerPerson,
          totalGoogleAvgKRWPerPerson: Math.round(totalGoogleAvgYenPerPerson * exchangeRate)
        };
      }, [pins, peopleCount, exchangeRate, budgetSummary]);

      // 🌍 구글 한국어 지도 타일 초기화 (시작 페이지 인증 완료 시 즉시 마운트)
      useEffect(() => {
        if (!isEntryAuthenticated) {
          if (mapInstanceRef.current) {
            try {
              mapInstanceRef.current.remove();
            } catch (e) {}
            mapInstanceRef.current = null;
          }
          return;
        }
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        const initCenter = pins.length > 0 ? [pins[0].lat, pins[0].lng] : [34.6674727, 135.5039453];
        const map = L.map(mapContainerRef.current, {
          zoomControl: false,
          attributionControl: false
        }).setView(initCenter, 14);

        L.tileLayer("https://mt1.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}", {
          maxZoom: 20
        }).addTo(map);

        L.control.zoom({ position: "bottomleft" }).addTo(map);
        mapInstanceRef.current = map;
      }, [isEntryAuthenticated]);

      const clearActiveAnimationLayers = () => {
        const map = mapInstanceRef.current;
        if (!map) return;
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        if (travelerMarkerRef.current) {
          map.removeLayer(travelerMarkerRef.current);
          travelerMarkerRef.current = null;
        }
        if (activeSegmentLineRef.current) {
          map.removeLayer(activeSegmentLineRef.current);
          activeSegmentLineRef.current = null;
        }
      };

      // 📍 지도 위 마커 + 도보 시간 표시 배지 (XSS 이스케이프 처리 완료)
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map || !isEntryAuthenticated) return;

        markersRef.current.forEach((m) => map.removeLayer(m));
        markersRef.current = [];
        polylinesRef.current.forEach((l) => map.removeLayer(l));
        polylinesRef.current = [];

        if (pins.length === 0) {
          clearActiveAnimationLayers();
          return;
        }

        // Day 필터에 따른 경로 선 렌더링
        const routePins =
          selectedDayId === "all"
            ? pins
            : pins.filter((p) => (p.dayId || "day-1") === selectedDayId);

        for (let i = 0; i < routePins.length - 1; i++) {
          const pinA = routePins[i];
          const pinB = routePins[i + 1];
          const transit = estimateTransitInfo(pinA, pinB);

          const segmentLine = L.polyline(
            [
              [pinA.lat, pinA.lng],
              [pinB.lat, pinB.lng]
            ],
            {
              color: pinA.completed && pinB.completed ? "#10b981" : "#6366f1",
              weight: 5,
              opacity: 0.85,
              dashArray: pinA.completed && pinB.completed ? null : "8, 8"
            }
          ).addTo(map);

          if (transit) {
            const isRelevantSegment =
              pinA.id === selectedPin?.id || pinB.id === selectedPin?.id || routePins.length <= 3;
            segmentLine.bindTooltip(
              `🚶 도보 ${escapeHtml(transit.walkFormatted)}`,
              {
                permanent: isRelevantSegment,
                direction: "center",
                className: "route-time-badge"
              }
            );
          }
          polylinesRef.current.push(segmentLine);
        }

        pins.forEach((pin, idx) => {
          const isSelected = pin.id === selectedPin?.id;
          const isDayMatch = selectedDayId === "all" || (pin.dayId || "day-1") === selectedDayId;

          // Day 필터 선택 시 해당 Day 외의 핀은 은은하게 반투명 처리
          const markerOpacity = isDayMatch ? 1 : 0.28;
          const markerScale = isSelected ? 1.22 : isDayMatch ? 1.05 : 0.85;

          const bgColor = pin.completed
            ? "linear-gradient(135deg, #10b981, #059669)"
            : isSelected
            ? "linear-gradient(135deg, #6366f1, #ec4899)"
            : isDayMatch
            ? "linear-gradient(135deg, #4f46e5, #06b6d4)"
            : "linear-gradient(135deg, #94a3b8, #64748b)";

          const iconHtml = `
            <div class="custom-pin ${isSelected ? "pin-active" : ""}" style="background: ${bgColor}; opacity: ${markerOpacity}; transform: rotate(-45deg) scale(${markerScale});">
              <span>${pin.completed ? "✓" : idx + 1}</span>
            </div>
          `;

          const customIcon = L.divIcon({
            html: iconHtml,
            className: "",
            iconSize: [38, 38],
            iconAnchor: [19, 38],
            popupAnchor: [0, -38]
          });

          const avgSpend = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
          const nextPin = pins[idx + 1];
          const nextTransit = nextPin ? estimateTransitInfo(pin, nextPin) : null;

          const safeCategory = escapeHtml(pin.category);
          const safeName = escapeHtml(pin.name);
          const safeAvgLabel = escapeHtml(avgSpend.label);
          const safeNextName = nextPin ? escapeHtml(nextPin.name) : "";
          const safeNextWalk = nextTransit ? escapeHtml(nextTransit.walkFormatted) : "";

          const marker = L.marker([pin.lat, pin.lng], {
            icon: customIcon,
            draggable: true
          })
            .addTo(map)
            .bindPopup(
              `<div style="min-width: 195px; line-height: 1.45;">
                <div style="font-size:11px; color:#818cf8; font-weight:800;">코스 #${idx + 1} · ${safeCategory}</div>
                <div style="font-size:14px; font-weight:900; margin: 2px 0 4px; color:#fff;">${safeName}</div>
                <div style="font-size:11px; color:#34d399; font-weight:800; background:rgba(16,185,129,0.12); padding:4px 7px; border-radius:8px; margin-bottom:5px;">
                  📊 인당 평균: ${safeAvgLabel} (약 ${escapeHtml(formatKRW(avgSpend.avgYen * exchangeRate))})
                </div>
                ${
                  nextTransit
                    ? `<div style="margin-top:5px; padding-top:5px; border-top:1px solid #334155; font-size:11px; color:#fde047; font-weight:700;">
                        다음(${safeNextName})까지: 🚶 도보 약 ${safeNextWalk}
                      </div>`
                    : ""
                }
              </div>`
            );

          marker.on("click", () => {
            setSelectedPinId(pin.id);
          });

          marker.on("dragend", (e) => {
            const newPos = e.target.getLatLng();
            setPins((prev) =>
              prev.map((p) =>
                p.id === pin.id ? { ...p, lat: newPos.lat, lng: newPos.lng } : p
              )
            );
            setSelectedPinId(pin.id);
            showToast(`📍 '${pin.name}' 위치가 이동되어 클라우드에 동기화됩니다!`);
          });

          markersRef.current.push(marker);
        });

        // Day 필터 변경 시 해당 Day 마커 영역으로 부드럽게 시야 이동
        if (selectedDayId !== "all" && routePins.length > 0) {
          const bounds = L.latLngBounds(routePins.map((p) => [p.lat, p.lng]));
          map.flyToBounds(bounds.pad(0.35), { duration: 0.8 });
        }
      }, [isEntryAuthenticated, pins, selectedPin, exchangeRate, selectedDayId]);

      const handleOptimizeShortestRoute = () => {
        if (pins.length < 3) {
          showToast("⚠️ 3개 이상의 장소가 있을 때 최단 경로 정렬이 가능합니다.");
          return;
        }
        const beforeKm = getTotalRouteKm(pins);
        const optimized = optimizePinsShortestRoute(pins);
        const afterKm = getTotalRouteKm(optimized);
        const savedKm = Math.max(0, beforeKm - afterKm).toFixed(1);

        setPins(optimized);
        setSelectedPinId(optimized[0].id);

        if (mapInstanceRef.current) {
          const bounds = L.latLngBounds(optimized.map((p) => [p.lat, p.lng]));
          mapInstanceRef.current.flyToBounds(bounds.pad(0.3), { duration: 0.9 });
        }

        if (Number(savedKm) > 0) {
          showToast(
            `⚡ 최단 경로 재구성 완료! #1 '${optimized[0].name}' 기준 총 이동거리가 ${savedKm}km 단축되었습니다!`
          );
        } else {
          showToast(`⚡ 현재 코스가 이미 가장 효율적인 최단 동선입니다!`);
        }
      };

      const handleApplyGoogleAvgSpend = (pin, multiplierPeople = 1) => {
        if (!pin) return;
        const avgInfo = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
        const yenAmount = Math.round(avgInfo.avgYen * multiplierPeople);
        const krwAmount = Math.round(yenAmount * exchangeRate);

        const newItem = {
          id: "item-" + Date.now(),
          title: `${avgInfo.recommendedTitle} (${multiplierPeople}인 평균)`,
          price: krwAmount,
          yen: yenAmount,
          bought: false
        };

        setPins((prev) =>
          prev.map((p) => (p.id === pin.id ? { ...p, items: [...p.items, newItem] } : p))
        );
        showToast(
          `💴 평균 지출액 ${formatJPY(yenAmount)} (${formatKRW(krwAmount)})이 예산에 추가되었습니다!`
        );
      };

      const handleFindMyLocation = () => {
        if (!navigator.geolocation) {
          showToast("브라우저가 GPS 위치 정보를 지원하지 않습니다.");
          return;
        }
        showToast("🛰️ 현재 위치를 확인 중입니다...");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const map = mapInstanceRef.current;
            if (map) {
              if (myGpsMarkerRef.current) map.removeLayer(myGpsMarkerRef.current);
              const gpsIcon = L.divIcon({
                html: `<div class="my-gps-marker">📍</div>`,
                className: "",
                iconSize: [32, 32],
                iconAnchor: [16, 16]
              });
              myGpsMarkerRef.current = L.marker([lat, lng], {
                icon: gpsIcon,
                zIndexOffset: 2000
              })
                .addTo(map)
                .bindPopup("<b>내 현재 위치</b>")
                .openPopup();
              map.flyTo([lat, lng], 16, { duration: 1.0 });
              showToast("📍 현재 위치가 지도에 표시되었습니다!");
            }
          },
          () => showToast("위치 권한을 허용해주세요."),
          { enableHighAccuracy: true, timeout: 10000 }
        );
      };

      const animateBetweenPins = (fromPin, toPin, onComplete) => {
        const map = mapInstanceRef.current;
        if (!map || !fromPin || !toPin) {
          if (onComplete) onComplete();
          return;
        }

        clearActiveAnimationLayers();
        const transit = estimateTransitInfo(fromPin, toPin);

        setAnimatingInfo({ fromPin, toPin, transit, progress: 0 });
        setLastCompletedSegment({ fromPin, toPin, transit });

        const bounds = L.latLngBounds([
          [fromPin.lat, fromPin.lng],
          [toPin.lat, toPin.lng]
        ]);
        map.flyToBounds(bounds.pad(0.45), { duration: 0.8 });

        const travelerIcon = L.divIcon({
          html: `<div class="traveler-avatar">🚶</div>`,
          className: "",
          iconSize: [42, 42],
          iconAnchor: [21, 21]
        });

        const travelerMarker = L.marker([fromPin.lat, fromPin.lng], {
          icon: travelerIcon,
          zIndexOffset: 1000
        }).addTo(map);
        travelerMarkerRef.current = travelerMarker;

        const activeLine = L.polyline([[fromPin.lat, fromPin.lng]], {
          color: "#0ea5e9",
          weight: 6,
          opacity: 0.95
        }).addTo(map);
        activeSegmentLineRef.current = activeLine;

        const durationMs = 2000;
        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const rawT = Math.min(1, elapsed / durationMs);
          const t = rawT < 0.5 ? 4 * rawT * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 3) / 2;

          const curLat = fromPin.lat + (toPin.lat - fromPin.lat) * t;
          const curLng = fromPin.lng + (toPin.lng - fromPin.lng) * t;

          travelerMarker.setLatLng([curLat, curLng]);
          activeLine.setLatLngs([
            [fromPin.lat, fromPin.lng],
            [curLat, curLng]
          ]);

          setAnimatingInfo((prev) =>
            prev ? { ...prev, progress: Math.round(rawT * 100) } : null
          );

          if (rawT < 1) {
            animFrameRef.current = requestAnimationFrame(step);
          } else {
            map.flyTo([toPin.lat, toPin.lng], 16, { duration: 0.8 });
            setTimeout(() => {
              clearActiveAnimationLayers();
              setAnimatingInfo(null);
              setSelectedPinId(toPin.id);
              const toIdx = pins.findIndex((p) => p.id === toPin.id);
              if (toIdx !== -1 && markersRef.current[toIdx]) {
                markersRef.current[toIdx].openPopup();
              }
              if (onComplete) onComplete();
            }, 800);
          }
        };

        animFrameRef.current = requestAnimationFrame(step);
      };

      const handleCompleteAndMoveNext = (pinId) => {
        const currentIndex = pins.findIndex((p) => p.id === pinId);
        if (currentIndex === -1) return;

        const currentPin = pins[currentIndex];
        const nextPin = pins[currentIndex + 1] || null;

        setPins((prev) =>
          prev.map((p) => (p.id === pinId ? { ...p, completed: true } : p))
        );

        if (nextPin) {
          const tInfo = estimateTransitInfo(currentPin, nextPin);
          showToast(
            `✅ '${currentPin.name}' 완료! 다음 '${nextPin.name}'까지 도보 약 ${tInfo.walkFormatted}`
          );
          setMobileView("split");
          animateBetweenPins(currentPin, nextPin);
        } else {
          showToast(`🎉 모든 여행 코스를 완료했습니다!`);
        }
      };

      const handlePlayFullJourney = () => {
        if (pins.length < 2 || isJourneyPlaying) return;
        setActiveTab("itinerary");
        setMobileView("split");
        setIsJourneyPlaying(true);
        showToast("🕒 전체 타임라인 이동 시뮬레이션을 시작합니다!");

        let idx = 0;
        const playNext = () => {
          if (idx >= pins.length - 1) {
            setIsJourneyPlaying(false);
            showToast("✨ 전체 타임라인 이동 확인이 완료되었습니다.");
            return;
          }
          animateBetweenPins(pins[idx], pins[idx + 1], () => {
            idx += 1;
            setTimeout(playNext, 450);
          });
        };
        playNext();
      };

      const handleExportJSON = () => {
        const safeFileName =
          cleanSafeText(tripTitle, 40, "travel").replace(/[\\/:*?"<>|.\s]+/g, "_") || "travel";
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(
            JSON.stringify({ tripTitle, exchangeRate, peopleCount, pins, notes, checklist }, null, 2)
          );
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `${safeFileName}_plan.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("💾 여행 계획과 메모장이 JSON 파일로 백업되었습니다!");
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (file.size > 1024 * 1024) {
          showToast("⚠️ 1MB 이하의 정상 백업 JSON 파일만 불러올 수 있습니다.");
          return;
        }
        const reader = new FileReader();
        reader.readAsText(file, "UTF-8");
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed && Array.isArray(parsed.pins)) {
              const safePins = sanitizePinList(parsed.pins);
              setPins(safePins);
              if (parsed.tripTitle) {
                setTripTitle(cleanSafeText(parsed.tripTitle, 80, "우리의 여행 플래너 ✈️"));
              }
              if (parsed.exchangeRate) {
                setExchangeRate(Math.max(0.5, Math.min(100, Number(parsed.exchangeRate) || 9.05)));
              }
              if (Array.isArray(parsed.notes)) setNotes(parsed.notes.slice(0, 30));
              if (Array.isArray(parsed.checklist)) setChecklist(parsed.checklist.slice(0, 200));
              if (safePins[0]) setSelectedPinId(safePins[0].id);
              showToast("📂 여행 계획을 안전하게 검증하여 불러왔습니다!");
            }
          } catch {
            showToast("⚠️ 올바른 JSON 파일이 아닙니다.");
          }
        };
      };

      // 🔍 구글 지도 링크(모바일 앱 공유 maps.app.goo.gl 포함) 해독 & 다국어(한/일/영) 검색 목록
      const executePlaceSearch = async (rawQueryInput) => {
        const query = (rawQueryInput ?? searchKeyword).trim();
        if (!query) return;

        setIsSearching(true);
        setSearchResults([]);
        setTranslatedInfo(null);

        try {
          const { cleanUrl, textHint } = extractUrlAndHintFromInput(query);
          const isUrl =
            Boolean(cleanUrl) ||
            query.startsWith("http://") ||
            query.startsWith("https://") ||
            query.includes("maps.app") ||
            query.includes("google.") ||
            query.includes("goo.gl") ||
            query.includes("/maps/");

          if (isUrl) {
            const clientParsed = parseGoogleMapsUrlClient(query);
            if (clientParsed) {
              setSearchResults([clientParsed]);
              setIsSearching(false);
              showToast("📍 구글맵 링크 좌표를 즉시 확인했습니다! [＋ 선택]을 눌러 추가하세요.");
              return;
            }
          }

          try {
            const targetUrlParam = cleanUrl || query;
            const apiParam = isUrl
              ? `url=${encodeURIComponent(targetUrlParam)}&hint=${encodeURIComponent(textHint || "")}`
              : `q=${encodeURIComponent(query)}`;
            const apiRes = await fetch(`/api/resolve?${apiParam}`);
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              if (apiData.translated) {
                setTranslatedInfo({
                  original: apiData.originalQuery || textHint || query,
                  ja: apiData.translated.ja,
                  en: apiData.translated.en
                });
              }

              // 모바일 구글맵 단축 링크(maps.app.goo.gl)에서 좌표가 바로 해독된 경우!
              if (
                apiData.resolved &&
                apiData.lat !== undefined &&
                apiData.lat !== null &&
                apiData.lng !== undefined &&
                apiData.lng !== null
              ) {
                const resolvedTitle = apiData.name || textHint || "구글맵 공유 장소";
                const primaryItem = {
                  name: resolvedTitle,
                  address: apiData.address || targetUrlParam,
                  lat: Number(apiData.lat),
                  lng: Number(apiData.lng),
                  spendInfo: estimateGoogleAvgSpend(resolvedTitle, customCategory)
                };
                const extraItems = Array.isArray(apiData.results)
                  ? apiData.results
                      .filter(
                        (r) =>
                          Math.abs(Number(r.lat) - primaryItem.lat) > 0.0005 ||
                          Math.abs(Number(r.lng) - primaryItem.lng) > 0.0005
                      )
                      .map((r) => ({
                        ...r,
                        lat: Number(r.lat),
                        lng: Number(r.lng),
                        spendInfo: estimateGoogleAvgSpend(r.name, customCategory)
                      }))
                  : [];
                setSearchResults([primaryItem, ...extraItems]);
                setIsSearching(false);
                showToast(`📍 '${resolvedTitle}' 위치를 찾았습니다! [＋ 선택]을 눌러주세요.`);
                return;
              }

              if (apiData.results && apiData.results.length > 0) {
                setSearchResults(
                  apiData.results.map((r) => ({
                    ...r,
                    lat: Number(r.lat),
                    lng: Number(r.lng),
                    spendInfo: r.spendInfo || estimateGoogleAvgSpend(r.name, customCategory)
                  }))
                );
                setIsSearching(false);
                return;
              }
            }
          } catch (err) {}

          // 만약 URL이었는데 서버 리다이렉트 추적이 실패했고 힌트 텍스트(가게 이름)도 없다면 URL 자체를 지오코더에 넣지 않음
          const fallbackKeyword = isUrl ? textHint : query;
          if (!fallbackKeyword || fallbackKeyword.startsWith("http")) {
            showToast("⚠️ 단축 링크에서 좌표를 찾지 못했습니다. 장소 이름으로 검색해보세요!");
            setIsSearching(false);
            return;
          }

          const translateDirect = async (text, tl) => {
            try {
              const r = await fetch(
                `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(
                  text
                )}`
              );
              const d = await r.json();
              return d?.[0]?.map((x) => x[0]).join("") || text;
            } catch {
              return text;
            }
          };

          const [jaKw, enKw] = await Promise.all([
            translateDirect(fallbackKeyword, "ja"),
            translateDirect(fallbackKeyword, "en")
          ]);
          setTranslatedInfo({ original: fallbackKeyword, ja: jaKw, en: enKw });

          const extra = [];
          if (enKw.toLowerCase().startsWith("hotel ")) {
            extra.push(enKw.replace(/^hotel\s+/i, "") + " Hotel");
          }

          const keywords = Array.from(
            new Set([fallbackKeyword, jaKw, enKw, ...extra].filter(Boolean))
          );
          const directList = [];

          await Promise.all(
            keywords.map(async (kw) => {
              try {
                const pRes = await fetch(
                  `https://photon.komoot.io/api/?q=${encodeURIComponent(kw)}&limit=6`
                );
                const pData = await pRes.json();
                if (pData?.features) {
                  pData.features.forEach((f) => {
                    const coords = f.geometry?.coordinates;
                    const props = f.properties || {};
                    if (coords && coords.length === 2) {
                      const title = props.name || props.street || kw;
                      const addr = [props.country, props.city, props.district, props.street]
                        .filter(Boolean)
                        .join(" ");
                      directList.push({
                        name: title,
                        address: addr || title,
                        lat: parseFloat(coords[1]),
                        lng: parseFloat(coords[0]),
                        spendInfo: estimateGoogleAvgSpend(title, customCategory)
                      });
                    }
                  });
                }
              } catch (e) {}

              try {
                const arcRes = await fetch(
                  `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine=${encodeURIComponent(
                    kw
                  )}&f=json&outFields=PlaceName,Place_addr,Match_addr&maxLocations=6`
                );
                const arcData = await arcRes.json();
                if (arcData?.candidates) {
                  arcData.candidates.forEach((c) => {
                    if (c.location) {
                      const title = c.attributes?.PlaceName || c.address.split(",")[0] || kw;
                      directList.push({
                        name: title,
                        address: c.attributes?.Place_addr || c.attributes?.Match_addr || c.address,
                        lat: c.location.y,
                        lng: c.location.x,
                        spendInfo: estimateGoogleAvgSpend(title, customCategory)
                      });
                    }
                  });
                }
              } catch (e) {}

              try {
                const nomRes = await fetch(
                  `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(
                    kw
                  )}&limit=5&accept-language=ko,ja,en`
                );
                const nomData = await nomRes.json();
                if (Array.isArray(nomData)) {
                  nomData.forEach((item) => {
                    const title = item.name || item.display_name.split(",")[0];
                    directList.push({
                      name: title,
                      address: item.display_name,
                      lat: parseFloat(item.lat),
                      lng: parseFloat(item.lon),
                      spendInfo: estimateGoogleAvgSpend(title, customCategory)
                    });
                  });
                }
              } catch (e) {}
            })
          );

          const unique = [];
          for (const item of directList) {
            if (
              !unique.some(
                (u) => Math.abs(u.lat - item.lat) < 0.0006 && Math.abs(u.lng - item.lng) < 0.0006
              )
            ) {
              unique.push(item);
            }
          }

          setSearchResults(unique.slice(0, 10));
        } finally {
          setIsSearching(false);
        }
      };

      const handleSearchPlacesAndLinks = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        await executePlaceSearch(searchKeyword);
      };

      const handlePasteFromClipboard = async () => {
        try {
          if (!navigator.clipboard || !navigator.clipboard.readText) {
            showToast("입력창을 길게 눌러 '붙여넣기'를 해주세요!");
            return;
          }
          const text = await navigator.clipboard.readText();
          if (text && text.trim()) {
            setSearchKeyword(text.trim());
            await executePlaceSearch(text.trim());
          } else {
            showToast("클립보드에 복사된 텍스트나 구글맵 링크가 없습니다.");
          }
        } catch (err) {
          showToast("입력창을 길게 눌러 복사한 링크를 붙여넣어 주세요!");
        }
      };

      const addPinToMap = ({ name, category, address, lat, lng, spendInfo }) => {
        explicitlyClearedRef.current = false;
        const finalCategory = category || customCategory;
        const computedSpend = spendInfo || estimateGoogleAvgSpend(name, finalCategory);

        // E. 새 장소 추가 시 Day 붙이기
        const pendingDayId =
          (typeof window !== "undefined" && window.__pendingDayId) ||
          (selectedDayId !== "all" ? selectedDayId : null) ||
          "day-1";

        const pendingDayLabel =
          (typeof window !== "undefined" && window.__pendingDayLabel) ||
          dayOptions.find((d) => d.id === pendingDayId)?.label ||
          "Day 1";

        const newPin = {
          id: "pin-" + Date.now(),
          name,
          category: finalCategory,
          address: address || "",
          lat: Number(lat),
          lng: Number(lng),
          completed: false,
          memo: "",
          customTransitMinutes: null,
          spendInfo: computedSpend,
          items: [],
          dayId: pendingDayId,
          dayLabel: pendingDayLabel,
          localTodos: []
        };

        if (typeof window !== "undefined") {
          window.__pendingDayId = null;
          window.__pendingDayLabel = null;
        }

        setPins((prev) => {
          const nextPins = [...prev, newPin];
          pushCloudData(
            {
              ...latestStateRef.current,
              pins: nextPins
            },
            false
          );
          return nextPins;
        });
        setSelectedPinId(newPin.id);
        setShowAddModal(false);
        setSearchKeyword("");
        setSearchResults([]);

        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo([newPin.lat, newPin.lng], 16, { duration: 0.9 });
        }
        showToast(`📍 '${newPin.name}' 추가 및 클라우드 실시간 동기화 완료!`);
      };

      const handleMovePinOrder = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= pins.length) return;
        const copied = [...pins];
        const temp = copied[index];
        copied[index] = copied[targetIndex];
        copied[targetIndex] = temp;
        setPins(copied);
      };

// (Drag handlers moved to top of App component)

      const handleSavePinEdit = (pinId) => {
        if (!editNameText.trim()) return;
        setPins((prev) =>
          prev.map((p) =>
            p.id === pinId
              ? {
                  ...p,
                  name: editNameText.trim(),
                  category: editCategoryText,
                  spendInfo: estimateGoogleAvgSpend(editNameText.trim(), editCategoryText)
                }
              : p
          )
        );
        setEditingPinId(null);
        showToast("✏️ 장소 정보가 수정되었습니다.");
      };

      const handleAddItem = (e, targetPin = null) => {
        if (e && e.preventDefault) e.preventDefault();
        const pinObj = targetPin || selectedPin;
        if (!pinObj || !newItemTitle.trim()) return;
        const rawAmount = parseFloat(String(newItemAmount).replace(/[^0-9.]/g, "")) || 0;
        const priceKRW =
          inputCurrency === "JPY" ? Math.round(rawAmount * exchangeRate) : Math.round(rawAmount);
        const priceJPY =
          inputCurrency === "JPY"
            ? Math.round(rawAmount)
            : Math.round(rawAmount / (exchangeRate || 9.05));

        const newItem = {
          id: "item-" + Date.now(),
          title: newItemTitle.trim(),
          price: priceKRW,
          yen: priceJPY,
          bought: false
        };

        setPins((prev) =>
          prev.map((p) =>
            p.id === pinObj.id ? { ...p, items: [...p.items, newItem] } : p
          )
        );
        setNewItemTitle("");
        setNewItemAmount("");
        showToast(`🛍️ '${newItem.title}' 예산 항목이 추가되었습니다.`);
      };

      // 📝 대형 메모장 핸들러
      const activeNoteObj = useMemo(
        () => notes.find((n) => n.id === activeNoteId) || notes[0] || DEFAULT_NOTE_PAD[0],
        [notes, activeNoteId]
      );

      const handleUpdateNoteContent = (val) => {
        clearNoteSaveTimer();
        setNoteSaveStatus("saving");
        const nowTs = Date.now();
        const nowStr = new Date(nowTs).toLocaleString("ko-KR");
        setNotes((prev) =>
          prev.map((n) =>
            n.id === activeNoteObj.id
              ? { ...n, content: val, updatedAt: nowStr, updatedAtMs: nowTs }
              : n
          )
        );
      };

      const handleUpdateNoteTitle = (val) => {
        clearNoteSaveTimer();
        setNoteSaveStatus("saving");
        const nowTs = Date.now();
        const nowStr = new Date(nowTs).toLocaleString("ko-KR");
        setNotes((prev) =>
          prev.map((n) =>
            n.id === activeNoteObj.id
              ? { ...n, title: val, updatedAt: nowStr, updatedAtMs: nowTs }
              : n
          )
        );
      };

      const handleAddNewNoteSheet = () => {
        clearNoteSaveTimer();
        setNoteSaveStatus("saving");
        const nowTs = Date.now();
        const newSheet = {
          id: "note-" + nowTs,
          title: `📝 새 메모장 #${notes.length + 1}`,
          content: "",
          updatedAt: new Date(nowTs).toLocaleString("ko-KR"),
          updatedAtMs: nowTs
        };
        setNotes((prev) => [...prev, newSheet]);
        setActiveNoteId(newSheet.id);
        showToast("📝 새 메모 시트가 추가되었습니다!");
      };

      const handleAddChecklistItem = (e) => {
        e.preventDefault();
        if (!newCheckText.trim()) return;
        setChecklist((prev) => [
          ...prev,
          { id: "chk-" + Date.now(), text: newCheckText.trim(), done: false }
        ]);
        setNewCheckText("");
      };

      const openGoogleMapsTransit = (pinA, pinB) => {
        const latA = Number(pinA?.lat);
        const lngA = Number(pinA?.lng);
        const latB = Number(pinB?.lat);
        const lngB = Number(pinB?.lng);
        if (!Number.isFinite(latA) || !Number.isFinite(lngA) || !Number.isFinite(latB) || !Number.isFinite(lngB)) {
          return;
        }
        const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(
          `${latA},${lngA}`
        )}&destination=${encodeURIComponent(`${latB},${lngB}`)}&travelmode=walking`;
        window.open(url, "_blank", "noopener,noreferrer");
      };

      // 현재 활성 뷰 판별 (중복 탭 제거 → 3개 핵심 탭: 지도+코스 / 메모장 / 예산·정산)
      const currentView =
        activeTab === "notepad" || mobileView === "notepad"
          ? "notepad"
          : activeTab === "budget" || mobileView === "budget"
          ? "budget"
          : "split";

      const switchAppView = (viewName) => {
        if (viewName === "notepad") {
          setActiveTab("notepad");
          setMobileView("notepad");
        } else if (viewName === "budget") {
          setActiveTab("budget");
          setMobileView("budget");
        } else {
          setActiveTab("itinerary");
          setMobileView("split");
        }
      };

      // 👑 관리자 권한 페이지 모달 (관리자 전용 마스터 키 인증 성공 시에만 오픈)
      const renderAdminVaultModal = () => {
        if (!showAdminPage) return null;
        return (
          <div
            className="modal-overlay"
            onClick={() => setShowAdminPage(false)}
          >
            <div
              className="modal-panel max-w-lg space-y-4"
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between border-b border-slate-200/80 pb-3">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-2xl bg-amber-100 border border-amber-300 flex items-center justify-center text-lg">
                    👑
                  </div>
                  <div>
                    <h3 className="modal-title">관리자 권한 페이지</h3>
                    <p className="text-[11px] text-amber-700 font-bold">
                      접속 허용 비밀번호 지정 · 추가 · 차단 IP 관리
                    </p>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setShowAdminPage(false)}
                  className="btn-ghost text-xs px-2.5 py-1"
                >
                  ✕
                </button>
              </div>

              {adminFeedbackMsg && (
                <div className="p-3 rounded-2xl bg-indigo-50 border border-indigo-200 text-xs font-extrabold text-indigo-700">
                  {adminFeedbackMsg}
                </div>
              )}

              {/* 🎲 원클릭 난수 초대 링크 (비밀번호 은닉 및 매번 다른 난수 발생) */}
              <div className="p-4 rounded-2xl bg-gradient-to-r from-pink-500/10 to-indigo-500/10 border border-pink-300/60 space-y-2.5">
                <div className="flex items-center justify-between">
                  <div className="text-xs font-black text-slate-800 flex items-center gap-1.5">
                    <span>🎲</span>
                    <span>원클릭 난수 보안 초대 링크</span>
                  </div>
                  <span className="text-[10px] font-bold text-pink-700 bg-pink-100 px-2 py-0.5 rounded-full">
                    비밀번호 노출 0%
                  </span>
                </div>
                <p className="text-[11px] text-slate-600 leading-relaxed">
                  복사할 때마다 예측 불가능한 새로운 보안 난수 토큰이 생성됩니다. 동행인·참여자에게 링크를 공유하면 <b>비밀번호를 몰라도 누르는 즉시 자동으로 안전하게 접속</b>되며, 링크를 통해 실제 비밀번호를 유추할 수 없습니다.
                </p>
                <div className="p-2.5 rounded-xl bg-indigo-50/80 border border-indigo-200/60 text-[11px] text-indigo-900 leading-snug">
                  💡 <strong>공유 플래너 안내:</strong> 초대 링크는 별도의 여행 방이 아니라, 모두가 동일한 일정과 메모를 함께 확인하고 편집하는 <strong>같은 공유 플래너 입장권</strong>입니다.
                </div>
                <button
                  type="button"
                  onClick={handleGenerateInviteTicket}
                  className="w-full py-2.5 px-3 rounded-xl btn-primary text-xs font-black shadow-lg transition flex items-center justify-center gap-1.5"
                >
                  <span>📋</span>
                  <span>동행인 / 참여자 전송용 난수 보안 초대 링크 복사</span>
                </button>
              </div>

              {/* 1. 새 비밀번호 지정 / 추가 */}
              <div className="p-4 rounded-2xl bg-white border border-slate-200 space-y-3">
                <div className="text-xs font-black text-slate-900 flex items-center justify-between">
                  <span>🔑 시작 페이지 접속 비밀번호 지정·추가</span>
                  <span className="text-[10px] text-emerald-600 font-bold">PBKDF2 암호화</span>
                </div>
                <p className="text-[11px] text-slate-500 leading-relaxed">
                  여기서 지정한 비밀번호를 입력한 사람만 플래너 페이지가 열립니다. 기존 비밀번호를 완전히 바꾸거나, 동행인·참여자별 비밀번호를 여러 개 추가할 수도 있습니다.
                </p>
                <div className="space-y-2">
                  <input
                    type="text"
                    spellCheck={false}
                    value={adminNewPasswordLabel}
                    onChange={(e) => setAdminNewPasswordLabel(e.target.value)}
                    placeholder="비밀번호 메모/별칭 (예: 마스터 비번, 동행인 A용 등 - 선택)"
                    className="modal-input text-xs py-2"
                  />
                  <input
                    type="text"
                    spellCheck={false}
                    value={adminNewPasswordInput}
                    onChange={(e) => setAdminNewPasswordInput(e.target.value)}
                    placeholder="새로 지정할 접속 비밀번호 입력 (4자 이상)"
                    className="modal-input text-xs py-2 font-bold"
                  />
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => handleAdminSavePassword("setPrimary")}
                      className="btn-primary text-xs py-2"
                    >
                      🔄 이 비번으로 단독 변경
                    </button>
                    <button
                      type="button"
                      onClick={() => handleAdminSavePassword("add")}
                      className="py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black shadow-sm transition"
                    >

                      <input

                        <span className="w-2 h-2 rounded-full bg-rose-400"></span>

                <div className="flex items-center gap-1.5 shrink-0">

                  >
                    <span>{theme === "light" ? "🌙" : "☀️"}</span>
                    <span className="hidden sm:inline">
                      {theme === "light" ? "다크" : "라이트"}

                  <button

                  <span>지도 + 여행 코스 ({pins.length})</span>

                <button
                  onClick={() => switchAppView("notepad")}

                <button
                  onClick={() => switchAppView("budget")}
                  className={`segmented-item ${currentView === "budget" ? "segmented-item-active" : ""}`}
                >
                  <span>💰</span>
                  <span>예산 · 1/N 정산 · 통계</span>
                </button>
              </div>
            </div>
          </header>

          {/* =================================================================
              🗺️ 메인 영역 1: 지도 + 여행 코스 (Apple Liquid Glass)
             ================================================================= */}

            className={`flex-1 max-w-[1160px] w-full mx-auto px-3 py-3 sm:p-5 ${
              currentView === "split" ? "block" : "hidden"
            }`}
          >
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-5">
              {/* 1. 지도 패널 (Apple Liquid Glass Frame) */}

                <div ref={mapContainerRef} className="w-full h-full flex-1 z-10" />

                <div className="absolute top-3 left-3 right-3 z-20 flex items-center justify-between gap-2 pointer-events-none">

                    onClick={() => {

                        mapInstanceRef.current.flyToBounds(bounds.pad(0.3), { duration: 0.8 });
                      }
                    }}
                    className="glass-pill-btn pointer-events-auto"
                  >
                    <span>🔍</span>
                    <span>전체 코스</span>
                  </button>
                </div>

                {(animatingInfo || lastCompletedSegment) && (
                  <div className="absolute bottom-2.5 left-2.5 right-2.5 z-30 bg-white/95 backdrop-blur-xl border border-sky-300 rounded-2xl p-2.5 sm:p-3 shadow-xl">
                    {animatingInfo ? (
                      <>
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-[11px] font-extrabold text-sky-700">
                            🕒 타임라인 이동 중... ({animatingInfo.progress}%)
                          </span>
                          <span className="text-xs font-black text-emerald-600">
                            🚶 도보 약 {animatingInfo.transit.walkFormatted} ({animatingInfo.transit.distanceKm}km)
                          </span>
                        </div>
                        <div className="text-xs font-extrabold text-slate-800 truncate">
                          📍 {animatingInfo.fromPin.name} ━━🚶━━▶ 🎯 {animatingInfo.toPin.name}

                            <div className="text-xs font-black text-slate-800 mt-0.5 truncate">

                              <span className="text-emerald-600">

                    <button

                      모든 Day
                    </button>
                    {dayOptions.map((d) => (
                      <button
                        key={d.id}
                        className={`day-chip ${selectedDayId === d.id ? "day-chip-active" : "day-chip-idle"}`}

                      </button>

                    </button>

                      type="button"

                      <span>📋</span>
                      <span>일정 텍스트 복사</span>
                    </button>

                      <p className="text-xs text-slate-500 leading-relaxed">

                      <div className="flex flex-wrap justify-center gap-2 pt-2">
                        <button
                          onClick={() => setShowAddModal(true)}
                          className="btn-primary text-xs font-extrabold shadow-md"

                          onClick={handleRecoverPreviousStorageData}
                          className="btn-ghost text-xs font-extrabold text-emerald-700 bg-emerald-50 border border-emerald-200"

                        </button>
                      </div>
                    </div>

                      <div className="text-sm font-bold text-slate-700">

                      </div>
                      <button
                        onClick={() => {
                          setCourseFilter("all");
                          setSelectedDayId("all");

                      >

                      </button>
                    </div>

                    visiblePins.map((pin, index) => {
                      const realIndex = pins.findIndex((p) => p.id === pin.id);
                      const isSelected = pin.id === selectedPin?.id;
                      const isExpanded = expandedPinId === pin.id;
                      const pinTotalKRW = (pin.items || []).reduce((s, i) => s + Number(i.price || 0), 0);
                      const avgSpend = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
                      const nextPin = realIndex >= 0 && realIndex < pins.length - 1 ? pins[realIndex + 1] : null;
                      const transitToNext = nextPin ? estimateTransitInfo(pin, nextPin) : null;

                      return (
                        <React.Fragment key={pin.id}>
                          <div
                            draggable
                            onDragStart={() => handleDragStart(index)}
                            onDragEnter={() => handleDragEnter(index)}
                            onDragEnd={handleDragEnd}
                            onDragOver={(e) => e.preventDefault()}
                            onClick={() => {
                              setSelectedPinId(pin.id);
                              setExpandedPinId((prev) => (prev === pin.id ? null : pin.id));
                              if (mapInstanceRef.current) {
                                mapInstanceRef.current.flyTo([pin.lat, pin.lng], 16, { duration: 0.7 });
                                if (markersRef.current[realIndex]) {
                                  markersRef.current[realIndex].openPopup();
                                }
                              }
                            }}
                            className={`
                              pin-card relative transition-all duration-200 cursor-grab active:cursor-grabbing
                              ${isSelected ? "pin-selected" : ""}
                              ${dragOverIndex === index ? "pin-drag-over" : ""}
                              ${pin.completed ? "opacity-75" : ""}
                            `}
                          >
                            <div className="flex items-start justify-between gap-2">
                              <div className="min-w-0 flex-1">
                                <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                                  {/* Day select 연결 (Day 변경 및 라벨 표시) */}
                                  <select
                                    value={pin.dayId || "day-1"}
                                    onChange={(e) => {
                                      const id = e.target.value;
                                      const label = dayOptions.find((d) => d.id === id)?.label || id;
                                      handleChangePinDay(pin.id, id, label);
                                    }}
                                    onClick={(e) => e.stopPropagation()}
                                    className="text-[10px] font-black text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-md px-1.5 py-0.5 cursor-pointer focus:outline-none"
                                    title="일차(Day) 변경"
                                  >
                                    {dayOptions.map((d) => (
                                      <option key={d.id} value={d.id}>
                                        {d.label}
                                      </option>
                                    ))}
                                  </select>
                                  <span className="text-[11px] font-bold text-slate-500">
                                    {pin.category}
                                  </span>
                                  {pin.memo && (
                                    <span className="text-[10px] font-semibold text-slate-400 truncate max-w-[170px] sm:max-w-[240px]">
                                      · 📝 {pin.memo}
                                    </span>
                                  )}
                                </div>
                                <h3 className="pin-title truncate">{pin.name}</h3>
                                <p className="pin-meta truncate mt-0.5">{pin.address}</p>
                              </div>

                              <div
                                className="flex items-center gap-1 shrink-0"
                                onClick={(e) => e.stopPropagation()}
                              >
                                <button
                                  onClick={() => handleMovePinOrder(realIndex, -1)}
                                  disabled={realIndex === 0}
                                  title="위로 이동"
                                  className="w-7 h-7 rounded-xl bg-white/70 hover:bg-white border border-white/80 text-slate-600 disabled:opacity-20 text-[11px] flex items-center justify-center transition shadow-xs"
                                >
                                  ▲
                                </button>
                                <button
                                  onClick={() => handleMovePinOrder(realIndex, 1)}
                                  disabled={realIndex === pins.length - 1}
                                  title="아래로 이동"
                                  className="w-7 h-7 rounded-xl bg-white/70 hover:bg-white border border-white/80 text-slate-600 disabled:opacity-20 text-[11px] flex items-center justify-center transition shadow-xs"
                                >
                                  ▼
                                </button>
                                <button
                                  onClick={() =>
                                    requestDeleteConfirm(
                                      "코스를 삭제하시겠습니까?",
                                      `'${pin.name}' 코스와 등록된 예산 항목(${pin.items.length}건)이 함께 삭제됩니다.`,
                                      () => {
                                        setPins((prev) => prev.filter((p) => p.id !== pin.id));
                                        showToast(`'${pin.name}' 코스가 삭제되었습니다.`);
                                      }
                                    )
                                  }
                                  title="코스 삭제"
                                  className="w-7 h-7 rounded-xl bg-rose-50/80 hover:bg-rose-100 border border-rose-200/80 text-rose-600 text-xs font-bold flex items-center justify-center ml-0.5 transition shadow-xs"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>

                                onClick={() =>

                                <span className="font-bold text-slate-600">

                                </span>
                                <span className="text-slate-300">·</span>
                                <span className="font-extrabold text-emerald-600">

                                </span>
                              </div>
