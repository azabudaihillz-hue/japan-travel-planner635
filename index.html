    const { useState, useEffect, useRef, useMemo } = React;

    // 🔒 영구 고정 저장소 키 (이제 코드 업데이트를 해도 절대 바뀌지 않습니다!)
    const STORAGE_KEY_PINS = "travel_planner_master_pins";
    const STORAGE_KEY_TITLE = "travel_planner_master_title";
    const STORAGE_KEY_RATE = "travel_planner_master_rate";

    // 🔄 이전 버전(v1 ~ v13)에 저장되어 있던 내 여행 데이터를 자동으로 찾아 복구하는 함수
    function loadSavedPinsWithMigration() {
      try {
        const masterData = localStorage.getItem(STORAGE_KEY_PINS);
        if (masterData) {
          const parsed = JSON.parse(masterData);
          if (Array.isArray(parsed)) return parsed;
        }

        // 이전 버전 키들을 최신순으로 스캔하여 사용자가 직접 넣었던 데이터 발굴
        const legacyKeys = [
          "travel_planner_pins_v13",
          "travel_planner_pins_v12",
          "travel_planner_pins_v11",
          "travel_planner_pins_v10",
          "travel_planner_pins_v9",
          "travel_planner_pins_v8",
          "travel_planner_pins_v7",
          "travel_planner_pins_v6",
          "travel_planner_pins_v5",
          "travel_planner_pins_v4",
          "travel_planner_pins"
        ];

        let fallbackCandidate = null;

        for (const key of legacyKeys) {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          try {
            const arr = JSON.parse(raw);
            if (!Array.isArray(arr) || arr.length === 0) continue;

            // 기본 샘플(pin-101, pin-102 등)이 아닌 사용자가 직접 추가한 핀이 있는지 확인
            const hasUserCreatedPin = arr.some(
              (p) =>
                p &&
                typeof p.id === "string" &&
                !["pin-101", "pin-102", "pin-103", "pin-104"].includes(p.id)
            );

            if (hasUserCreatedPin) {
              // 샘플 핀(글리코상, 이치란 등)이 섞여 있다면 걸러내고 내 데이터만 복원하거나 전체 복원
              localStorage.setItem(STORAGE_KEY_PINS, JSON.stringify(arr));
              return arr;
            }

            if (!fallbackCandidate) {
              fallbackCandidate = arr;
            }
          } catch (e) {}
        }

        // 사용자가 입력한 적이 없으면 글리코상 같은 더미 없이 깨끗한 빈 배열([])로 시작!
        return [];
      } catch (e) {
        return [];
      }
    }

    function loadSavedTitleWithMigration() {
      const master = localStorage.getItem(STORAGE_KEY_TITLE);
      if (master) return master;
      for (let i = 13; i >= 4; i--) {
        const old = localStorage.getItem(`travel_planner_title_v${i}`);
        if (old && old !== "여행 계획") return old;
      }
      return "나의 일본 여행";
    }

          desc: "구글 맵 공항·특급열차 1인 평균 교통비",
          recommendedTitle: "1인 평균 특급열차·교통비"

      return {

        avgYen: 1500,

        desc: "구글 맵 관람·간식·입장료 인당 평균 지출액",

      };
    }

    const PRESET_PLACES = [
      { name: "호텔 아마넥 오사카 난바", category: "🏨 숙소·호텔", lat: 34.6674727, lng: 135.5039453, address: "오사카 주오구 니시신사이바시 2-6-10" },
      { name: "간사이 국제공항", category: "✈️ 공항·교통", lat: 34.4320, lng: 135.2304, address: "오사카 이즈미사노시" },
      { name: "오사카 도톤보리", category: "📸 명소·포토존", lat: 34.6687, lng: 135.5013, address: "오사카 주오구 도톤보리" },
      { name: "유니버설 스튜디오 재팬 (USJ)", category: "🎢 테마파크", lat: 34.6654, lng: 135.4323, address: "오사카 고노하나구 사쿠라지마" },
      { name: "우메다 스카이빌딩 공중정원", category: "🌃 전망대·야경", lat: 34.7055, lng: 135.4896, address: "오사카 기타구 오요도나카" }
    ];

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function formatMinutesToKorean(mins) {
      const m = Math.round(Number(mins) || 0);
      if (m <= 0) return "1분";
      const hours = Math.floor(m / 60);
      const remMins = m % 60;
      if (hours > 0 && remMins > 0) return `${hours}시간 ${remMins}분`;
      if (hours > 0) return `${hours}시간`;
      return `${remMins}분`;
    }

    // 🚶 도보 시간 + 🚇 대중교통 시간 2가지 동시 자동 계산 함수
    function estimateTransitInfo(pinA, pinB) {
      if (!pinA || !pinB) return null;
      const straightKm = getDistanceKm(pinA.lat, pinA.lng, pinB.lat, pinB.lng);

      const walkRoadKm = straightKm * 1.28;
      const walkMinutes = Math.max(2, Math.round((walkRoadKm / 4.5) * 60));
      const walkFormatted = formatMinutesToKorean(walkMinutes);

      let transitMinutes = 0;
      let transitMode = "";

      if (pinB.customTransitMinutes && Number(pinB.customTransitMinutes) > 0) {
        transitMinutes = Number(pinB.customTransitMinutes);
        transitMode = "🚇 대중교통(직접지정)";
      } else if (straightKm < 0.55) {
        transitMinutes = walkMinutes;
        transitMode = "🚶 도보권";
      } else if (straightKm < 15) {
        transitMinutes = Math.round(((straightKm * 1.25) / 24) * 60 + 7);
        transitMode = "🚇 지하철·시내버스";
      } else if (straightKm < 65) {
        transitMinutes = Math.round(((straightKm * 1.2) / 45) * 60 + 12);
        transitMode = "🚆 급행전철·공항특급";
      } else {
        transitMinutes = Math.round((straightKm / 120) * 60 + 22);
        transitMode = "🚄 신칸센·특급열차";
      }

      const transitFormatted = formatMinutesToKorean(transitMinutes);

      return {
        distanceKm: straightKm.toFixed(1),
        walkMinutes,
        walkFormatted,
        transitMinutes,
        transitFormatted,
        totalMinutes: transitMinutes,
        formatted: transitFormatted,
        mode: transitMode
      };
    }

    // ⚡ 최단 경로 자동 재구성 알고리즘
    function optimizePinsShortestRoute(pinList) {
      if (!pinList || pinList.length <= 2) return pinList;

      const startPin = pinList[0];
      const remaining = pinList.slice(1);
      const ordered = [startPin];

      while (remaining.length > 0) {
        const current = ordered[ordered.length - 1];
        let nearestIdx = 0;
        let minDist = Infinity;

        for (let i = 0; i < remaining.length; i++) {
          const d = getDistanceKm(current.lat, current.lng, remaining[i].lat, remaining[i].lng);
          if (d < minDist) {
            minDist = d;
            nearestIdx = i;
          }
        }
        ordered.push(remaining.splice(nearestIdx, 1)[0]);
      }

      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 1; i < ordered.length - 2; i++) {
          for (let j = i + 1; j < ordered.length - 1; j++) {
            const d1 =
              getDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[i].lat, ordered[i].lng) +
              getDistanceKm(ordered[j].lat, ordered[j].lng, ordered[j + 1].lat, ordered[j + 1].lng);
            const d2 =
              getDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[j].lat, ordered[j].lng) +
              getDistanceKm(ordered[i].lat, ordered[i].lng, ordered[j + 1].lat, ordered[j + 1].lng);

            if (d2 + 0.01 < d1) {
              const reversedSub = ordered.slice(i, j + 1).reverse();
              ordered.splice(i, j - i + 1, ...reversedSub);
              improved = true;
            }
          }
        }
      }

      return ordered;
    }

    function getTotalRouteKm(pinList) {
      let sum = 0;
      for (let i = 0; i < pinList.length - 1; i++) {
        sum += getDistanceKm(pinList[i].lat, pinList[i].lng, pinList[i + 1].lat, pinList[i + 1].lng);
      }
      return sum;
    }

    function formatKRW(num) {
      return Math.round(Number(num || 0)).toLocaleString("ko-KR") + "원";
    }
    function formatJPY(num) {
      return "¥" + Math.round(Number(num || 0)).toLocaleString("ja-JP");
    }

    function parseGoogleMapsUrlClient(rawUrl) {
      try {
        const decoded = decodeURIComponent(rawUrl);
        let name = "구글 지도 공유 장소";
        const placeMatch = decoded.match(/\/maps\/place\/([^/@?]+)/);
        if (placeMatch && placeMatch[1]) {
          name = placeMatch[1].replace(/\+/g, " ").trim();
        }

        let lat = null;
        let lng = null;
        const exactMatches = [...decoded.matchAll(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g)];
        if (exactMatches.length > 0) {
          const last = exactMatches[exactMatches.length - 1];
          lat = parseFloat(last[1]);
          lng = parseFloat(last[2]);
        } else {
          const atMatch =
            decoded.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            decoded.match(/[?&](?:q|ll|center)=(-?\d+\.\d+),(-?\d+\.\d+)/);
          if (atMatch) {
            lat = parseFloat(atMatch[1]);
            lng = parseFloat(atMatch[2]);
          }
        }

        if (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng)) {
          return {
            name,
            address: `구글 지도 링크 정확한 좌표 (${lat.toFixed(5)}, ${lng.toFixed(5)})`,
            lat,
            lng,
            spendInfo: estimateGoogleAvgSpend(name, "")
          };
        }
      } catch (e) {}
      return null;
    }

    function App() {

      }, [pins]);
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_TITLE, tripTitle);
      }, [tripTitle]);
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_RATE, String(exchangeRate));
      }, [exchangeRate]);

      useEffect(() => {
        setTimeout(() => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.invalidateSize();
          }
        }, 150);
      }, [mobileView, activeTab]);

      // 만약 이전 버전 저장소에서 복원 가능한 데이터가 더 있는지 수동으로도 불러올 수 있는 함수
      const handleRecoverPreviousStorageData = () => {
        const allKeys = Object.keys(localStorage).filter((k) =>
          k.startsWith("travel_planner_pins")
        );
        let recovered = [];
        allKeys.forEach((k) => {
          try {
            const arr = JSON.parse(localStorage.getItem(k));
            if (Array.isArray(arr)) {
              arr.forEach((item) => {
                // 기본 샘플(글리코상, 이치란) 제외하고 내가 넣었던 핀만 모두 수집
                const isDefaultSample = ["pin-101", "pin-102", "pin-103", "pin-104"].includes(
                  item.id
                );
                const alreadyIn = recovered.some((r) => r.name === item.name);
                if (!isDefaultSample && !alreadyIn) {
                  recovered.push(item);
                }
              });
            }
          } catch (e) {}
        });

        if (recovered.length > 0) {
          setPins((prev) => {
            const merged = [...prev];
            recovered.forEach((r) => {
              if (!merged.some((m) => m.name === r.name)) merged.push(r);
            });
            return merged;
          });
          setShowResetModal(false);
          showToast(`✨ 이전 버전에 남아 있던 내 장소 ${recovered.length}곳을 모두 복구했습니다!`);
        } else {
          showToast("이전 버전 저장소에서 추가로 발견된 장소가 없습니다.");
        }
      };

      // 거슬리는 기본 샘플(글리코상, 도톤보리, 이치란 등)만 원클릭으로 싹 지우는 함수
      const handleRemoveSamplePinsOnly = () => {
        const sampleIds = ["pin-101", "pin-102", "pin-103", "pin-104"];
        const sampleNames = ["오사카 도톤보리 (글리코상)", "이치란 라멘 도톤보리점", "우메다 스카이빌딩 공중정원"];
        setPins((prev) =>
          prev.filter((p) => !sampleIds.includes(p.id) && !sampleNames.includes(p.name))
        );
        setShowResetModal(false);
        showToast("🧹 기본 샘플(글리코상·도톤보리 등)만 깔끔하게 제거했습니다!");
      };

      const selectedPinIndex = useMemo(
        () => pins.findIndex((p) => p.id === selectedPinId),
        [pins, selectedPinId]
      );
      const selectedPin = useMemo(
        () => (selectedPinIndex !== -1 ? pins[selectedPinIndex] : pins[0] || null),
        [pins, selectedPinIndex]
      );

      const selectedPinAvgSpend = useMemo(() => {
        if (!selectedPin) return null;
        return selectedPin.spendInfo || estimateGoogleAvgSpend(selectedPin.name, selectedPin.category);
      }, [selectedPin]);

      const prevTransitInfo = useMemo(() => {
        if (selectedPinIndex > 0) {
          return {
            from: pins[selectedPinIndex - 1],
            to: pins[selectedPinIndex],
            info: estimateTransitInfo(pins[selectedPinIndex - 1], pins[selectedPinIndex])
          };
        }
        return null;
      }, [pins, selectedPinIndex]);

      const nextTransitInfo = useMemo(() => {
        if (selectedPinIndex !== -1 && selectedPinIndex < pins.length - 1) {
          return {
            from: pins[selectedPinIndex],
            to: pins[selectedPinIndex + 1],
            info: estimateTransitInfo(pins[selectedPinIndex], pins[selectedPinIndex + 1])
          };
        }
        return null;
      }, [pins, selectedPinIndex]);

      const budgetStats = useMemo(() => {
        let totalPlannedKRW = 0;
        let totalBoughtKRW = 0;
        let totalGoogleAvgYenPerPerson = 0;

        pins.forEach((pin) => {
          const avgObj = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
          totalGoogleAvgYenPerPerson += Number(avgObj.avgYen || 0);

          pin.items.forEach((item) => {
            const krw = Number(item.price || 0);
            totalPlannedKRW += krw;
            if (item.bought) totalBoughtKRW += krw;
          });
        });

        let totalTransitMinutes = 0;
        let totalWalkMinutes = 0;
        if (pins.length >= 2) {
          for (let i = 0; i < pins.length - 1; i++) {
            const info = estimateTransitInfo(pins[i], pins[i + 1]);
            if (info) {
              totalTransitMinutes += info.transitMinutes;
              totalWalkMinutes += info.walkMinutes;
            }
          }
        }
        const totalPlannedJPY = exchangeRate > 0 ? Math.round(totalPlannedKRW / exchangeRate) : 0;

        return {
          totalPlannedKRW,
          totalPlannedJPY,
          totalBoughtKRW,
          remainingKRW: totalPlannedKRW - totalBoughtKRW,
          perPersonKRW: peopleCount > 0 ? Math.ceil(totalPlannedKRW / peopleCount) : totalPlannedKRW,
          perPersonJPY: peopleCount > 0 ? Math.ceil(totalPlannedJPY / peopleCount) : totalPlannedJPY,
          totalTransitFormatted: totalTransitMinutes > 0 ? formatMinutesToKorean(totalTransitMinutes) : "0분",
          totalWalkFormatted: totalWalkMinutes > 0 ? formatMinutesToKorean(totalWalkMinutes) : "0분",
          totalTransitMinutes,
          totalWalkMinutes,
          totalGoogleAvgYenPerPerson,
          totalGoogleAvgKRWPerPerson: Math.round(totalGoogleAvgYenPerPerson * exchangeRate)
        };
      }, [pins, peopleCount, exchangeRate]);

      // 🌍 구글 한국어 지도 타일 초기화
      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        const initCenter = pins.length > 0 ? [pins[0].lat, pins[0].lng] : [34.6674727, 135.5039453];
        const map = L.map(mapContainerRef.current, {
          zoomControl: false,
          attributionControl: false
        }).setView(initCenter, 14);

        L.tileLayer("https://mt1.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}", {
          maxZoom: 20
        }).addTo(map);

        L.control.zoom({ position: "bottomleft" }).addTo(map);
        mapInstanceRef.current = map;
      }, []);

      const clearActiveAnimationLayers = () => {
        const map = mapInstanceRef.current;
        if (!map) return;
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        if (travelerMarkerRef.current) {
          map.removeLayer(travelerMarkerRef.current);
          travelerMarkerRef.current = null;
        }
        if (activeSegmentLineRef.current) {
          map.removeLayer(activeSegmentLineRef.current);
          activeSegmentLineRef.current = null;
        }
      };

      // 📍 지도 위 마커 + 도보/대중교통 2가지 시간 동시 표시 배지
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        markersRef.current.forEach((m) => map.removeLayer(m));
        markersRef.current = [];
        polylinesRef.current.forEach((l) => map.removeLayer(l));
        polylinesRef.current = [];

        if (pins.length === 0) {
          clearActiveAnimationLayers();
          return;
        }

        for (let i = 0; i < pins.length - 1; i++) {
          const pinA = pins[i];
          const pinB = pins[i + 1];
          const transit = estimateTransitInfo(pinA, pinB);

          const segmentLine = L.polyline(
            [
              [pinA.lat, pinA.lng],
              [pinB.lat, pinB.lng]
            ],
            {
              color: pinA.completed && pinB.completed ? "#10b981" : "#6366f1",
              weight: 5,
              opacity: 0.85,
              dashArray: pinA.completed && pinB.completed ? null : "8, 8"
            }
          ).addTo(map);

          if (transit) {
            segmentLine.bindTooltip(
              `${i + 1}→${i + 2}: 🚇${transit.transitFormatted} / 🚶${transit.walkFormatted}`,
              {
                permanent: true,
                direction: "center",
                className: "route-time-badge"
              }
            );
          }
          polylinesRef.current.push(segmentLine);
        }

        pins.forEach((pin, idx) => {
          const isSelected = pin.id === selectedPin?.id;
          const bgColor = pin.completed
            ? "linear-gradient(135deg, #10b981, #059669)"
            : isSelected
            ? "linear-gradient(135deg, #6366f1, #ec4899)"
            : "linear-gradient(135deg, #2563eb, #1d4ed8)";

          const iconHtml = `
            <div class="custom-pin ${isSelected ? "pin-active" : ""}" style="background: ${bgColor}; transform: rotate(-45deg) scale(${isSelected ? 1.2 : 1});">
              <span>${pin.completed ? "✓" : idx + 1}</span>
            </div>
          `;

          const customIcon = L.divIcon({
            html: iconHtml,
            className: "",
            iconSize: [38, 38],
            iconAnchor: [19, 38],
            popupAnchor: [0, -38]
          });

          const avgSpend = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
          const nextPin = pins[idx + 1];
          const nextTransit = nextPin ? estimateTransitInfo(pin, nextPin) : null;

          const marker = L.marker([pin.lat, pin.lng], {
            icon: customIcon,
            draggable: true
          })
            .addTo(map)
            .bindPopup(
              `<div style="min-width: 210px; line-height: 1.45;">
                <div style="font-size:11px; color:#818cf8; font-weight:800;">코스 #${idx + 1} · ${pin.category}</div>
                <div style="font-size:14px; font-weight:900; margin: 2px 0 4px; color:#fff;">${pin.name}</div>
                <div style="font-size:11px; color:#34d399; font-weight:800; background:rgba(16,185,129,0.12); padding:4px 7px; border-radius:8px; margin-bottom:5px;">
                  📊 구글맵 인당 평균: ${avgSpend.label} (약 ${formatKRW(avgSpend.avgYen * exchangeRate)})
                </div>
                ${
                  nextTransit
                    ? `<div style="margin-top:5px; padding-top:5px; border-top:1px solid #334155; font-size:11px; color:#fde047; font-weight:700;">
                        다음(${nextPin.name})까지:<br/>
                        🚇 대중교통 약 ${nextTransit.transitFormatted} · 🚶 도보 약 ${nextTransit.walkFormatted}
                      </div>`
                    : ""
                }
              </div>`
            );

          marker.on("click", () => {
            setSelectedPinId(pin.id);
          });

          marker.on("dragend", (e) => {
            const newPos = e.target.getLatLng();
            setPins((prev) =>
              prev.map((p) =>
                p.id === pin.id ? { ...p, lat: newPos.lat, lng: newPos.lng } : p
              )
            );
            setSelectedPinId(pin.id);
            showToast(`📍 '${pin.name}' 위치가 이동되었습니다!`);
          });

          markersRef.current.push(marker);
        });
      }, [pins, selectedPin, exchangeRate]);

      // ⚡ 최단 경로 자동 정렬 실행
      const handleOptimizeShortestRoute = () => {
        if (pins.length < 3) {
          showToast("⚠️ 3개 이상의 장소가 있을 때 최단 경로 정렬이 가능합니다.");
          return;
        }
        const beforeKm = getTotalRouteKm(pins);
        const optimized = optimizePinsShortestRoute(pins);
        const afterKm = getTotalRouteKm(optimized);
        const savedKm = Math.max(0, beforeKm - afterKm).toFixed(1);

        setPins(optimized);
        setSelectedPinId(optimized[0].id);

        if (mapInstanceRef.current) {
          const bounds = L.latLngBounds(optimized.map((p) => [p.lat, p.lng]));
          mapInstanceRef.current.flyToBounds(bounds.pad(0.3), { duration: 0.9 });
        }

        if (Number(savedKm) > 0) {
          showToast(
            `⚡ 최단 경로 재구성 완료! #1 '${optimized[0].name}' 기준 총 이동거리가 ${savedKm}km 단축되었습니다!`
          );
        } else {
          showToast(`⚡ 현재 코스가 이미 가장 효율적인 최단 동선입니다!`);
        }
      };

      const handleApplyGoogleAvgSpend = (pin, multiplierPeople = 1) => {
        if (!pin) return;
        const avgInfo = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
        const yenAmount = Math.round(avgInfo.avgYen * multiplierPeople);
        const krwAmount = Math.round(yenAmount * exchangeRate);

        const newItem = {
          id: "item-" + Date.now(),
          title: `${avgInfo.recommendedTitle} (${multiplierPeople}인 평균)`,
          price: krwAmount,
          yen: yenAmount,
          bought: false
        };

        setPins((prev) =>
          prev.map((p) => (p.id === pin.id ? { ...p, items: [...p.items, newItem] } : p))
        );
        showToast(
          `💴 평균 지출액 ${formatJPY(yenAmount)} (${formatKRW(krwAmount)})이 예산에 추가되었습니다!`
        );
      };

      const handleFindMyLocation = () => {
        if (!navigator.geolocation) {
          showToast("브라우저가 GPS 위치 정보를 지원하지 않습니다.");
          return;
        }
        showToast("🛰️ 현재 위치를 확인 중입니다...");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const map = mapInstanceRef.current;
            if (map) {
              if (myGpsMarkerRef.current) map.removeLayer(myGpsMarkerRef.current);
              const gpsIcon = L.divIcon({
                html: `<div class="my-gps-marker">📍</div>`,
                className: "",
                iconSize: [32, 32],
                iconAnchor: [16, 16]
              });
              myGpsMarkerRef.current = L.marker([lat, lng], {
                icon: gpsIcon,
                zIndexOffset: 2000
              })
                .addTo(map)
                .bindPopup("<b>내 현재 위치</b>")
                .openPopup();
              map.flyTo([lat, lng], 16, { duration: 1.0 });
              showToast("📍 현재 위치가 지도에 표시되었습니다!");
            }
          },
          () => showToast("위치 권한을 허용해주세요."),
          { enableHighAccuracy: true, timeout: 10000 }
        );
      };

      const animateBetweenPins = (fromPin, toPin, onComplete) => {
        const map = mapInstanceRef.current;
        if (!map || !fromPin || !toPin) {
          if (onComplete) onComplete();
          return;
        }

        clearActiveAnimationLayers();
        const transit = estimateTransitInfo(fromPin, toPin);

        setAnimatingInfo({ fromPin, toPin, transit, progress: 0 });
        setLastCompletedSegment({ fromPin, toPin, transit });

        const bounds = L.latLngBounds([
          [fromPin.lat, fromPin.lng],
          [toPin.lat, toPin.lng]
        ]);
        map.flyToBounds(bounds.pad(0.45), { duration: 0.8 });

        const vehicleEmoji = transit.mode.includes("도보")
          ? "🏃"
          : transit.mode.includes("신칸센")
          ? "🚄"
          : "🚇";

        const travelerIcon = L.divIcon({
          html: `<div class="traveler-avatar">${vehicleEmoji}</div>`,
          className: "",
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });

        const travelerMarker = L.marker([fromPin.lat, fromPin.lng], {
          icon: travelerIcon,
          zIndexOffset: 1000
        }).addTo(map);
        travelerMarkerRef.current = travelerMarker;

        const activeLine = L.polyline([[fromPin.lat, fromPin.lng]], {
          color: "#ec4899",
          weight: 6,
          opacity: 0.95
        }).addTo(map);
        activeSegmentLineRef.current = activeLine;

        const durationMs = 2000;
        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const rawT = Math.min(1, elapsed / durationMs);
          const t = rawT < 0.5 ? 4 * rawT * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 3) / 2;

          const curLat = fromPin.lat + (toPin.lat - fromPin.lat) * t;
          const curLng = fromPin.lng + (toPin.lng - fromPin.lng) * t;

          travelerMarker.setLatLng([curLat, curLng]);
          activeLine.setLatLngs([
            [fromPin.lat, fromPin.lng],
            [curLat, curLng]
          ]);

          setAnimatingInfo((prev) =>
            prev ? { ...prev, progress: Math.round(rawT * 100) } : null
          );

          if (rawT < 1) {
            animFrameRef.current = requestAnimationFrame(step);
          } else {
            map.flyTo([toPin.lat, toPin.lng], 16, { duration: 0.8 });
            setTimeout(() => {
              clearActiveAnimationLayers();
              setAnimatingInfo(null);
              setSelectedPinId(toPin.id);
              const toIdx = pins.findIndex((p) => p.id === toPin.id);
              if (toIdx !== -1 && markersRef.current[toIdx]) {
                markersRef.current[toIdx].openPopup();
              }
              if (onComplete) onComplete();
            }, 800);
          }
        };

        animFrameRef.current = requestAnimationFrame(step);
      };

      const handleCompleteAndMoveNext = (pinId) => {
        const currentIndex = pins.findIndex((p) => p.id === pinId);
        if (currentIndex === -1) return;

        const currentPin = pins[currentIndex];
        const nextPin = pins[currentIndex + 1] || null;

        setPins((prev) =>
          prev.map((p) => (p.id === pinId ? { ...p, completed: true } : p))
        );

        if (nextPin) {
          const tInfo = estimateTransitInfo(currentPin, nextPin);
          showToast(
            `✅ '${currentPin.name}' 완료! 다음 '${nextPin.name}'까지 대중교통 ${tInfo.transitFormatted} / 도보 ${tInfo.walkFormatted}`
          );
          if (mobileView === "list" || mobileView === "detail") {
            setMobileView("split");
          }
          animateBetweenPins(currentPin, nextPin);
        } else {
          showToast(`🎉 모든 여행 코스를 완료했습니다!`);
        }
      };

      const handlePlayFullJourney = () => {
        if (pins.length < 2 || isJourneyPlaying) return;
        setActiveTab("itinerary");
        setMobileView("split");
        setIsJourneyPlaying(true);
        showToast("🎬 전체 이동 경로 시뮬레이션을 시작합니다!");

        let idx = 0;
        const playNext = () => {
          if (idx >= pins.length - 1) {
            setIsJourneyPlaying(false);
            showToast("✨ 전체 코스 주행이 완료되었습니다.");
            return;
          }
          animateBetweenPins(pins[idx], pins[idx + 1], () => {
            idx += 1;
            setTimeout(playNext, 450);
          });
        };
        playNext();
      };

      const handleExportJSON = () => {
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify({ tripTitle, exchangeRate, pins }, null, 2));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `${tripTitle}_plan.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("💾 여행 계획이 JSON 파일로 백업되었습니다!");
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsText(file, "UTF-8");
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed.pins) {
              setPins(parsed.pins);
              if (parsed.tripTitle) setTripTitle(parsed.tripTitle);
              if (parsed.exchangeRate) setExchangeRate(parsed.exchangeRate);
              if (parsed.pins[0]) setSelectedPinId(parsed.pins[0].id);
              showToast("📂 여행 계획을 성공적으로 불러왔습니다!");
            }
          } catch {
            showToast("⚠️ 올바른 JSON 파일이 아닙니다.");
          }
        };
      };

      // 🔍 구글 지도 링크 해독 & 다국어(한/일/영) 검색 목록
      const handleSearchPlacesAndLinks = async (e) => {
        e.preventDefault();
        const query = searchKeyword.trim();
        if (!query) return;

        setIsSearching(true);
        setSearchResults([]);
        setTranslatedInfo(null);

        try {
          const isUrl =
            query.startsWith("http://") ||
            query.startsWith("https://") ||
            query.includes("google.") ||
            query.includes("goo.gl") ||
            query.includes("/maps/");

          if (isUrl) {
            const clientParsed = parseGoogleMapsUrlClient(query);
            if (clientParsed) {
              setSearchResults([clientParsed]);
              setIsSearching(false);
              return;
            }
          }

          try {
            const apiParam = isUrl
              ? `url=${encodeURIComponent(query)}`
              : `q=${encodeURIComponent(query)}`;
            const apiRes = await fetch(`/api/resolve?${apiParam}`);
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              if (apiData.translated) setTranslatedInfo(apiData.translated);
              if (apiData.results && apiData.results.length > 0) {
                setSearchResults(apiData.results);
                setIsSearching(false);
                return;
              }
            }
          } catch (err) {}

          const translateDirect = async (text, tl) => {
            try {
              const r = await fetch(
                `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(
                  text
                )}`
              );
              const d = await r.json();
              return d?.[0]?.map((x) => x[0]).join("") || text;
            } catch {
              return text;
            }
          };

          const [jaKw, enKw] = await Promise.all([
            translateDirect(query, "ja"),
            translateDirect(query, "en")
          ]);
          setTranslatedInfo({ original: query, ja: jaKw, en: enKw });

          const extra = [];
          if (enKw.toLowerCase().startsWith("hotel ")) {
            extra.push(enKw.replace(/^hotel\s+/i, "") + " Hotel");
          }

          const keywords = Array.from(new Set([query, jaKw, enKw, ...extra].filter(Boolean)));
          const directList = [];

          await Promise.all(
            keywords.map(async (kw) => {
              try {
                const pRes = await fetch(
                  `https://photon.komoot.io/api/?q=${encodeURIComponent(kw)}&limit=6`
                );
                const pData = await pRes.json();
                if (pData?.features) {
                  pData.features.forEach((f) => {
                    const coords = f.geometry?.coordinates;
                    const props = f.properties || {};
                    if (coords && coords.length === 2) {
                      const title = props.name || props.street || kw;
                      const addr = [props.country, props.city, props.district, props.street]
                        .filter(Boolean)
                        .join(" ");
                      directList.push({
                        name: title,
                        address: addr || title,
                        lat: parseFloat(coords[1]),
                        lng: parseFloat(coords[0]),
                        spendInfo: estimateGoogleAvgSpend(title, customCategory)
                      });
                    }
                  });
                }
              } catch (e) {}

              try {
                const arcRes = await fetch(
                  `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine=${encodeURIComponent(
                    kw
                  )}&f=json&outFields=PlaceName,Place_addr,Match_addr&maxLocations=6`
                );
                const arcData = await arcRes.json();
                if (arcData?.candidates) {
                  arcData.candidates.forEach((c) => {
                    if (c.location) {
                      const title = c.attributes?.PlaceName || c.address.split(",")[0] || kw;
                      directList.push({
                        name: title,
                        address: c.attributes?.Place_addr || c.attributes?.Match_addr || c.address,
                        lat: c.location.y,
                        lng: c.location.x,
                        spendInfo: estimateGoogleAvgSpend(title, customCategory)
                      });
                    }
                  });
                }
              } catch (e) {}

              try {
                const nomRes = await fetch(
                  `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(
                    kw
                  )}&limit=5&accept-language=ko,ja,en`
                );
                const nomData = await nomRes.json();
                if (Array.isArray(nomData)) {
                  nomData.forEach((item) => {
                    const title = item.name || item.display_name.split(",")[0];
                    directList.push({
                      name: title,
                      address: item.display_name,
                      lat: parseFloat(item.lat),
                      lng: parseFloat(item.lon),
                      spendInfo: estimateGoogleAvgSpend(title, customCategory)
                    });
                  });
                }
              } catch (e) {}
            })
          );

          const unique = [];
          for (const item of directList) {
            if (
              !unique.some(
                (u) => Math.abs(u.lat - item.lat) < 0.0006 && Math.abs(u.lng - item.lng) < 0.0006
              )
            ) {
              unique.push(item);
            }
          }

          setSearchResults(unique.slice(0, 10));
        } finally {
          setIsSearching(false);
        }
      };

      const addPinToMap = ({ name, category, address, lat, lng, spendInfo }) => {
        const finalCategory = category || customCategory;
        const computedSpend = spendInfo || estimateGoogleAvgSpend(name, finalCategory);

        const newPin = {
          id: "pin-" + Date.now(),
          name,
          category: finalCategory,
          address: address || "",
          lat: Number(lat),
          lng: Number(lng),
          completed: false,
          memo: "",
          customTransitMinutes: null,
          spendInfo: computedSpend,
          items: []
        };

        setPins((prev) => [...prev, newPin]);
        setSelectedPinId(newPin.id);
        setShowAddModal(false);
        setSearchKeyword("");
        setSearchResults([]);

        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo([newPin.lat, newPin.lng], 16, { duration: 0.9 });
        }
        showToast(
          `📍 '${newPin.name}' 추가 완료! (구글맵 인당 평균 지출: ${computedSpend.label})`
        );
      };

      const handleMovePinOrder = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= pins.length) return;
        const copied = [...pins];
        const temp = copied[index];
        copied[index] = copied[targetIndex];
        copied[targetIndex] = temp;
        setPins(copied);
      };

      const handleDragStart = (index) => {
        dragItemIndexRef.current = index;
      };
      const handleDragEnter = (index) => {
        dragOverIndexRef.current = index;
      };
      const handleDragEnd = () => {
        const from = dragItemIndexRef.current;
        const to = dragOverIndexRef.current;
        if (from !== null && to !== null && from !== to) {
          const updated = [...pins];
          const [moved] = updated.splice(from, 1);
          updated.splice(to, 0, moved);
          setPins(updated);
          showToast("🔄 코스 순서가 변경되었습니다!");
        }
        dragItemIndexRef.current = null;
        dragOverIndexRef.current = null;
      };

      const handleSavePinEdit = (pinId) => {
        if (!editNameText.trim()) return;
        setPins((prev) =>
          prev.map((p) =>
            p.id === pinId
              ? {
                  ...p,
                  name: editNameText.trim(),
                  category: editCategoryText,
                  spendInfo: estimateGoogleAvgSpend(editNameText.trim(), editCategoryText)
                }
              : p
          )
        );
        setEditingPinId(null);
        showToast("✏️ 장소 정보가 수정되었습니다.");
      };

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!selectedPin || !newItemTitle.trim()) return;
        const rawAmount = parseFloat(String(newItemAmount).replace(/[^0-9.]/g, "")) || 0;
        const priceKRW =
          inputCurrency === "JPY" ? Math.round(rawAmount * exchangeRate) : Math.round(rawAmount);
        const priceJPY =
          inputCurrency === "JPY"
            ? Math.round(rawAmount)
            : Math.round(rawAmount / (exchangeRate || 9.05));

        const newItem = {
          id: "item-" + Date.now(),
          title: newItemTitle.trim(),
          price: priceKRW,
          yen: priceJPY,
          bought: false
        };

        setPins((prev) =>
          prev.map((p) =>
            p.id === selectedPin.id ? { ...p, items: [...p.items, newItem] } : p
          )
        );
        setNewItemTitle("");
        setNewItemAmount("");
      };

      const openGoogleMapsTransit = (pinA, pinB) => {
        const url = `https://www.google.com/maps/dir/?api=1&origin=${pinA.lat},${pinA.lng}&destination=${pinB.lat},${pinB.lng}&travelmode=transit`;
        window.open(url, "_blank");
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 pb-16 lg:pb-0">
          {toastMsg && (
            <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[9999] bg-indigo-600 text-white px-4 py-2.5 rounded-2xl shadow-2xl border border-indigo-400/50 font-bold text-xs sm:text-sm max-w-[92vw] text-center">
              {toastMsg}
            </div>
          )}

          {/* 상단 헤더 */}
          <header className="border-b border-slate-800 bg-slate-900/95 backdrop-blur-xl sticky top-0 z-40 px-3 sm:px-6 py-2.5">
            <div className="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg font-black text-base">
                  ✈️
                </div>
                <div>
                  <input
                    type="text"
                    value={tripTitle}
                    onChange={(e) => setTripTitle(e.target.value)}
                    className="bg-slate-800/70 hover:bg-slate-800 border border-slate-700 font-extrabold text-sm sm:text-base text-white focus:outline-none focus:border-indigo-500 rounded-xl px-2.5 py-1 w-36 sm:w-52"
                  />
                  <p className="hidden sm:block text-[11px] text-slate-400 mt-0.5">
                    🔒내 코스 영구보존 · ⚡최단동선 정렬 · 🚶도보/🚇대중교통 동시계산 · 📊구글맵 평균지출 안내
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5 sm:gap-4 bg-slate-800/90 border border-slate-700 px-3 py-1.5 rounded-2xl text-[11px] sm:text-xs">
                <div>
                  <span className="text-[10px] text-slate-400 block">완료 코스</span>
                  <span className="font-extrabold text-white">
                    {pins.filter((p) => p.completed).length}/{pins.length}곳
                  </span>
                </div>
                <div className="h-5 w-[1px] bg-slate-700" />
                <div>
                  <span className="text-[10px] text-slate-400 block">대중교통 / 도보 총합</span>
                  <span className="font-extrabold text-amber-300">
                    🚇 {budgetStats.totalTransitFormatted} <span className="text-slate-400">·</span> 🚶 {budgetStats.totalWalkFormatted}
                  </span>
                </div>
                <div className="h-5 w-[1px] bg-slate-700" />
                <div>
                  <span className="text-[10px] text-slate-400 block">내 총 예산</span>
                  <span className="font-extrabold text-emerald-400">
                    {formatKRW(budgetStats.totalPlannedKRW)}
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5 flex-wrap">
                <div className="hidden lg:flex bg-slate-800 p-1 rounded-xl items-center border border-slate-700">
                  <button
                    onClick={() => setActiveTab("itinerary")}
                    className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition ${
                      activeTab === "itinerary" ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white"
                    }`}
                  >
                    🗺️ 지도 & 코스
                  </button>
                  <button
                    onClick={() => setActiveTab("budget")}
                    className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition ${

                </div>

                <button

                <button

                <button

                </button>

                <button

                  💾 백업
                </button>

                <label className="hidden sm:inline-block px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-emerald-300 cursor-pointer">

                <button

                  ⚙️ 데이터관리
                </button>
              </div>
            </div>
          </header>

          {/* 메인 영역 */}
          <main
            className={`flex-1 max-w-[1600px] w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-3 sm:gap-4 p-2.5 sm:p-4 ${
              activeTab === "itinerary" && mobileView !== "budget" ? "block" : "hidden"

          >
            {/* 1. 지도 패널 */}
            <section
              className={`lg:col-span-5 lg:order-2 flex flex-col bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl relative ${
                mobileView === "split"
                  ? "h-[36vh] lg:h-[82vh]"
                  : mobileView === "list" || mobileView === "detail"
                  ? "hidden lg:flex lg:h-[82vh]"
                  : "h-[45vh] lg:h-[82vh]"
              }`}
            >
              <div ref={mapContainerRef} className="w-full h-full flex-1 z-10" />

              <div className="absolute top-2.5 left-2.5 right-2.5 z-20 flex items-center justify-between gap-1.5 pointer-events-none">
                <button
                  onClick={handleFindMyLocation}
                  className="bg-blue-600 hover:bg-blue-500 text-white border border-blue-400 px-2.5 py-1.5 rounded-xl shadow-xl pointer-events-auto text-[11px] font-black flex items-center gap-1"
                >
                  🛰️ 내 위치(GPS)
                </button>
                <button
                  onClick={handleOptimizeShortestRoute}
                  className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1.5 rounded-xl shadow-xl pointer-events-auto text-[11px] font-black"
                >
                  ⚡ 최단경로 재정렬
                </button>
                <button
                  onClick={() => {
                    if (mapInstanceRef.current && pins.length > 0) {
                      const bounds = L.latLngBounds(pins.map((p) => [p.lat, p.lng]));
                      mapInstanceRef.current.flyToBounds(bounds.pad(0.3), { duration: 0.8 });
                    }
                  }}
                  className="bg-slate-900/95 hover:bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-xl text-[11px] font-extrabold text-white shadow-lg pointer-events-auto"
                >
                  🔍 전체코스
                </button>
              </div>

              {(animatingInfo || lastCompletedSegment) && (
                <div className="absolute bottom-2.5 left-2.5 right-2.5 z-30 bg-slate-900/95 backdrop-blur-xl border-2 border-indigo-500 rounded-2xl p-2.5 sm:p-3.5 shadow-2xl">
                  {animatingInfo ? (
                    <>
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[11px] font-extrabold text-pink-300">
                          🚌 이동 중... ({animatingInfo.progress}%)
                        </span>
                        <span className="text-xs font-black text-amber-300">
                          🚇 {animatingInfo.transit.transitFormatted} · 🚶 {animatingInfo.transit.walkFormatted}
                        </span>
                      </div>
                      <div className="text-xs font-extrabold text-white">
                        📍 {animatingInfo.fromPin.name} ━━🚇━━▶ 🎯 {animatingInfo.toPin.name}
                      </div>
                    </>
                  ) : (
                    lastCompletedSegment && (
                      <div className="flex items-center justify-between gap-2">
                        <div>
                          <div className="text-[11px] font-bold text-emerald-300">
                            ✅ 이동 완료 구간 (대중교통 & 도보 소요시간 고정 표시)
                          </div>
                          <div className="text-xs sm:text-sm font-black text-amber-300 mt-0.5">
                            {lastCompletedSegment.fromPin.name} → {lastCompletedSegment.toPin.name} :{" "}
                            <span>🚇 {lastCompletedSegment.transit.transitFormatted}</span> /{" "}
                            <span>🚶 도보 {lastCompletedSegment.transit.walkFormatted}</span>{" "}
                            ({lastCompletedSegment.transit.distanceKm}km)
                          </div>
                        </div>
                        <button
                          onClick={() => setLastCompletedSegment(null)}
                          className="px-2 py-1 rounded-lg bg-slate-800 text-slate-400 text-[11px] font-bold"
                        >
                          ✕
                        </button>
                      </div>
                    )
                  )}
                </div>
              )}
            </section>

            {/* 2. 좌측 패널: 코스 목록 */}
            <section
              className={`lg:col-span-4 lg:order-1 flex flex-col bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl ${
                mobileView === "detail"
                  ? "hidden lg:flex lg:max-h-[82vh]"
                  : mobileView === "split"
                  ? "max-h-[44vh] lg:max-h-[82vh]"
                  : "max-h-[75vh] lg:max-h-[82vh]"
              }`}
            >
              <div className="p-3.5 border-b border-slate-800 flex items-center justify-between gap-2">
                <div>
                  <h2 className="font-extrabold text-sm text-white">
                    📍 나의 여행 코스 <span className="text-indigo-400">({pins.length}곳)</span>
                  </h2>
                  <p className="text-[11px] text-slate-400">
                    이제 코드 업데이트 시에도 내 코스가 절대 초기화되지 않습니다
                  </p>
                </div>
                <div className="flex items-center gap-1.5">
                  <button
                    onClick={handleOptimizeShortestRoute}
                    className="px-2.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow"
                  >
                    ⚡ 최단경로
                  </button>
                  <button
                    onClick={() => setShowAddModal(true)}
                    className="px-2.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs"
                  >
                    ＋ 추가
                  </button>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-3 space-y-2">
                {pins.length === 0 ? (
                  <div className="text-center py-10 px-4 space-y-3">
                    <div className="text-3xl">🗺️</div>
                    <div className="text-sm font-extrabold text-white">
                      현재 등록된 여행 코스가 없습니다.
                    </div>
                    <p className="text-xs text-slate-400">
                      글리코상·도톤보리 같은 기본 샘플이 자동으로 생기지 않도록 깔끔하게 비워두었습니다!
                    </p>
                    <div className="flex flex-wrap justify-center gap-2 pt-2">
                      <button
                        onClick={() => setShowAddModal(true)}
                        className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-extrabold text-white shadow"
                      >
                        ＋ 첫 여행 장소 검색/추가하기
                      </button>
                      <button
                        onClick={handleRecoverPreviousStorageData}
                        className="px-3.5 py-2 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-xs font-extrabold text-emerald-300"
                      >
                        🔄 이전 버전에서 입력했던 내 코스 복구하기
                      </button>
                    </div>
                  </div>
                ) : (
                  pins.map((pin, index) => {
                    const isSelected = pin.id === selectedPin?.id;
                    const pinTotalKRW = pin.items.reduce((s, i) => s + Number(i.price || 0), 0);
                    const avgSpend = pin.spendInfo || estimateGoogleAvgSpend(pin.name, pin.category);
                    const nextPin = pins[index + 1] || null;
                    const transitToNext = nextPin ? estimateTransitInfo(pin, nextPin) : null;

                    return (
                      <React.Fragment key={pin.id}>
                        <div
                          draggable
                          onDragStart={() => handleDragStart(index)}
                          onDragEnter={() => handleDragEnter(index)}
                          onDragEnd={handleDragEnd}
                          onDragOver={(e) => e.preventDefault()}
                          onClick={() => {
                            setSelectedPinId(pin.id);
                            if (mapInstanceRef.current) {
                              mapInstanceRef.current.flyTo([pin.lat, pin.lng], 16, { duration: 0.7 });
                              if (markersRef.current[index]) {
                                markersRef.current[index].openPopup();
                              }
                            }
                          }}
                          className={`p-3 rounded-2xl border transition cursor-pointer ${
                            isSelected
                              ? "bg-indigo-950/60 border-indigo-500 shadow-lg"
                              : pin.completed
                              ? "bg-slate-900/70 border-emerald-500/40"
                              : "bg-slate-800/50 border-slate-700/70"
                          }`}
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center gap-2">
                              <span
                                className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black shrink-0 ${
                                  pin.completed
                                    ? "bg-emerald-500 text-slate-950"
                                    : isSelected
                                    ? "bg-pink-500 text-white"
                                    : "bg-slate-700 text-slate-200"
                                }`}
                              >
                                {pin.completed ? "✓" : index + 1}
                              </span>
                              <div>
                                <span className="text-[10px] font-bold text-indigo-400">
                                  {pin.category}
                                </span>
                                <h3 className="font-extrabold text-sm text-white leading-tight">
                                  {pin.name}
                                </h3>

                              <button

                              >

                            className="mt-2.5 pt-2 border-t border-slate-800 flex items-center justify-between"
                            onClick={(e) => e.stopPropagation()}

                    >
                      <option>🏨 숙소·호텔</option>
                      <option>📸 명소·포토존</option>
                      <option>🍜 맛집</option>
                      <option>☕ 카페·디저트</option>
                      <option>🛍️ 쇼핑·드럭스토어</option>
                      <option>✈️ 공항·교통</option>
                    </select>
                    <div className="flex gap-1.5 flex-1">
                      <input
                        type="text"
                        value={searchKeyword}
                        onChange={(e) => setSearchKeyword(e.target.value)}
                        placeholder="구글맵 링크 붙여넣기 또는 한글/일어/영어 검색"
                        className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white"
                      />
                      <button
                        type="submit"
                        disabled={isSearching}
                        className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs shrink-0"
                      >
                        {isSearching ? "검색중..." : "🔍 검색"}
                      </button>
                    </div>
                  </div>

                  {translatedInfo && (
                    <div className="text-[11px] text-indigo-300 bg-indigo-950/40 px-3 py-1.5 rounded-xl border border-indigo-500/30">
                      🌐 자동 다국어 변환 검색됨: <b>{translatedInfo.original}</b> → 일문:{" "}
                      <b>{translatedInfo.ja}</b> / 영문: <b>{translatedInfo.en}</b>
                    </div>
                  )}
                </form>

                {searchResults.length > 0 && (
                  <div className="space-y-2 max-h-60 overflow-y-auto bg-slate-950 p-2.5 rounded-2xl border border-indigo-500/50">
                    <div className="text-xs font-extrabold text-emerald-400 px-1">
                      ✅ 검색 결과 목록 ({searchResults.length}건) — 인당 평균 지출액 자동 분석됨
                    </div>
                    {searchResults.map((res, idx) => {
                      const sp = res.spendInfo || estimateGoogleAvgSpend(res.name, customCategory);
                      return (
                        <div
                          key={idx}
                          onClick={() =>
                            addPinToMap({
                              name: res.name,
                              category: customCategory,
                              address: res.address,
                              lat: res.lat,
                              lng: res.lng,
                              spendInfo: sp
                            })
                          }
                          className="p-2.5 rounded-xl bg-slate-900 hover:bg-indigo-950/80 border border-slate-800 hover:border-indigo-500 cursor-pointer flex items-center justify-between gap-2"
                        >
                          <div>
                            <div className="text-xs sm:text-sm font-extrabold text-white">
                              {res.name}
                            </div>
                            <div className="text-[11px] text-slate-400 mt-0.5 line-clamp-1">
                              {res.address}
                            </div>
                            <div className="text-[11px] text-amber-300 font-bold mt-1">
                              📊 구글맵 인당 평균: {sp.label} (약 {formatKRW(sp.avgYen * exchangeRate)})
                            </div>
                          </div>
                          <span className="px-2.5 py-1.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black shrink-0">
                            ＋ 선택
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div>
                  <div className="text-xs font-bold text-slate-400 mb-1.5">
                    🇯🇵 자주 찾는 장소 빠른 추가 (원할 때만 클릭해서 추가하세요)
                  </div>
                  <div className="max-h-40 overflow-y-auto space-y-1.5 pr-1">
                    {PRESET_PLACES.map((p, i) => {
                      const sp = estimateGoogleAvgSpend(p.name, p.category);
                      return (
                        <div
                          key={i}
                          onClick={() => addPinToMap({ ...p, spendInfo: sp })}
                          className="p-2.5 rounded-xl bg-slate-950 hover:bg-indigo-950/50 border border-slate-800 cursor-pointer flex items-center justify-between"
                        >
                          <div>
                            <div className="text-xs font-extrabold text-white">{p.name}</div>
                            <div className="text-[10px] text-slate-400">
                              {p.category} · 인당 평균 {sp.label}
                            </div>
                          </div>
                          <span className="text-xs font-bold text-indigo-400">추가 ＋</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 데이터 복구 & 정리 모달 */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-base text-white">⚙️ 내 코스 복구 및 데이터 관리</h3>
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="text-slate-400 hover:text-white text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                <button
                  onClick={handleRecoverPreviousStorageData}
                  className="w-full p-3.5 rounded-2xl bg-emerald-600/25 hover:bg-emerald-600/35 border border-emerald-500/50 text-left"
                >
                  <div className="text-xs font-extrabold text-emerald-300">
                    🔄 이전 버전에서 입력했던 내 장소들 모두 찾아 복구하기
                  </div>
                  <p className="text-[11px] text-slate-300 mt-0.5">
                    업데이트 전 브라우저에 저장되어 있던 내 코스들을 스캔하여 되살립니다.
                  </p>
                </button>

                <button
                  onClick={handleRemoveSamplePinsOnly}
                  className="w-full p-3.5 rounded-2xl bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500/40 text-left"
                >
                  <div className="text-xs font-extrabold text-amber-300">
                    🧹 기본 샘플(글리코상·도톤보리·이치란)만 싹 지우기
                  </div>
                  <p className="text-[11px] text-slate-300 mt-0.5">
                    내가 추가한 장소는 그대로 두고, 기본 샘플 핀만 골라서 삭제합니다.
                  </p>
                </button>

                <button
                  onClick={() => {
                    setPins((prev) => prev.map((p) => ({ ...p, completed: false })));
                    setLastCompletedSegment(null);
                    setShowResetModal(false);
                    showToast("🔄 방문 완료(OK) 체크만 초기화되었습니다.");
                  }}
                  className="w-full p-3.5 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 text-left text-xs font-extrabold text-indigo-300"
                >
                  ☑️ 방문 완료(OK) 체크 상태만 초기화
                </button>

                <button
                  onClick={() => {
                    setPins([]);
                    setSelectedPinId(null);
                    setLastCompletedSegment(null);
                    setShowResetModal(false);
                    showToast("🗑️ 모든 핀이 삭제되어 빈 지도로 시작합니다.");
                  }}
                  className="w-full p-3.5 rounded-2xl bg-rose-600/20 border border-rose-500/40 text-left text-xs font-extrabold text-rose-300"
                >
                  🗑️ 모든 핀 비우기 (빈 화면으로 시작)
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
