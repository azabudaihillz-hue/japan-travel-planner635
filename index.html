    function buildLocalQueryVariants(rawQuery) {
      const q = rawQuery.trim();
      const variants = new Set([q]);

      let enVariant = q;
      let jaVariant = q;
      let changed = false;

      for (const [ko, en, ja] of KO_TO_LOCAL_DICT) {
        if (q.includes(ko)) {
          enVariant = enVariant.replaceAll(ko, " " + en + " ");
          jaVariant = jaVariant.replaceAll(ko, " " + ja + " ");
          changed = true;
        }
      }

      if (changed) {
        variants.add(enVariant.replace(/\s+/g, " ").trim());
        variants.add(jaVariant.replace(/\s+/g, " ").trim());
      }
      return Array.from(variants);
    }

    async function translateQueryToJaAndEn(query) {
      const results = [];
      try {
        const hasKorean = /[가-힣]/.test(query);
        if (!hasKorean) return results;

        const [jaRes, enRes] = await Promise.allSettled([
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=ja&dt=t&q=${encodeURIComponent(query)}`).then(r => r.json()),
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q=${encodeURIComponent(query)}`).then(r => r.json())
        ]);

        if (jaRes.status === "fulfilled" && jaRes.value?.[0]?.[0]?.[0]) {
          results.push(jaRes.value[0].map(x => x[0]).join(""));
        }
        if (enRes.status === "fulfilled" && enRes.value?.[0]?.[0]?.[0]) {
          results.push(enRes.value[0].map(x => x[0]).join(""));
        }
      } catch (err) {}
      return results;
    }

    // ============================================================================
    function extractInfoFromGoogleUrlOrHtml(rawStr) {
      if (!rawStr) return { lat: null, lng: null, name: null, placeId: null };
      let text = String(rawStr);

      let lat = null;
      let lng = null;
      let name = null;
      let placeId = null;

      // 1) URL 내 /place/이름 또는 /search/이름 추출
      const placeMatches = [...text.matchAll(/\/(?:place|search)\/([^/@?&#"'\s]+)/g)];
      if (placeMatches.length > 0) {
        for (const m of placeMatches) {
          try {
            const decoded = decodeURIComponent(m[1].replace(/\+/g, " ")).trim();
            if (decoded && !/^[-0-9.,\s]+$/.test(decoded) && !decoded.startsWith("data=")) {
              name = decoded;
              break;
            }
          } catch (e) {}
        }
      }

      // 2) HTML 내 og:title 또는 <title>에서 장소명 추출
      if (!name) {
        const ogTitleMatch = text.match(/property=["']og:title["'][^>]*content=["']([^"']+)["']/i) ||
                             text.match(/content=["']([^"']+)["'][^>]*property=["']og:title["']/i);
        if (ogTitleMatch && ogTitleMatch[1]) {
          const rawTitle = ogTitleMatch[1].split("·")[0].replace(/\s*-\s*Google\s*(Maps|지도).*/i, "").trim();
          if (rawTitle && rawTitle !== "Google Maps" && rawTitle !== "Google 지도") {
            name = rawTitle;
          }
        }
      }

      // 3) URL 쿼리 파라미터 q= 또는 query= 에서 이름 또는 좌표 추출
      const queryParamMatch = text.match(/[?&](?:q|query)=([^&#"'\s]+)/i);
      if (queryParamMatch) {
        try {
          const decodedQ = decodeURIComponent(queryParamMatch[1].replace(/\+/g, " ")).trim();
          const coordInQ = decodedQ.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
          if (coordInQ) {
            lat = parseFloat(coordInQ[1]);
            lng = parseFloat(coordInQ[2]);
          } else if (!name && decodedQ) {
            name = decodedQ;
          }
        } catch (e) {}
      }

      // 4) 가장 정확한 실제 핀 좌표: !3d(위도)!4d(경도) - 여러 개가 있을 경우 가장 마지막 항목이 실제 선택된 핀!
      const exactMatches = [...text.matchAll(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g)];
      if (exactMatches.length > 0) {
        const lastExact = exactMatches[exactMatches.length - 1];
        lat = parseFloat(lastExact[1]);
        lng = parseFloat(lastExact[2]);
      }

      // 5) HTML og:image 의 staticmap center=위도,경도 또는 markers=위도,경도 추출
      if (lat === null || lng === null) {
        const staticMapMatch = text.match(/staticmap\?[^"'\s]*?(?:center|markers)=(-?\d+\.\d+)(?:%2C|,)(-?\d+\.\d+)/i);
        if (staticMapMatch) {
          lat = parseFloat(staticMapMatch[1]);
          lng = parseFloat(staticMapMatch[2]);
        }
      }

      // 6) ll=위도,경도 또는 center=위도,경도 또는 destination=위도,경도
      if (lat === null || lng === null) {
        const llMatch = text.match(/[?&](?:ll|center|destination|daddr)=(-?\d+\.\d+)(?:%2C|,)(-?\d+\.\d+)/i);
        if (llMatch) {
          lat = parseFloat(llMatch[1]);
          lng = parseFloat(llMatch[2]);
        }
      }

      // 7) /@위도,경도 (뷰포트 중심 좌표)
      if (lat === null || lng === null) {
        const atMatch = text.match(/\/@(-?\d+\.\d+),(-?\d+\.\d+)/);
        if (atMatch) {
          lat = parseFloat(atMatch[1]);
          lng = parseFloat(atMatch[2]);
        }
      }

      // 8) APP_INITIALIZATION_STATE 내 [null,null,위도,경도] 패턴
      if (lat === null || lng === null) {
        const initMatch = text.match(/\[null,null,(-?\d+\.\d+),(-?\d+\.\d+)\]/);
        if (initMatch) {
          lat = parseFloat(initMatch[1]);
          lng = parseFloat(initMatch[2]);
        }
      }

      // 9) query_place_id 추출
      const pidMatch = text.match(/[?&](?:query_place_id|place_id)=([A-Za-z0-9_-]+)/);
      if (pidMatch) {
        placeId = pidMatch[1];
      }

      if (lat !== null && (isNaN(lat) || lat < -90 || lat > 90)) lat = null;
      if (lng !== null && (isNaN(lng) || lng < -180 || lng > 180)) lng = null;

      return { lat, lng, name, placeId };
    }

    async function resolveGoogleMapsInput(rawInput) {
      const trimmed = rawInput.trim();

      // 1) 순수 위도,경도 입력 확인 (예: "34.6687, 135.5013")
      const directCoord = trimmed.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
      if (directCoord) {
        return {
          lat: parseFloat(directCoord[1]),
          lng: parseFloat(directCoord[2]),
          name: `좌표 지정 장소 (${parseFloat(directCoord[1]).toFixed(4)}, ${parseFloat(directCoord[2]).toFixed(4)})`,
          address: `${directCoord[1]}, ${directCoord[2]}`,
          isUrl: true
        };
      }

      // 2) 입력 텍스트 안에 URL이 포함되어 있는지 확인
      const urlMatch = trimmed.match(/(https?:\/\/[^\s]+)/i);
      if (!urlMatch && !trimmed.includes("google.com/maps") && !trimmed.includes("goo.gl")) {
        return { isUrl: false };
      }

      const targetUrl = urlMatch ? urlMatch[1] : trimmed;
      const companionText = trimmed.replace(targetUrl, "").replace(/\s+/g, " ").trim();

      // 3) 먼저 긴 URL 자체에서 바로 추출 시도
      let parsed = extractInfoFromGoogleUrlOrHtml(targetUrl);
      if (companionText && !parsed.name) {
        parsed.name = companionText.split("\n")[0].trim();
      }

      // 4) 단축 URL (maps.app.goo.gl, goo.gl/maps) 이거나 아직 좌표를 못 찾은 경우 다중 프록시로 리다이렉트 추적
      const isShortUrl = /goo\.gl|maps\.app\.goo\.gl|bit\.ly/i.test(targetUrl);
      if (isShortUrl || (parsed.lat === null && parsed.lng === null)) {
        const resolvers = [
          // 0) Vercel Serverless API (/api/resolve가 배포되어 있는 경우)
          async () => {
            const res = await fetch(`/api/resolve?url=${encodeURIComponent(targetUrl)}`);
            if (!res.ok) throw new Error("local api not present");
            const data = await res.json();
            const combined = (data?.finalUrl || "") + "\n" + (data?.html || "");
            const info = extractInfoFromGoogleUrlOrHtml(combined);
            if (!info.lat && !info.name) throw new Error("no info");
            return info;
          },
          // 1) AllOrigins JSON (리다이렉트된 최종 URL과 HTML 동시 확보)
          async () => {
            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
            if (!res.ok) throw new Error("allorigins failed");
            const data = await res.json();
            const combined = (data?.status?.url || "") + "\n" + (data?.contents || "");
            const info = extractInfoFromGoogleUrlOrHtml(combined);
            if (!info.lat && !info.name) throw new Error("no info");
            return info;
          },
          // 2) Unshorten.me
          async () => {
            const res = await fetch(`https://unshorten.me/json/${encodeURIComponent(targetUrl)}`);
            if (!res.ok) throw new Error("unshorten failed");
            const data = await res.json();
            if (!data?.resolved_url) throw new Error("no resolved_url");
            const info = extractInfoFromGoogleUrlOrHtml(data.resolved_url);
            if (!info.lat && !info.name) throw new Error("no info");
            return info;
          },
          // 3) CodeTabs Proxy
          async () => {
            const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`);
            if (!res.ok) throw new Error("codetabs failed");
            const html = await res.text();
            const info = extractInfoFromGoogleUrlOrHtml(html);
            if (!info.lat && !info.name) throw new Error("no info");
            return info;
          }
        ];

        for (const resolver of resolvers) {
          try {
            const resolvedInfo = await resolver();
            if (resolvedInfo.lat !== null && resolvedInfo.lng !== null) {
              parsed.lat = resolvedInfo.lat;
              parsed.lng = resolvedInfo.lng;
            }
            if (!parsed.name && resolvedInfo.name) {
              parsed.name = resolvedInfo.name;
            }
            if (!parsed.placeId && resolvedInfo.placeId) {
              parsed.placeId = resolvedInfo.placeId;
            }
            if (parsed.lat !== null && parsed.lng !== null) break;
          } catch (e) {}
        }
      }

      return {
        isUrl: true,
        lat: parsed.lat,
        lng: parsed.lng,
        name: parsed.name || companionText || null,
        placeId: parsed.placeId || null,
        rawUrl: targetUrl
      };
    }

    // ============================================================================
    // 5. 거리 & 이동시간 계산 유틸리티
    // ============================================================================
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function formatMinutesToKorean(mins) {
      const m = Math.round(Number(mins) || 0);
      if (m <= 0) return "0분";
      const hours = Math.floor(m / 60);
      const remMins = m % 60;
      if (hours > 0 && remMins > 0) return `${hours}시간 ${remMins}분`;
      if (hours > 0) return `${hours}시간`;
      return `${remMins}분`;
    }

    function estimateTransitInfo(pinA, pinB) {
      if (!pinA || !pinB) return null;
      const distKm = getDistanceKm(pinA.lat, pinA.lng, pinB.lat, pinB.lng);

      if (pinB.customTransitMinutes && Number(pinB.customTransitMinutes) > 0) {
        const customM = Number(pinB.customTransitMinutes);
        return {
          distanceKm: distKm.toFixed(2),
          totalMinutes: customM,
          mode: "⏱️ 직접 지정",
          formatted: formatMinutesToKorean(customM),
          isCustom: true
        };
      }

      let totalMinutes = 0;
      let mode = "";
      if (distKm < 0.8) {
        totalMinutes = Math.max(3, Math.round((distKm / 4.2) * 60) + 1);
        mode = "🚶 도보 이동";
      } else if (distKm < 15) {
        totalMinutes = Math.round(((distKm * 1.3) / 24) * 60 + 7);
        mode = "🚇 지하철·전철";
      } else if (distKm < 65) {
        totalMinutes = Math.round(((distKm * 1.25) / 45) * 60 + 12);
        mode = "🚆 특급·공항철도";
      } else {
        totalMinutes = Math.round((distKm / 120) * 60 + 20);
        mode = "🚄 신칸센·고속";
      }

      return {
        distanceKm: distKm.toFixed(1),
        totalMinutes,
        mode,
        formatted: formatMinutesToKorean(totalMinutes),
        isCustom: false
      };
    }

    function formatKRW(num) {
      return Math.round(Number(num || 0)).toLocaleString("ko-KR") + "원";
    }
    function formatJPY(num) {
      return "¥" + Math.round(Number(num || 0)).toLocaleString("ja-JP");
    }

            setSelectedPinId(pin.id);
          });

          marker.addListener("dragend", async (e) => {
            const newLat = e.latLng.lat();
            const newLng = e.latLng.lng();
            const addr = await reverseGeocodeCoordinate(newLat, newLng);
            setPins(prev => prev.map(p => p.id === pin.id ? { ...p, lat: newLat, lng: newLng, address: addr } : p));
            showToast(`📍 '${pin.name}'의 위치가 드래그한 곳으로 업데이트되었습니다!`);
          });

          markersRef.current[pin.id] = marker;
        });

        if (pathCoords.length > 1) {
          const polyline = new window.google.maps.Polyline({
            path: pathCoords,
            geodesic: true,
            strokeColor: "#6366f1",
            strokeOpacity: 0.85,
            strokeWeight: 4,
            icons: [{
              icon: { path: window.google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 3.5, strokeColor: "#ffffff", fillColor: "#6366f1", fillOpacity: 1 },
              offset: "50%",
              repeat: "120px"
            }]
          });
          polyline.setMap(map);
          polylinesRef.current.push(polyline);
        }
      }, [filteredPins, selectedPinId, reverseGeocodeCoordinate, showToast]);

      // ============================================================================
      // 7. 6단계 하이브리드 초정밀 장소 검색 엔진
      // ============================================================================
      const performMultiEnginePlaceSearch = async (rawQuery) => {
        const query = rawQuery.trim();
        if (!query) return [];

        const collected = [];
        const addCandidate = (cand) => {
          if (!cand || cand.lat == null || cand.lng == null) return;
          const lat = Number(cand.lat);
          const lng = Number(cand.lng);
          if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

          const isDup = collected.some(existing => {
            const dist = getDistanceKm(existing.lat, existing.lng, lat, lng);
            return dist < 0.06;
          });
          if (!isDup) {
            const detectedCat = cand.category || detectCategoryFromText(cand.name + " " + (cand.address || ""), cand.types || []);
            collected.push({
              name: cand.name || query,
              address: cand.address || "",
              lat,
              lng,
              category: detectedCat || null,
              source: cand.source || "검색"
            });
          }
        };

        const qLower = query.toLowerCase().replace(/\s+/g, "");

        // [Engine 1] 내장 검증된 인기 여행지 DB 매칭
        CURATED_PLACES_DB.forEach(item => {
          const nameNorm = item.name.toLowerCase().replace(/\s+/g, "");
          const hitAlias = item.aliases.some(a => {
            const aNorm = a.toLowerCase().replace(/\s+/g, "");
            return aNorm.includes(qLower) || qLower.includes(aNorm);
          });
          if (nameNorm.includes(qLower) || qLower.includes(nameNorm) || hitAlias) {
            addCandidate({
              name: item.name,
              address: item.address,
              lat: item.lat,
              lng: item.lng,
              category: item.category,
              source: "⭐ 인기 여행지 DB"
            });
          }
        });

        // [Engine 2] 한국어 -> 일본어/영어 번역 및 로컬 변형어 생성
        const localVariants = buildLocalQueryVariants(query);
        const translatedVariants = await translateQueryToJaAndEn(query);
        const allSearchQueries = Array.from(new Set([query, ...translatedVariants, ...localVariants])).slice(0, 4);

        // [Engine 3] Google Maps PlacesService & Geocoder
        const googlePromises = [];
        if (window.google?.maps?.places && mapInstanceRef.current) {
          googlePromises.push(new Promise((resolve) => {
            const service = new window.google.maps.places.PlacesService(mapInstanceRef.current);
            service.textSearch({ query: query, language: "ko" }, (results, status) => {
              if (status === window.google.maps.places.PlacesServiceStatus.OK && results) {
                results.slice(0, 5).forEach(r => {
                  if (r.geometry?.location) {
                    addCandidate({
                      name: r.name,
                      address: r.formatted_address || "",
                      lat: r.geometry.location.lat(),
                      lng: r.geometry.location.lng(),
                      types: r.types || [],
                      source: "Google Places"
                    });
                  }
                });
              }
              resolve();
            });
          }));
        }

        if (window.google?.maps?.Geocoder) {
          for (const qVar of allSearchQueries.slice(0, 2)) {
            googlePromises.push(new Promise((resolve) => {
              const geocoder = new window.google.maps.Geocoder();
              geocoder.geocode({ address: qVar, language: "ko" }, (results, status) => {
                if (status === "OK" && results) {
                  results.slice(0, 3).forEach(r => {
                    if (r.geometry?.location) {
                      const cleanName = r.address_components?.[0]?.long_name || qVar;
                      addCandidate({
                        name: cleanName.length > 2 ? cleanName : query,
                        address: r.formatted_address || "",
                        lat: r.geometry.location.lat(),
                        lng: r.geometry.location.lng(),
                        types: r.types || [],
                        source: "Google Geocoder"
                      });
                    }
                  });
                }
                resolve();
              });
            }));
          }
        }

        // [Engine 4] OpenStreetMap Nominatim 다중 언어 검색
        const nominatimPromises = allSearchQueries.map(async (qVar) => {
          try {
            const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(qVar)}&addressdetails=1&limit=5&accept-language=ko,ja,en`;
            const res = await fetch(url);
            if (!res.ok) return;
            const data = await res.json();
            if (Array.isArray(data)) {
              data.forEach(item => {
                const displayNameParts = (item.display_name || "").split(",");
                const primaryName = item.name || displayNameParts[0] || query;
                addCandidate({
                  name: primaryName,
                  address: item.display_name || "",
                  lat: parseFloat(item.lat),
                  lng: parseFloat(item.lon),
                  types: [item.category, item.type],
                  source: "OSM 정밀지도"
                });
              });
            }
          } catch (e) {}
        });

        // [Engine 5] Komoot Photon 지오코더
        const photonPromises = allSearchQueries.slice(0, 2).map(async (qVar) => {
          try {
            const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(qVar)}&limit=5`;
            const res = await fetch(url);
            if (!res.ok) return;
            const data = await res.json();
            if (data && Array.isArray(data.features)) {
              data.features.forEach(f => {
                const coords = f.geometry?.coordinates;
                const props = f.properties || {};
                if (coords && coords.length >= 2) {
                  const addrParts = [props.country, props.state, props.city, props.district, props.street, props.housenumber].filter(Boolean);
                  addCandidate({
                    name: props.name || query,
                    address: addrParts.join(" ") || props.name || "",
                    lat: Number(coords[1]),
                    lng: Number(coords[0]),
                    types: [props.osm_key, props.osm_value],
                    source: "Photon POI"
                  });
                }
              });
            }
          } catch (e) {}
        });

        // [Engine 6] 위키피디아 위치백과 검색
        const wikiPromise = (async () => {
          try {
            const wikiUrl = `https://ko.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=3&prop=coordinates|description&format=json&origin=*`;
            const res = await fetch(wikiUrl);
            if (!res.ok) return;
            const data = await res.json();
            const pages = data?.query?.pages;
            if (pages) {
              Object.values(pages).forEach(p => {
                if (p.coordinates && p.coordinates[0]) {
                  addCandidate({
                    name: p.title,
                    address: p.description || "위키백과 인증 위치",
                    lat: p.coordinates[0].lat,
                    lng: p.coordinates[0].lon,
                    source: "Wikipedia 좌표"
                  });
                }
              });
            }
          } catch (e) {}
        })();

        await Promise.allSettled([
          ...googlePromises,
          ...nominatimPromises,
          ...photonPromises,
          wikiPromise
        ]);

        return collected.slice(0, 10);
      };

      const handleSmartSearch = async (e) => {
        if (e) e.preventDefault();
        const query = searchKeyword.trim();
        if (!query) return;

        setIsSearching(true);
        setSearchResults([]);
        setSearchStatusMsg("🔍 구글 링크 해독 및 다중 위치 검색 엔진 가동 중...");

        try {
          const urlInfo = await resolveGoogleMapsInput(query);

          if (urlInfo.isUrl) {
            if (urlInfo.lat !== null && urlInfo.lng !== null) {
              let finalName = urlInfo.name;
              let finalAddress = "구글 지도 링크에서 추출한 정확한 위치";

              const revAddr = await reverseGeocodeCoordinate(urlInfo.lat, urlInfo.lng);
              if (revAddr) finalAddress = revAddr;
              if (!finalName || finalName === "구글 지도 공유 장소") {
                finalName = revAddr ? revAddr.split(",")[0] : "구글 지도 핀 장소";
              }

              const autoCat = !isCategoryLockedByUser
                ? (detectCategoryFromText(finalName + " " + finalAddress) || customCategory)
                : customCategory;

              addPinToMap({
                name: finalName,
                category: autoCat,
                address: finalAddress,
                lat: urlInfo.lat,
                lng: urlInfo.lng,
                day: newPinDay
              });
              showToast(`✅ 구글 링크에서 '${finalName}' (${autoCat}) 위치를 정확히 꽂았습니다!`);
              setIsSearching(false);
              setSearchStatusMsg("");
              return;
            }

            if (urlInfo.name) {
              setSearchStatusMsg(`🔗 링크에서 '${urlInfo.name}' 이름을 확인하여 좌표를 찾는 중...`);
              const resultsFromLinkName = await performMultiEnginePlaceSearch(urlInfo.name);
              if (resultsFromLinkName.length > 0) {
                setSearchResults(resultsFromLinkName);
                setSearchStatusMsg(`✅ 링크 장소 '${urlInfo.name}'의 검색 결과입니다. 원하는 위치를 클릭해 추가하세요!`);
                setIsSearching(false);
                return;
              }
            }

            setSearchStatusMsg("⚠️ 단축 링크(maps.app.goo.gl)는 구글 보안 정책상 장소 이름이나 긴 주소창 링크로 넣으면 100% 정확히 검색됩니다. 아래 '새 탭에서 링크 열기' 후 열린 페이지의 주소창이나 장소명을 복사해 보세요!");
            setIsSearching(false);
            return;
          }

          const results = await performMultiEnginePlaceSearch(query);
          if (results.length > 0) {
            setSearchResults(results);
            if (!isCategoryLockedByUser && results[0].category) {
              setCustomCategory(results[0].category);
            }
            setSearchStatusMsg(`✅ 총 ${results.length}개의 정확한 위치를 찾았습니다. 클릭하면 즉시 지도에 추가됩니다!`);
          } else {
            setSearchStatusMsg("❗ 일치하는 검색 결과를 찾지 못했습니다. 오타를 확인하시거나 아래 '현재 지도 중앙에 수동으로 핀 만들기'를 이용해 주세요.");
          }
        } catch (err) {
          setSearchStatusMsg("⚠️ 검색 중 일시적인 오류가 발생했습니다. 다시 시도해 주세요.");
        } finally {
          setIsSearching(false);
        }
      };

      const handlePreviewSearchResult = (res) => {
        if (!mapInstanceRef.current || !window.google?.maps) return;
        const map = mapInstanceRef.current;
        const pos = { lat: Number(res.lat), lng: Number(res.lng) };
        map.panTo(pos);
        map.setZoom(17);

        if (previewMarkerRef.current) {
          previewMarkerRef.current.setMap(null);
        }
        previewMarkerRef.current = new window.google.maps.Marker({
          position: pos,
          map: map,
          title: `[미리보기] ${res.name}`,
          animation: window.google.maps.Animation.DROP,
          icon: {
            path: window.google.maps.SymbolPath.CIRCLE,
            fillColor: "#f59e0b",
            fillOpacity: 0.9,
            strokeWeight: 3,
            strokeColor: "#ffffff",
            scale: 15
          }
        });
      };

      const addPinToMap = ({ name, category, address, lat, lng, day }) => {
        if (previewMarkerRef.current) {
          previewMarkerRef.current.setMap(null);
          previewMarkerRef.current = null;
        }

        const resolvedCategory = category || customCategory || "📸 명소·포토존";
        const newPin = {
          id: "pin-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
          name: name || "새 장소",
          category: resolvedCategory,
          day: Number(day || newPinDay || 1),
          address: address || "",
          lat: Number(lat),
          lng: Number(lng),
          completed: false,
          memo: "",
          customTransitMinutes: null,
          items: []
        };

        setPins((prev) => [...prev, newPin]);
        setSelectedPinId(newPin.id);
        setShowAddModal(false);
        setSearchKeyword("");
        setSearchResults([]);
        setSearchStatusMsg("");
        setIsCategoryLockedByUser(false);

        if (mapInstanceRef.current) {
          mapInstanceRef.current.panTo({ lat: newPin.lat, lng: newPin.lng });
          mapInstanceRef.current.setZoom(16);
        }
      };

      const handleManualCenterPinAdd = () => {
        const query = searchKeyword.trim() || "직접 지정한 장소";
        const centerObj = mapInstanceRef.current ? mapInstanceRef.current.getCenter() : null;
        const lat = centerObj && typeof centerObj.lat === "function" ? centerObj.lat() : 34.6687;
        const lng = centerObj && typeof centerObj.lng === "function" ? centerObj.lng() : 135.5013;

        addPinToMap({
          name: query,
          category: customCategory,
          address: "지도 위 핀을 드래그해서 정확한 위치로 옮겨주세요",
          lat,
          lng,
          day: newPinDay
        });
        showToast(`📍 현재 지도 중앙에 '${query}' 핀을 생성했습니다. 핀을 드래그해 위치를 조절하세요!`);
      };

      const handleDragStart = (e, index) => { dragItemRef.current = index; };
      const handleDragEnter = (e, index) => { dragOverItemRef.current = index; };
      const handleDragEnd = () => {
        if (
          dragItemRef.current !== null &&
          dragOverItemRef.current !== null &&
          dragItemRef.current !== dragOverItemRef.current
        ) {
          const sourcePin = filteredPins[dragItemRef.current];
          const targetPin = filteredPins[dragOverItemRef.current];
          if (sourcePin && targetPin) {
            const fullCopy = [...pins];
            const fromIdx = fullCopy.findIndex(p => p.id === sourcePin.id);
            const toIdx = fullCopy.findIndex(p => p.id === targetPin.id);
            if (fromIdx !== -1 && toIdx !== -1) {
              const [moved] = fullCopy.splice(fromIdx, 1);
              fullCopy.splice(toIdx, 0, moved);
              setPins(fullCopy);
              showToast("🔄 여정 순서가 변경되었습니다.");
            }
          }
        }
        dragItemRef.current = null;
        dragOverItemRef.current = null;
      };

      const movePinOrder = (pinId, direction) => {
        const idx = pins.findIndex(p => p.id === pinId);
        if (idx === -1) return;
        const targetIdx = idx + direction;
        if (targetIdx < 0 || targetIdx >= pins.length) return;
        const copy = [...pins];
        const temp = copy[idx];
        copy[idx] = copy[targetIdx];
        copy[targetIdx] = temp;
        setPins(copy);
      };

      const savePinName = (id) => {
        if (!editNameText.trim()) return;
        setPins(prev => prev.map(p => p.id === id ? { ...p, name: editNameText.trim() } : p));
        setEditingPinId(null);
        showToast("✏️ 장소 이름이 변경되었습니다.");
      };

      const savePinCoords = (id) => {
        const lat = parseFloat(editLatText);
        const lng = parseFloat(editLngText);
        if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
          showToast("⚠️ 올바른 위도(-90~90)와 경도(-180~180) 숫자를 입력해 주세요.");
          return;
        }
        setPins(prev => prev.map(p => p.id === id ? { ...p, lat, lng } : p));
        setEditingCoordPinId(null);
        if (mapInstanceRef.current) {
          mapInstanceRef.current.panTo({ lat, lng });
          mapInstanceRef.current.setZoom(17);
        }
        showToast("📍 좌표가 정확히 수정되었습니다.");
      };

      const updatePinCategory = (pinId, newCat) => {
        setPins(prev => prev.map(p => p.id === pinId ? { ...p, category: newCat } : p));
        setQuickCatPinId(null);
        showToast(`🏷️ 카테고리가 '${newCat}'(으)로 변경되었습니다.`);
      };

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!selectedPin || !newItemTitle.trim()) return;
        const rawAmount = parseFloat(String(newItemAmount).replace(/[^0-9.]/g, "")) || 0;
        const priceKRW = inputCurrency === "JPY" ? Math.round(rawAmount * exchangeRate) : Math.round(rawAmount);
        const priceJPY = inputCurrency === "JPY" ? Math.round(rawAmount) : Math.round(rawAmount / (exchangeRate || 9.05));

        const newItem = {
          id: "item-" + Date.now(),
          title: newItemTitle.trim(),
          price: priceKRW,
          yen: priceJPY,
          bought: false
        };
        setPins((prev) => prev.map((p) => p.id === selectedPin.id ? { ...p, items: [...(p.items || []), newItem] } : p));
        setNewItemTitle("");
        setNewItemAmount("");
      };

      const handleCompleteAndMoveNext = (pinId) => {
        const currentIndex = filteredPins.findIndex((p) => p.id === pinId);
        if (currentIndex === -1) return;
        setPins((prev) => prev.map((p) => (p.id === pinId ? { ...p, completed: true } : p)));
        const nextPin = filteredPins[currentIndex + 1] || null;
        if (nextPin) {
          setSelectedPinId(nextPin.id);
          if (mapInstanceRef.current) {
            mapInstanceRef.current.panTo({ lat: nextPin.lat, lng: nextPin.lng });
          }
          showToast(`✅ 완료! 다음 코스 '${nextPin.name}'(으)로 이동합니다.`);
        } else {
          showToast("🎉 모든 여정 코스를 완료했습니다!");
        }
      };

      const handleCopySummaryToClipboard = () => {
        const lines = [`✈️ [${tripTitle}] 여행 일정 & 예산 요약\n`];
        pins.forEach((p, i) => {
          const pinSum = (p.items || []).reduce((s, it) => s + Number(it.price || 0), 0);
          lines.push(`${i + 1}. [${p.day || 1}일차 | ${p.category}] ${p.name}${pinSum > 0 ? ` (${formatKRW(pinSum)})` : ""}`);
          if (p.memo) lines.push(`   📝 메모: ${p.memo}`);
        });
        lines.push(`\n💰 총 예산: ${formatKRW(budgetStats.totalPlannedKRW)} (${formatJPY(budgetStats.totalPlannedJPY)})`);
        lines.push(`👥 1인당(${peopleCount}명): ${formatKRW(budgetStats.perPersonKRW)} (${formatJPY(budgetStats.perPersonJPY)})`);

        navigator.clipboard?.writeText(lines.join("\n"));
        showToast("📋 카카오톡 공유용 여행 요약이 클립보드에 복사되었습니다!");
      };

      const handleFitAllPinsOnMap = () => {
        if (!mapInstanceRef.current || !window.google?.maps || filteredPins.length === 0) return;
        if (filteredPins.length === 1) {
          mapInstanceRef.current.panTo({ lat: filteredPins[0].lat, lng: filteredPins[0].lng });
          mapInstanceRef.current.setZoom(16);
          return;
        }
        const bounds = new window.google.maps.LatLngBounds();
        filteredPins.forEach(p => bounds.extend({ lat: Number(p.lat), lng: Number(p.lng) }));
        mapInstanceRef.current.fitBounds(bounds, 60);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] bg-indigo-600 text-white px-5 py-3 rounded-2xl shadow-2xl border border-indigo-400/60 font-bold text-xs sm:text-sm flex items-center gap-2 max-w-[92vw]">
              <span>{toastMsg}</span>
            </div>
          )}

          <header className="border-b border-slate-800 bg-slate-900/95 backdrop-blur-xl sticky top-0 z-40 px-4 lg:px-8 py-3">
            <div className="max-w-[1650px] mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg font-black text-lg">
                  ✈️
                </div>
                <div>
                  <input
                    type="text"
                    value={tripTitle}
                    onChange={(e) => setTripTitle(e.target.value)}
                    className="bg-slate-800/70 hover:bg-slate-800 border border-slate-700/80 font-extrabold text-base sm:text-lg text-white focus:outline-none focus:border-indigo-500 rounded-xl px-3 py-1"
                  />
                  <p className="text-[11px] text-slate-400 mt-0.5">
                    6중 정밀 검색 엔진 · 구글 단축링크 해독 · 카테고리 자유 설정 · 예산 정산
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <div className="bg-slate-800 p-1 rounded-xl flex items-center border border-slate-700">
                  <button
                    onClick={() => setActiveTab("itinerary")}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition ${
                      activeTab === "itinerary"
                        ? "bg-indigo-600 text-white shadow"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    🗺️ 지도 & 코스 ({pins.length})
                  </button>
                  <button
                    onClick={() => setActiveTab("budget")}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition ${
                      activeTab === "budget"
                        ? "bg-emerald-600 text-white shadow"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    💰 예산 · 정산 ({formatKRW(budgetStats.totalPlannedKRW)})
                  </button>
                </div>

                <button

                      setShowResetModal(false);
                      showToast("🗑️ 모든 일정이 깨끗하게 비워졌습니다.");
                    }}
                    className="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-extrabold text-xs"
                  >
                    🗑️ 모든 장소 완전히 비우기 (백지상태에서 시작)
                  </button>
                  <button
                    onClick={() => {
                      setPins(DEFAULT_SAMPLE_PINS);
                      setSelectedPinId(DEFAULT_SAMPLE_PINS[0]?.id || null);
                      setShowResetModal(false);
                      showToast("🔄 기본 샘플 일정으로 초기화되었습니다.");
                    }}
                    className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs"
                  >
                    📍 기본 샘플(도톤보리) 상태로 초기화
                  </button>
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs"
                  >
                    취소
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
