<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>여행 계획 | 스마트 여행 플래너</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PWA & Mobile Web App Settings -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="여행 플래너" />

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    /* ===== Apple Liquid Glass Design System ===== */
    :root {
      --bg-surface: #EEF1F6;
      --bg-mesh: radial-gradient(120% 80% at 50% -10%, rgba(219, 234, 254, 0.7) 0%, rgba(238, 242, 246, 0.85) 45%, #F8FAFC 100%);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-bg-subtle: rgba(255, 255, 255, 0.45);
      --glass-bg-elevated: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-border-strong: rgba(255, 255, 255, 0.85);
      --glass-shadow:
        0 1px 0 rgba(255, 255, 255, 0.85) inset,
        0 8px 32px rgba(15, 23, 42, 0.07),
        0 2px 8px rgba(15, 23, 42, 0.03);
      --glass-shadow-elevated:
        0 1px 0 rgba(255, 255, 255, 0.95) inset,
        0 20px 48px rgba(15, 23, 42, 0.09),
        0 4px 16px rgba(15, 23, 42, 0.04);
      --text-primary: #0B0F1A;
      --text-secondary: #5C6578;
      --text-tertiary: #8B93A7;
      --accent: #4F46E5;
      --accent-glow: rgba(79, 70, 229, 0.25);
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard Variable", Pretendard, system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease;
      letter-spacing: -0.018em;
      background: var(--bg-surface);
      background-image: var(--bg-mesh);
      background-attachment: fixed;
      color: var(--text-primary);
    }
    .theme-light body,
    body.theme-light {
      background: var(--bg-surface);
      background-image: var(--bg-mesh);
      color: var(--text-primary);
    }

    button {
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea, select {
      -webkit-appearance: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(79, 70, 229, 0.35); border-radius: 9999px; }

    /* 💎 Apple Liquid Glass Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 22px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 💎 Fixed Top Glass Header */
    .glass-header {
      background: rgba(255, 255, 255, 0.72) !important;
      backdrop-filter: blur(32px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(32px) saturate(180%) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.75) !important;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.04);
    }

    /* 💎 iOS Segmented Control Track & Item */
    .segmented-track {
      background: rgba(142, 142, 147, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 3px;
      border-radius: 16px;
      display: flex;
      gap: 3px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .segmented-item {
      flex: 1;
      padding: 8px 14px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .segmented-item-active {
      background: #ffffff !important;
      color: var(--text-primary) !important;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    /* 💎 Day & Filter Chips */
    .day-chip {
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .day-chip-active {
      background: #ffffff !important;
      color: var(--accent) !important;
      box-shadow: 0 3px 12px rgba(79, 70, 229, 0.16), 0 1px 0 rgba(255, 255, 255, 0.9) inset !important;
      border-color: rgba(79, 70, 229, 0.25) !important;
      font-weight: 800;
    }
    .day-chip-idle {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.65);
    }
    .day-chip-idle:hover {
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.85);
    }

    /* 💎 Course Cards */
    .pin-card {
      padding: 16px 18px;
      border-radius: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .pin-card:hover {
      box-shadow: var(--glass-shadow-elevated);
      border-color: rgba(255, 255, 255, 0.85);
    }
    .pin-card.pin-selected {
      border-color: rgba(79, 70, 229, 0.4);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 8px 30px rgba(79, 70, 229, 0.14);
    }
    .pin-card.pin-selected::before {
      content: "";
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: 0;
      width: 3.5px;
      background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .pin-drag-over {
      border-top: 3px solid var(--accent) !important;
      background: rgba(79, 70, 229, 0.08) !important;
    }
    .pin-title {
      color: var(--text-primary);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      line-height: 1.35;
    }
    .pin-meta {
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    /* 💎 Map Glass Frame & Floating Overlay Controls */
    .map-glass-frame {
      border-radius: 22px;
      overflow: hidden;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 12px 36px rgba(15, 23, 42, 0.07);
      position: relative;
    }
    .glass-pill-btn {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .glass-pill-btn:hover {
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
      transform: translateY(-1px);
    }
    .glass-pill-btn:active {
      transform: scale(0.97);
    }

    /* 이동시간 뱃지 — Apple Liquid Glass */
    .theme-light .route-time-badge,
    .route-time-badge {
      background: rgba(255, 255, 255, 0.92) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      color: #1e40af !important;
      border: 1px solid rgba(255, 255, 255, 0.95) !important;
      border-radius: 9999px !important;
      padding: 4px 12px !important;
      font-weight: 700 !important;
      font-size: 11px !important;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08) !important;
      white-space: nowrap !important;
    }

    /* 💎 Budget Metric Cards & Progress Gauge */
    .metric-card {
      padding: 18px 20px;
      border-radius: 22px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .metric-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .metric-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-top: 6px;
    }
    .metric-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      margin-top: 4px;
    }
    .budget-progress-track {
      height: 8px;
      border-radius: 9999px;
      background: rgba(142, 142, 147, 0.16);
      overflow: hidden;
    }
    .budget-progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #4F46E5, #6366F1);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 💎 Modal Overlay & Panels */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-panel {
      width: 100%;
      max-width: 28rem;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(36px) saturate(190%);
      -webkit-backdrop-filter: blur(36px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 1) inset,
        0 24px 60px rgba(15, 23, 42, 0.12),
        0 4px 16px rgba(15, 23, 42, 0.04);
      padding: 24px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .modal-input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      outline: none;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04) inset;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-input:focus {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .modal-input::placeholder {
      color: var(--text-tertiary);
      font-weight: 400;
    }

    /* 💎 Buttons */
    .btn-primary {
      border-radius: 14px;
      background: var(--accent);
      color: #fff !important;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 18px;
      min-height: 42px;
      border: none;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28), 0 1px 0 rgba(255, 255, 255, 0.2) inset;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-primary:hover {
      filter: brightness(1.05);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-ghost {
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.9);
    }
    .btn-ghost:active {
      transform: scale(0.98);
    }
    .btn-danger {
      border-radius: 14px;
      background: var(--danger);
      color: #fff !important;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 16px;
      min-height: 42px;
      border: none;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.28), 0 1px 0 rgba(255, 255, 255, 0.2) inset;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-danger:hover {
      filter: brightness(1.05);
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35);
    }
    .btn-danger:active {
      transform: scale(0.98);
    }

    /* 💎 Mobile Bottom Tab Bar */
    .bottom-tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      gap: 6px;
      padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.04);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 6px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .tab-item-active {
      background: #ffffff !important;
      color: var(--accent) !important;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    /* 💎 Entry Screen */
    .entry-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse 90% 60% at 50% -5%, rgba(199, 210, 254, 0.65), transparent 70%),
        radial-gradient(ellipse 70% 50% at 85% 90%, rgba(224, 231, 255, 0.5), transparent 70%),
        #EEF1F6;
    }
    .entry-card {
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(36px) saturate(180%);
      -webkit-backdrop-filter: blur(36px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95) inset,
        0 24px 56px rgba(15, 23, 42, 0.08),
        0 4px 16px rgba(15, 23, 42, 0.03);
      padding: 36px 28px 28px;
    }
    .entry-tile-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 1) inset,
        0 8px 24px rgba(79, 70, 229, 0.12),
        0 2px 6px rgba(15, 23, 42, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--accent);
    }
    .entry-title {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .entry-sub {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .entry-error {
      border-radius: 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 12px;
      font-weight: 700;
      padding: 11px 14px;
      margin-bottom: 12px;
    }
    .entry-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 600;
      margin-top: 16px;
    }

    /* 💎 Toast Pill */
    .toast-pill {
      position: fixed;
      left: 50%;
      bottom: calc(72px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 60;
      max-width: min(90vw, 360px);
      padding: 12px 20px;
      border-radius: 9999px;
      background: rgba(11, 15, 26, 0.92);
      color: #fff !important;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      text-align: center;
      pointer-events: none;
    }
    .confirm-panel {
      text-align: center;
    }
    .confirm-panel .modal-title {
      margin-bottom: 8px;
    }
    .confirm-desc {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ☀️ Light theme override */
    .theme-light {
      background-color: var(--bg-surface) !important;
      color: var(--text-primary) !important;
    }
    .theme-light [class*="bg-slate-950"],
    .theme-light [class*="bg-slate-900"],
    .theme-light [class*="bg-slate-800"] {
      background-color: rgba(255, 255, 255, 0.8) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .theme-light [class*="border-slate-800"],
    .theme-light [class*="border-slate-700"] {
      border-color: rgba(226, 232, 240, 0.8) !important;
    }
    .theme-light .text-white,
    .theme-light .text-slate-100,
    .theme-light .text-slate-200 { color: var(--text-primary) !important; }
    .theme-light .text-slate-300,
    .theme-light .text-slate-400 { color: var(--text-secondary) !important; }
    .theme-light .text-amber-300 { color: #d97706 !important; }
    .theme-light .text-emerald-400,
    .theme-light .text-emerald-300 { color: #059669 !important; }
    .theme-light .text-indigo-400,
    .theme-light .text-indigo-300 { color: #4f46e5 !important; }
    .theme-light .keep-white { color: #ffffff !important; }

    /* Map pins & leaflet */
    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
      border: 2.5px solid #ffffff;
      transition: transform 0.2s ease;
      cursor: grab;
    }
    .custom-pin:active { cursor: grabbing; }
    .custom-pin span {
      transform: rotate(45deg);
      font-weight: 900;
      font-size: 13px;
      color: #ffffff !important;
    }
    .traveler-avatar {

    function escapeHtml(raw) {
      if (raw === null || raw === undefined) return "";
      return String(raw)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function formatMinutesToKorean(mins) {
      const m = Math.round(Number(mins) || 0);
      if (m <= 0) return "1분";
      const hours = Math.floor(m / 60);
      const remMins = m % 60;
      if (hours > 0 && remMins > 0) return `${hours}시간 ${remMins}분`;
      if (hours > 0) return `${hours}시간`;
      return `${remMins}분`;
    }

    function estimateTransitInfo(pinA, pinB) {
      if (!pinA || !pinB) return null;
      const straightKm = getDistanceKm(pinA.lat, pinA.lng, pinB.lat, pinB.lng);

      const walkRoadKm = straightKm * 1.28;
      const walkMinutes = Math.max(2, Math.round((walkRoadKm / 4.5) * 60));
      const walkFormatted = formatMinutesToKorean(walkMinutes);

      let transitMinutes = 0;
      let transitMode = "";

      if (pinB.customTransitMinutes && Number(pinB.customTransitMinutes) > 0) {
        transitMinutes = Number(pinB.customTransitMinutes);
        transitMode = "🚇 대중교통(직접지정)";
      } else if (straightKm < 0.55) {
        transitMinutes = walkMinutes;
        transitMode = "🚶 도보권";
      } else if (straightKm < 15) {
        transitMinutes = Math.round(((straightKm * 1.25) / 24) * 60 + 7);
        transitMode = "🚇 지하철·시내버스";
      } else if (straightKm < 65) {
        transitMinutes = Math.round(((straightKm * 1.2) / 45) * 60 + 12);
        transitMode = "🚆 급행전철·공항특급";
      } else {
        transitMinutes = Math.round((straightKm / 120) * 60 + 22);
        transitMode = "🚄 신칸센·특급열차";
      }

      const transitFormatted = formatMinutesToKorean(transitMinutes);

      return {
        distanceKm: straightKm.toFixed(1),
        walkMinutes,
        walkFormatted,
        transitMinutes,
        transitFormatted,
        totalMinutes: transitMinutes,
        formatted: transitFormatted,
        mode: transitMode
      };
    }

    function optimizePinsShortestRoute(pinList) {
      if (!pinList || pinList.length <= 2) return pinList;

      const startPin = pinList[0];
      const remaining = pinList.slice(1);
      const ordered = [startPin];

      while (remaining.length > 0) {
        const current = ordered[ordered.length - 1];
        let nearestIdx = 0;
        let minDist = Infinity;

        for (let i = 0; i < remaining.length; i++) {
          const d = getDistanceKm(current.lat, current.lng, remaining[i].lat, remaining[i].lng);
          if (d < minDist) {
            minDist = d;
            nearestIdx = i;
          }
        }
        ordered.push(remaining.splice(nearestIdx, 1)[0]);
      }

      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 1; i < ordered.length - 2; i++) {
          for (let j = i + 1; j < ordered.length - 1; j++) {
            const d1 =
              getDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[i].lat, ordered[i].lng) +
              getDistanceKm(ordered[j].lat, ordered[j].lng, ordered[j + 1].lat, ordered[j + 1].lng);
            const d2 =
              getDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[j].lat, ordered[j].lng) +
              getDistanceKm(ordered[i].lat, ordered[i].lng, ordered[j + 1].lat, ordered[j + 1].lng);

            if (d2 + 0.01 < d1) {
              const reversedSub = ordered.slice(i, j + 1).reverse();
              ordered.splice(i, j - i + 1, ...reversedSub);
              improved = true;
            }
          }
        }
      }

      return ordered;
    }

    function getTotalRouteKm(pinList) {
      let sum = 0;
      for (let i = 0; i < pinList.length - 1; i++) {
        sum += getDistanceKm(pinList[i].lat, pinList[i].lng, pinList[i + 1].lat, pinList[i + 1].lng);
      }
      return sum;
    }

    function formatKRW(num) {
      return Math.round(Number(num || 0)).toLocaleString("ko-KR") + "원";
    }
    function formatJPY(num) {
      return "¥" + Math.round(Number(num || 0)).toLocaleString("ja-JP");

    function extractUrlAndHintFromInput(rawInput) {
      if (!rawInput || typeof rawInput !== "string") {
        return { cleanUrl: null, textHint: "" };
      }
      const trimmed = rawInput.trim();
      const urlMatch = trimmed.match(/(https?:\/\/[^\s"'<>]+)/i);
      if (!urlMatch) {
        return { cleanUrl: null, textHint: trimmed };
      }
      const cleanUrl = urlMatch[1].replace(/[).,;]+$/, "");
      const textHint = trimmed
        .replace(urlMatch[0], " ")
        .replace(/Google\s*지도에서\s*보기/gi, "")
        .replace(/Shared\s*via\s*Google\s*Maps/gi, "")
        .replace(/\s+/g, " ")
        .trim();
      return { cleanUrl, textHint };
    }

    function parseGoogleMapsUrlClient(rawInput) {
      try {
        const { cleanUrl, textHint } = extractUrlAndHintFromInput(rawInput);
        const target = cleanUrl || rawInput;
        if (!target) return null;

        // 모바일 구글맵 단축 링크(maps.app.goo.gl / goo.gl)는 서버 리다이렉트 추적(/api/resolve)을 거치도록 null 반환
        if (target.includes("maps.app.goo.gl") || target.includes("goo.gl/maps") || target.includes("goo.gl/")) {
          const hasInlineCoords = /(!3d-?\d+\.\d+!4d-?\d+\.\d+|@-?\d+\.\d+,-?\d+\.\d+)/.test(target);
          if (!hasInlineCoords) return null;
        }

        const decoded = (() => {
          try {
            return decodeURIComponent(target);
          } catch (e) {
            return target;
          }
        })();

        let name = textHint || "구글 지도 공유 장소";
        const placeMatch = decoded.match(/\/maps\/(?:place|search)\/([^/@?&]+)/);
        if (placeMatch && placeMatch[1]) {
          const candidate = placeMatch[1].replace(/\+/g, " ").trim();
          if (candidate && !/^(-?\d+\.\d+),(-?\d+\.\d+)$/.test(candidate)) {
            name = candidate;
          }
        } else {
          const qMatch = decoded.match(/[?&](?:q|query)=([^&]+)/);
          if (qMatch && qMatch[1]) {
            const candidate = qMatch[1].replace(/\+/g, " ").trim();
            if (candidate && !/^(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)$/.test(candidate)) {
              name = candidate;
            }
          }
        }

        let lat = null;
        let lng = null;
        const exactMatches = [...decoded.matchAll(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g)];
        if (exactMatches.length > 0) {
          const last = exactMatches[exactMatches.length - 1];
          lat = parseFloat(last[1]);
          lng = parseFloat(last[2]);
        } else {
          const atMatch =
            decoded.match(/center=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i) ||
            decoded.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            decoded.match(/[?&](?:q|query|ll|sll|daddr)=(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/);
          if (atMatch) {
            lat = parseFloat(atMatch[1]);
            lng = parseFloat(atMatch[2]);
          }
        }

        if (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng)) {
          return {
            name,
            address: textHint || `구글 지도 링크 정확한 좌표 (${lat.toFixed(5)}, ${lng.toFixed(5)})`,
            lat,
            lng,
            spendInfo: estimateGoogleAvgSpend(name, "")
          };
        }
      } catch (e) {}
      return null;
    }

      const hasLocalMeaningfulData = (stateObj) => {
        if (!stateObj) return false;

        if (hasMeaningfulNotes(stateObj.notes)) return true;
        if (hasMeaningfulChecklist(stateObj.checklist)) return true;
        return false;
      };

      const mergeNotes = (localList, remoteList) => {
        const local = Array.isArray(localList) ? localList : [];
        const remote = Array.isArray(remoteList) ? remoteList : [];

        const hasLocal = hasMeaningfulNotes(local);
        const hasRemote = hasMeaningfulNotes(remote);

        // 로컬에만 의미 있는 메모가 있고 원격엔 내용이 없으면 로컬 절대 보존
        if (hasLocal && !hasRemote) return local;
        // 원격에만 의미 있는 메모가 있고 로컬엔 내용이 없으면 원격 적용
        if (!hasLocal && hasRemote) return remote;
        // 둘 다 의미 있는 메모가 없는 경우
        if (!hasLocal && !hasRemote) {
          return remote.length > 0 ? remote : local;
        }

        // 양쪽 모두 의미 있는 메모가 있을 때: note.id 기준 스마트 병합
        const remoteMap = new Map(remote.map((n) => [String(n.id || ""), n]));
        const merged = [];

        for (const lNote of local) {
          const key = String(lNote.id || "");
          if (remoteMap.has(key)) {
            const rNote = remoteMap.get(key);
            const lContent = String(lNote.content || "").trim();
            const rContent = String(rNote.content || "").trim();

            if (lContent.length > 0 && rContent.length === 0) {
              merged.push(lNote);
            } else if (rContent.length > 0 && lContent.length === 0) {
              merged.push(rNote);
            } else {
              const lTime = Number(lNote.updatedAtMs || Date.parse(lNote.updatedAt) || 0);
              const rTime = Number(rNote.updatedAtMs || Date.parse(rNote.updatedAt) || 0);

              if (Math.abs(lTime - rTime) > 3000) {
                merged.push(rTime > lTime ? rNote : lNote);
              } else {
                merged.push(rContent.length >= lContent.length ? rNote : lNote);
              }
            }
            remoteMap.delete(key);
          } else {
            merged.push(lNote);
          }
        }

        for (const [, rNote] of remoteMap.entries()) {
          merged.push(rNote);
        }

        return merged.slice(0, 30);
      };

      const mergeChecklist = (localList, remoteList) => {
        const local = Array.isArray(localList) ? localList : [];
        const remote = Array.isArray(remoteList) ? remoteList : [];

        const hasLocal = hasMeaningfulChecklist(local);
        const hasRemote = hasMeaningfulChecklist(remote);

        if (hasLocal && !hasRemote) return local;
        if (!hasLocal && hasRemote) return remote;
        if (!hasLocal && !hasRemote) return remote.length > 0 ? remote : local;

        const remoteMap = new Map(remote.map((c) => [String(c.id || ""), c]));
        const merged = [];

        for (const lItem of local) {
          const key = String(lItem.id || "");
          if (remoteMap.has(key)) {
            const rItem = remoteMap.get(key);
            merged.push({
              id: key,
              text: (rItem.text || "").length >= (lItem.text || "").length ? rItem.text : lItem.text,
              done: Boolean(rItem.done)
            });
            remoteMap.delete(key);
          } else {
            merged.push(lItem);
          }

        for (const [, rItem] of remoteMap.entries()) {
          merged.push(rItem);
