<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>여행 계획 | 스마트 여행 플래너</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease;
      letter-spacing: -0.015em;
    }
    button {
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea {
      -webkit-appearance: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 9999px; }

    /* ✈️ 좌측 상단 연분홍색(Soft Light Pink) 비행기 로고 배지 */
    .logo-pink-badge {
      background: linear-gradient(135deg, #ffe4e6 0%, #fbcfe8 55%, #f9a8d4 100%) !important;
      border: 1.5px solid #f472b6 !important;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.28) !important;
      color: #831843 !important;
    }
    .theme-light .logo-pink-badge {
      background: linear-gradient(135deg, #ffe4e6 0%, #fce7f3 50%, #fbcfe8 100%) !important;
      border: 1.5px solid #f472b6 !important;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.22) !important;
    }

    /* 🕒 우측 상단 타임라인 버튼 (보라색 제거 → 세련된 스카이·블루 그라데이션) */
    .timeline-btn {
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%) !important;
      border: 1px solid rgba(56, 189, 248, 0.45) !important;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.28) !important;
      color: #ffffff !important;
    }
    .timeline-btn:hover:not(:disabled) {
      filter: brightness(1.07);
    }

    /* ☀️ 라이트 모드 (밝은 화면) 글로벌 오버라이드 스타일 — 어두운 회색 박스 완전 제거 */
    .theme-light {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }
    .theme-light [class*="bg-slate-950"] {
      background-color: #f8fafc !important;
    }
    .theme-light [class*="bg-slate-900"] {
      background-color: #ffffff !important;
    }
    .theme-light [class*="bg-slate-800"] {
      background-color: #f1f5f9 !important;
    }
    .theme-light input[class*="bg-slate-"],
    .theme-light textarea[class*="bg-slate-"],
    .theme-light select[class*="bg-slate-"] {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    .theme-light input::placeholder,
    .theme-light textarea::placeholder {
      color: #94a3b8 !important;
    }
    .theme-light [class*="border-slate-800"],
    .theme-light [class*="border-slate-700"] {
      border-color: #e2e8f0 !important;
    }
    .theme-light .text-white,
    .theme-light .text-slate-100,
    .theme-light .text-slate-200 { color: #0f172a !important; }
    .theme-light .text-slate-300,
    .theme-light .text-slate-400 { color: #475569 !important; }
    .theme-light .text-amber-300 { color: #d97706 !important; }
    .theme-light .text-emerald-400,
    .theme-light .text-emerald-300 { color: #059669 !important; }
    .theme-light .text-indigo-400,
    .theme-light .text-indigo-300 { color: #4f46e5 !important; }
    .theme-light [class*="bg-indigo-950"] {
      background-color: #eef2ff !important;
    }

    /* 버튼 내부 흰색 글씨는 라이트 모드에서도 그대로 유지 */
    .theme-light .keep-white { color: #ffffff !important; }

    /* 📊 상세 영역 헤더 */
    .detail-header-card {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.6) 0%, #0f172a 100%);
    }
    .theme-light .detail-header-card {
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%) !important;
      border-color: #e2e8f0 !important;
    }

    /* 📊 구글 맵 방문객 지출 안내 카드 (어둡거나 탁한 은색/회색을 없애고 선명한 가시성 제공) */
    .google-avg-spend-box {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.5) 0%, rgba(15, 23, 42, 0.95) 50%, rgba(49, 46, 129, 0.5) 100%);
      border: 1.5px solid rgba(52, 211, 153, 0.4);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .google-avg-spend-box .spend-tag {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.35);
    }
    .google-avg-spend-box .spend-price {
      color: #fcd34d;
    }
    .google-avg-spend-box .spend-desc {
      color: #e2e8f0;
    }
    .google-avg-spend-box .spend-desc b {
      color: #ffffff;
    }

    /* ☀️ 라이트 모드: 화사하고 선명한 민트/에메랄드/화이트 프리미엄 카드 */
    .theme-light .google-avg-spend-box {
      background: linear-gradient(135deg, #ecfdf5 0%, #ffffff 50%, #f0fdfa 100%) !important;
      border: 1.5px solid #10b981 !important;
      box-shadow: 0 6px 20px -2px rgba(16, 185, 129, 0.16), 0 2px 8px -1px rgba(16, 185, 129, 0.08) !important;
    }
    .theme-light .google-avg-spend-box .spend-tag {
      background-color: #d1fae5 !important;
      color: #065f46 !important;
      border: 1px solid #6ee7b7 !important;
      font-weight: 800 !important;
    }
    .theme-light .google-avg-spend-box .spend-price {
      color: #b45309 !important;
      font-weight: 900 !important;
      font-size: 13px !important;
    }
    .theme-light .google-avg-spend-box .spend-desc {
      color: #334155 !important;
      font-size: 12px !important;
      font-weight: 600 !important;
    }
    .theme-light .google-avg-spend-box .spend-desc b {
      color: #0f172a !important;
      font-weight: 900 !important;
    }

    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.42);
      border: 2.5px solid #ffffff;
      transition: transform 0.2s ease;
      cursor: grab;
    }
    .custom-pin:active { cursor: grabbing; }
    .custom-pin span {
      transform: rotate(45deg);
      font-weight: 900;
      font-size: 13px;
      color: #ffffff !important;
    }
    .pin-active {
      animation: pulse-ring 1.5s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.85); }
      70% { box-shadow: 0 0 0 14px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }
    .traveler-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border: 3px solid #fff;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.65);
      font-size: 20px;
    }
    .my-gps-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: #3b82f6;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.9);
    }
    .route-time-badge {
      background: rgba(15, 23, 42, 0.92) !important;
      color: #fde047 !important;
      border: 1px solid #6366f1 !important;
      border-radius: 9999px !important;
      padding: 1px 7px !important;
      font-weight: 800 !important;
      font-size: 10px !important;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35) !important;
      white-space: nowrap !important;
    }
    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-radius: 14px !important;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .leaflet-popup-tip { background: #1e293b !important; }
  </style>
</head>
<body spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // 🔒 영구 고정 저장소 키 및 보안 스냅샷 금고 키
    const STORAGE_KEY_PINS = "travel_planner_master_pins";
    const STORAGE_KEY_TITLE = "travel_planner_master_title";
    const STORAGE_KEY_RATE = "travel_planner_master_rate";
    const STORAGE_KEY_NOTES = "travel_planner_master_notes";
    const STORAGE_KEY_CHECKLIST = "travel_planner_master_checklist";
    const STORAGE_KEY_THEME = "travel_planner_master_theme";
    const STORAGE_KEY_MASTER_V6 = "japan_trip_v6_master_local";
    const STORAGE_KEY_SECURITY_SNAPSHOT = "travel_planner_security_vault_v1";
    const STORAGE_KEY_AUTH_PIN = "travel_planner_auth_pin_v1";

    // 🛡️ 보안 패치: 프론트엔드에 DB 접속 키를 일절 포함하지 않고 /api/sync 보안 게이트웨이를 통해서만 통신
    const CLIENT_ID = "device-" + Math.random().toString(36).slice(2, 10) + "-" + Date.now();
    const CSRF_HEADER_VALUE = "SmartTravelPlanner-v2";

    // 🛡️ XSS(교차 사이트 스크립팅) 방어를 위한 HTML 이스케이프 함수 (지도 팝업/툴팁 보호)
    function escapeHtml(raw) {
      if (raw === null || raw === undefined) return "";
      return String(raw)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function cleanSafeText(val, maxLen = 200, fallback = "") {
      if (typeof val !== "string") return fallback;
      return val
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "")
        .trim()
        .slice(0, maxLen);
    }

    function sanitizePinList(rawPins) {
      if (!Array.isArray(rawPins)) return [];
      const safePins = [];
      for (const p of rawPins.slice(0, 100)) {
        if (!p || typeof p !== "object") continue;
        const lat = Number(p.lat);
        const lng = Number(p.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
        if (Math.abs(lat) > 90 || Math.abs(lng) > 180) continue;

        const items = Array.isArray(p.items)
          ? p.items
              .slice(0, 100)
              .filter((it) => it && typeof it === "object")
              .map((it, i) => ({
                id: cleanSafeText(String(it.id || `item-${i}`), 64, `item-${i}`).replace(
                  /[^a-zA-Z0-9_-]/g,
                  ""
                ),
                title: cleanSafeText(it.title, 100, "지출 항목"),
                price: Math.max(0, Math.min(1000000000, Math.round(Number(it.price) || 0))),
                yen: Math.max(0, Math.min(100000000, Math.round(Number(it.yen) || 0))),
                bought: Boolean(it.bought)
              }))
          : [];

        safePins.push({
          id: cleanSafeText(String(p.id || `pin-${Date.now()}`), 64, `pin-${Date.now()}`).replace(
            /[^a-zA-Z0-9_-]/g,
            ""
          ),
          name: cleanSafeText(p.name, 120, "여행 장소"),
          category: cleanSafeText(p.category, 40, "📸 명소·포토존"),
          address: cleanSafeText(p.address, 300, ""),
          lat,
          lng,
          completed: Boolean(p.completed),
          memo: typeof p.memo === "string" ? p.memo.slice(0, 2000) : "",
          customTransitMinutes:
            p.customTransitMinutes !== null && p.customTransitMinutes !== undefined
              ? Math.max(0, Math.min(10000, Math.round(Number(p.customTransitMinutes) || 0))) || null
              : null,
          spendInfo: p.spendInfo && typeof p.spendInfo === "object" ? p.spendInfo : null,
          items
        });
      }
      return safePins;
    }

    const DEFAULT_NOTE_PAD = [
      {
        id: "note-main",
        title: "✈️ 우리들의 여행 자유 메모장",
        content: "",
        updatedAt: new Date().toLocaleString("ko-KR")
      },
      {
        id: "note-food",
        title: "🍜 가보고 싶은 맛집 & 간식 리스트",
        content: "",
        updatedAt: new Date().toLocaleString("ko-KR")
      },
      {
        id: "note-info",
        title: "🏨 항공편 · 숙소 예약번호 · 중요 메모",
        content: "",
        updatedAt: new Date().toLocaleString("ko-KR")
      }
    ];

    function loadSavedPinsWithMigration() {
      try {
        const masterData = localStorage.getItem(STORAGE_KEY_PINS);
        if (masterData) {
          const parsed = sanitizePinList(JSON.parse(masterData));
          if (parsed.length > 0) return parsed;
        }

        const v6Raw = localStorage.getItem(STORAGE_KEY_MASTER_V6);
        if (v6Raw) {
          const parsedV6 = JSON.parse(v6Raw);
          if (parsedV6 && Array.isArray(parsedV6.pins)) {
            const safeV6 = sanitizePinList(parsedV6.pins);
            if (safeV6.length > 0) {
              localStorage.setItem(STORAGE_KEY_PINS, JSON.stringify(safeV6));
              return safeV6;
            }
          }
        }

        const legacyKeys = [
          "travel_planner_pins_v13",
          "travel_planner_pins_v12",
          "travel_planner_pins_v11",
          "travel_planner_pins_v10",
          "travel_planner_pins_v9",
          "travel_planner_pins_v8",
          "travel_planner_pins_v7",
          "travel_planner_pins_v6",
          "travel_planner_pins_v5",
          "travel_planner_pins_v4",
          "travel_planner_pins"
        ];

        for (const key of legacyKeys) {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          try {
            const arr = sanitizePinList(JSON.parse(raw));
            if (arr.length === 0) continue;
            const hasUserCreatedPin = arr.some(
              (p) =>
                p &&
                typeof p.id === "string" &&
                !["pin-101", "pin-102", "pin-103", "pin-104"].includes(p.id)
            );
            if (hasUserCreatedPin) {
              localStorage.setItem(STORAGE_KEY_PINS, JSON.stringify(arr));
              return arr;
            }
          } catch (e) {}
        }
        return [];
      } catch (e) {
        return [];
      }
    }

    function loadSavedTitleWithMigration() {
      const master = localStorage.getItem(STORAGE_KEY_TITLE);
      if (master) return cleanSafeText(master, 80, "우리의 일본 여행 ✈️");
      for (let i = 13; i >= 4; i--) {
        const old = localStorage.getItem(`travel_planner_title_v${i}`);
        if (old && old !== "여행 계획") return cleanSafeText(old, 80, "우리의 일본 여행 ✈️");
      }
      return "우리의 일본 여행 ✈️";
    }

    // 📊 구글 맵 빅데이터 기반 장소/카테고리별 1인당 평균 사용 금액 추론 엔진
    function estimateGoogleAvgSpend(name = "", category = "") {
      const text = `${name} ${category}`.toLowerCase();

      if (/usj|유니버설|디즈니|테마파크|universal|disney/.test(text) || category.includes("테마파크")) {
        return {
          minYen: 8600,
          maxYen: 11000,
          avgYen: 9800,
          label: "¥8,600 ~ ¥11,000",
          desc: "구글 맵 테마파크 입장권·식음료 리포트 기준",
          recommendedTitle: "1인 평균 입장권·식음료"
        };
      }
      if (/호텔|숙소|료칸|아마넥|칸데오|도미인|토요코인|아파|hotel|inn|resort|hostel/.test(text) || category.includes("숙소")) {
        return {
          minYen: 7500,
          maxYen: 15000,
          avgYen: 11000,
          label: "¥7,500 ~ ¥15,000",
          desc: "구글 맵 호텔 투숙객 1인당 1박 평균 금액",
          recommendedTitle: "숙소 1인 평균 숙박비"
        };
      }
      if (/스시|초밥|야키니쿠|이자카야|장어|카이센동|고베규|와규|sushi|yakiniku|izakaya/.test(text)) {
        return {
          minYen: 3000,
          maxYen: 6000,
          avgYen: 4200,
          label: "¥3,000 ~ ¥6,000",
          desc: "구글 맵 리뷰어 인당 평균 식사·주류 지출액",
          recommendedTitle: "1인 평균 식사비"
        };
      }
      if (/이치란|라멘|우동|소바|규동|타코야키|오코노미야키|쿠시카츠|돈카츠|카레|ramen|udon/.test(text) || category.includes("맛집")) {
        return {
          minYen: 1000,
          maxYen: 2000,
          avgYen: 1400,
          label: "¥1,000 ~ ¥2,000",
          desc: "구글 맵 리뷰어 인당 평균 식사 지출액",
          recommendedTitle: "1인 평균 식사비"
        };
      }
      if (/카페|커피|스타벅스|디저트|베이커리|빵|모리츠|cafe|coffee|bakery/.test(text) || category.includes("카페")) {
        return {
          minYen: 600,
          maxYen: 1400,
          avgYen: 950,
          label: "¥600 ~ ¥1,400",
          desc: "구글 맵 카페·디저트 인당 평균 지출액",
          recommendedTitle: "1인 평균 음료·디저트"
        };
      }
      if (/돈키호테|드럭스토어|백화점|쇼핑|아울렛|유니클로|파르코|마츠모토|donki|mall/.test(text) || category.includes("쇼핑")) {
        return {
          minYen: 3500,
          maxYen: 10000,
          avgYen: 5500,
          label: "¥3,500 ~ ¥10,000",
          desc: "구글 맵 쇼핑·드럭스토어 방문객 평균 구매액",
          recommendedTitle: "1인 평균 쇼핑 예산"
        };
      }
      if (/공항|역|터미널|라피트|하루카|신칸센|airport|station/.test(text) || category.includes("공항")) {
        return {
          minYen: 1200,
          maxYen: 3000,
          avgYen: 1800,
          label: "¥1,200 ~ ¥3,000",
          desc: "구글 맵 공항·특급열차 1인 평균 교통비",
          recommendedTitle: "1인 평균 특급열차·교통비"
        };
      }

      return {
        minYen: 1000,
        maxYen: 2500,
        avgYen: 1500,
        label: "¥1,000 ~ ¥2,500",
        desc: "구글 맵 관람·간식·입장료 인당 평균 지출액",
        recommendedTitle: "1인 평균 입장·현장 지출"
      };

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function formatMinutesToKorean(mins) {
      const m = Math.round(Number(mins) || 0);
      if (m <= 0) return "1분";
      const hours = Math.floor(m / 60);
      const remMins = m % 60;
      if (hours > 0 && remMins > 0) return `${hours}시간 ${remMins}분`;
      if (hours > 0) return `${hours}시간`;
      return `${remMins}분`;
    }

    function estimateTransitInfo(pinA, pinB) {
      if (!pinA || !pinB) return null;
      const straightKm = getDistanceKm(pinA.lat, pinA.lng, pinB.lat, pinB.lng);

      const walkRoadKm = straightKm * 1.28;
      const walkMinutes = Math.max(2, Math.round((walkRoadKm / 4.5) * 60));
      const walkFormatted = formatMinutesToKorean(walkMinutes);

      let transitMinutes = 0;
      let transitMode = "";

      if (pinB.customTransitMinutes && Number(pinB.customTransitMinutes) > 0) {
        transitMinutes = Number(pinB.customTransitMinutes);
        transitMode = "🚇 대중교통(직접지정)";
      } else if (straightKm < 0.55) {
        transitMinutes = walkMinutes;
        transitMode = "🚶 도보권";
      } else if (straightKm < 15) {
        transitMinutes = Math.round(((straightKm * 1.25) / 24) * 60 + 7);
        transitMode = "🚇 지하철·시내버스";
      } else if (straightKm < 65) {
        transitMinutes = Math.round(((straightKm * 1.2) / 45) * 60 + 12);
        transitMode = "🚆 급행전철·공항특급";
      } else {
        transitMinutes = Math.round((straightKm / 120) * 60 + 22);
        transitMode = "🚄 신칸센·특급열차";
      }

      const transitFormatted = formatMinutesToKorean(transitMinutes);

      return {
        distanceKm: straightKm.toFixed(1),
        walkMinutes,
        walkFormatted,
        transitMinutes,
        transitFormatted,
        totalMinutes: transitMinutes,
        formatted: transitFormatted,
        mode: transitMode
      };
    }

    function optimizePinsShortestRoute(pinList) {
      if (!pinList || pinList.length <= 2) return pinList;

      const startPin = pinList[0];
      const remaining = pinList.slice(1);
      const ordered = [startPin];

      while (remaining.length > 0) {
        const current = ordered[ordered.length - 1];
        let nearestIdx = 0;
        let minDist = Infinity;

        for (let i = 0; i < remaining.length; i++) {
          const d = getDistanceKm(current.lat, current.lng, remaining[i].lat, remaining[i].lng);
          if (d < minDist) {
            minDist = d;
            nearestIdx = i;
          }
        }
        ordered.push(remaining.splice(nearestIdx, 1)[0]);
      }

      let improved = true;
      while (improved) {
        improved = false;
        for (let i = 1; i < ordered.length - 2; i++) {
          for (let j = i + 1; j < ordered.length - 1; j++) {
            const d1 =
              getDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[i].lat, ordered[i].lng) +
              getDistanceKm(ordered[j].lat, ordered[j].lng, ordered[j + 1].lat, ordered[j + 1].lng);
            const d2 =
              getDistanceKm(ordered[i - 1].lat, ordered[i - 1].lng, ordered[j].lat, ordered[j].lng) +
              getDistanceKm(ordered[i].lat, ordered[i].lng, ordered[j + 1].lat, ordered[j + 1].lng);

            if (d2 + 0.01 < d1) {
              const reversedSub = ordered.slice(i, j + 1).reverse();
              ordered.splice(i, j - i + 1, ...reversedSub);
              improved = true;
            }
          }
        }
      }

      return ordered;
    }

    function getTotalRouteKm(pinList) {
      let sum = 0;
      for (let i = 0; i < pinList.length - 1; i++) {
        sum += getDistanceKm(pinList[i].lat, pinList[i].lng, pinList[i + 1].lat, pinList[i + 1].lng);
      }
      return sum;
    }

    function extractUrlAndHintFromInput(rawInput) {
      if (!rawInput || typeof rawInput !== "string") {
        return { cleanUrl: null, textHint: "" };
      }
      const trimmed = rawInput.trim();
      const urlMatch = trimmed.match(/(https?:\/\/[^\s"'<>]+)/i);
      if (!urlMatch) {
        return { cleanUrl: null, textHint: trimmed };
      }
      const cleanUrl = urlMatch[1].replace(/[).,;]+$/, "");
      const textHint = trimmed
        .replace(urlMatch[0], " ")
        .replace(/Google\s*지도에서\s*보기/gi, "")
        .replace(/Shared\s*via\s*Google\s*Maps/gi, "")
        .replace(/\s+/g, " ")
        .trim();
      return { cleanUrl, textHint };
    }

    function parseGoogleMapsUrlClient(rawInput) {
      try {
        const { cleanUrl, textHint } = extractUrlAndHintFromInput(rawInput);
        const target = cleanUrl || rawInput;
        if (!target) return null;

        // 모바일 구글맵 단축 링크(maps.app.goo.gl / goo.gl)는 서버 리다이렉트 추적(/api/resolve)을 거치도록 null 반환
        if (target.includes("maps.app.goo.gl") || target.includes("goo.gl/maps") || target.includes("goo.gl/")) {
          const hasInlineCoords = /(!3d-?\d+\.\d+!4d-?\d+\.\d+|@-?\d+\.\d+,-?\d+\.\d+)/.test(target);
          if (!hasInlineCoords) return null;
        }

        const decoded = (() => {
          try {
            return decodeURIComponent(target);
          } catch (e) {
            return target;
          }
        })();

        let name = textHint || "구글 지도 공유 장소";
        const placeMatch = decoded.match(/\/maps\/(?:place|search)\/([^/@?&]+)/);
        if (placeMatch && placeMatch[1]) {
          const candidate = placeMatch[1].replace(/\+/g, " ").trim();
          if (candidate && !/^(-?\d+\.\d+),(-?\d+\.\d+)$/.test(candidate)) {
            name = candidate;
          }
        } else {
          const qMatch = decoded.match(/[?&](?:q|query)=([^&]+)/);
          if (qMatch && qMatch[1]) {
            const candidate = qMatch[1].replace(/\+/g, " ").trim();
            if (candidate && !/^(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)$/.test(candidate)) {
              name = candidate;
            }
          }
        }

        let lat = null;
        let lng = null;
        const exactMatches = [...decoded.matchAll(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g)];
        if (exactMatches.length > 0) {
          const last = exactMatches[exactMatches.length - 1];
          lat = parseFloat(last[1]);
          lng = parseFloat(last[2]);
        } else {
          const atMatch =
            decoded.match(/center=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i) ||
            decoded.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            decoded.match(/[?&](?:q|query|ll|sll|daddr)=(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/);
          if (atMatch) {
            lat = parseFloat(atMatch[1]);
            lng = parseFloat(atMatch[2]);
          }
        }

        if (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng)) {
          return {
            name,
            address: textHint || `구글 지도 링크 정확한 좌표 (${lat.toFixed(5)}, ${lng.toFixed(5)})`,
            lat,
            lng,
            spendInfo: estimateGoogleAvgSpend(name, "")
          };
        }
      } catch (e) {}
      return null;
    }
